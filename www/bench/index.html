<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nanvix Benchmarks</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.1/dist/chart.umd.min.js" integrity="sha384-jb8JQMbMoBUzgWatfe6COACi2ljcDdZQ2OxczGA3bGNeWe+6DChMTBJemed7ZnvJ" crossorigin="anonymous"></script>
</head>
<body>
  <header>
    <div class="header-left">
      <h1 id="commit-label">No data</h1>
      <span id="runner-label" class="badge"></span>
    </div>
    <div class="header-right">
      <label for="bench-select">benchmark</label>
      <select id="bench-select" disabled>
        <option value="">—</option>
      </select>
    </div>
  </header>
  <main>
    <div id="charts"></div>
    <p id="status" class="status">Waiting for data…</p>
  </main>
  <script src="app.js"></script>
</body>
</html>
