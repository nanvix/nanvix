[package]
name = "nanvix-test"
version.workspace = true
license-file.workspace = true
edition = "2024"
authors.workspace = true
description = "Test Utility for Nanvix"
homepage.workspace = true

[dependencies]
anyhow = { workspace = true }
log = { workspace = true }
nanvixd = { workspace = true, default-features = false }
nanvix = { workspace = true, features = ["internal-api"] }
no_fail = { workspace = true, features = ["std"] }
tokio = { workspace = true, features = ["full"] }
tokio-util = { workspace = true }
chrono = { workspace = true }
serde = { workspace = true, features = ["derive"] }
toml = { workspace = true }
shell-words = { workspace = true }
globset = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }
reqwest = { workspace = true, features = ["json"] }

[dev-dependencies]
cmdline = { workspace = true, features = ["std"] }

[features]
default = ["microvm", "multi-process"]
single-process = ["nanvix/single-process", "nanvixd/single-process"]
multi-process = ["nanvix/multi-process", "nanvixd/multi-process"]
standalone = ["nanvix/standalone", "nanvixd/standalone"]
microvm = ["nanvix/microvm", "nanvixd/microvm"]
whp = ["nanvix/whp", "nanvixd/whp"]

[lints]
workspace = true
