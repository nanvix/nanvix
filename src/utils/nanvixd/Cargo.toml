[package]
name = "nanvixd"
version = "0.1.0"
license-file = "LICENSE.txt"
edition = "2021"
authors = ["The Maintainers of Nanvix"]
description = "Orchestration Daemon for the Nanvix"
homepage = "https://github.com/nanvix"

[dependencies]
anyhow = "1.0.93"
flexi_logger = "0.29.6"
log = "0.4.22"
serde = { version = "1.0.215", features = ["derive"] }
serde_json = "1.0.133"
hyper = { version = "1.5.1", features = ["full"] }
tokio = { version = "1.41.1", features = ["full"] }
http-body-util = "0.1.2"
hyper-util = { version = "0.1.10", features = ["full"] }
nvx = { path = "../../libs/nvx", features = ["std"] }

[profile.release]
opt-level = 3
debug = false
strip = "symbols"
debug-assertions = false
overflow-checks = true
lto = "fat"
panic = 'abort'
incremental = false
codegen-units = 1
rpath = false
