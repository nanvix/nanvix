[package]
name = "echo-client"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0.95"
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.128"
flexi_logger = "0.29.8"
log = "0.4.22"
hyper = { version = "1.5.0", features = ["full"] }
tokio = { version = "1.41.1", features = ["full"] }
http-body-util = "0.1.2"
hyper-util = { version = "0.1.9", features = ["full"] }

[profile.release]
opt-level = 3
debug = false
strip = "symbols"
debug-assertions = false
overflow-checks = true
lto = "fat"
panic = 'abort'
incremental = false
codegen-units = 1
rpath = false
