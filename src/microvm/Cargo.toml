[package]
name = "microvm"
authors = ["The Maintainers of Nanvix"]
version = "1.2.2"
edition = "2021"

[dependencies]
anyhow = "1.0.95"
flexi_logger = "0.29.8"
log = "0.4.22"
kernel = { path = "../kernel", default-features = false }
cfg-if = "1.0.0"

[target.'cfg(target_os = "linux")'.dependencies]
kvm-bindings = "0.10.0"
kvm-ioctls = "0.19.0"
libc = "0.2.169"

[features]
default = []
profiler = ["auto-calibrate"]
auto-calibrate = []
