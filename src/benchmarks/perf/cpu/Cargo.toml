[package]
name = "cpu"
version = "0.1.0"
license-file = "LICENSE.txt"
edition = "2021"
authors = ["The Maintainers of Nanvix"]
description = "CPU-Bound Microbenchmark"
homepage = "https://github.com/nanvix"

[[bin]]
name = "cpu"

[dependencies]
nvx = { path = "../../../nvx"}

[build-dependencies]
cc = "1.1.24"
cfg-if = "1.0.0"

[profile.release]
opt-level = 3
debug = false
strip = "symbols"
debug-assertions = false
overflow-checks = true
lto = "fat"
panic = "abort"
incremental = false
codegen-units = 1
rpath = false