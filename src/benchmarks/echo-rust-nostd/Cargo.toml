[package]
name = "echo-rust-nostd"
version.workspace = true
license-file.workspace = true
edition.workspace = true
authors.workspace = true
description = "Echo Benchmark for Rust"
homepage.workspace = true

[[bin]]
name = "echo-rust-nostd"

[dependencies]
nvx = { workspace = true }
nvx-crt0 = { workspace = true, features = ["rust-main", "provides-allocator"] }
libc_string = { workspace = true }
sys = { workspace = true }
sysapi = { workspace = true }
syscall = { workspace = true, features = ["syscall"] }
sysalloc = { workspace = true }

[build-dependencies]
cc = { workspace = true }
cfg-if = { workspace = true }

[features]
default = ["panic"]
trace = ["nvx/trace", "nvx-crt0/trace"]
debug = ["nvx/debug", "nvx-crt0/debug"]
info = ["nvx/info", "nvx-crt0/info"]
warn = ["nvx/warn", "nvx-crt0/warn"]
error = ["nvx/error", "nvx-crt0/error"]
panic = ["nvx/panic", "nvx-crt0/panic"]

[lints]
workspace = true
