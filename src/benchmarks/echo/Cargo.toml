[package]
name = "echo"
version.workspace = true
license-file.workspace = true
edition.workspace = true
authors.workspace = true
description = "Echo Benchmark"
homepage.workspace = true

[[bin]]
name = "echo"

[dependencies]
nvx = { workspace = true, features = ["allocator"] }
posix = { workspace = true, features = ["syscall", "allocator"] }

[build-dependencies]
cc = { workspace = true }
cfg-if = { workspace = true }

[features]
default = ["panic"]
trace = ["nvx/trace"]
debug = ["nvx/debug"]
info = ["nvx/info"]
warn = ["nvx/warn"]
error = ["nvx/error"]
panic = ["nvx/panic"]
