[package]
name = "echo"
version = "0.0.6"
license-file = "LICENSE.txt"
edition = "2021"
authors = ["The Maintainers of Nanvix"]
description = "Echo Benchmark"
homepage = "https://github.com/nanvix"

[[bin]]
name = "echo"

[dependencies]
nvx = { path = "../../libs/nvx", features = ["allocator"] }
linuxd = { path = "../../libs/posix", default-features = false, features = [
    "syscall", "allocator",
], package = "posix" }

[build-dependencies]
cc = "1.2.6"
cfg-if = "1.0.0"
