[package]
name = "vfs-bench-nostd"
version.workspace = true
license-file.workspace = true
edition.workspace = true
authors.workspace = true
description = "VFS Benchmark for Rust"
homepage.workspace = true

[[bin]]
name = "vfs-bench-nostd"

[dependencies]
nvx = { workspace = true }
nvx-crt0 = { workspace = true, features = ["rust-main", "provides-allocator"] }
libc_string = { workspace = true }
sys = { workspace = true }
sysalloc = { workspace = true }
sysapi = { workspace = true }
syscall = { workspace = true, features = ["syscall"] }
vfs-bench-common = { workspace = true }

[build-dependencies]
build-utils = { workspace = true }
fatfs = { workspace = true, features = ["std", "alloc", "lfn"] }
mkramfs = { workspace = true }
rand = { workspace = true }
vfs-bench-common = { workspace = true }

[features]
default = ["panic"]
trace = ["nvx/trace", "syscall/trace", "nvx-crt0/trace"]
debug = ["nvx/debug", "syscall/debug", "nvx-crt0/debug"]
info = ["nvx/info", "syscall/info", "nvx-crt0/info"]
warn = ["nvx/warn", "syscall/warn", "nvx-crt0/warn"]
error = ["nvx/error", "syscall/error", "nvx-crt0/error"]
panic = ["nvx/panic", "syscall/panic", "nvx-crt0/panic"]

[lints]
workspace = true
