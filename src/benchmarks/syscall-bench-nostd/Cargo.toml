[package]
name = "syscall-bench-nostd"
version.workspace = true
license-file.workspace = true
edition.workspace = true
authors.workspace = true
description = "Syscall Latency Microbenchmark"
homepage.workspace = true

[[bin]]
name = "syscall-bench-nostd"

[dependencies]
cfg-if = { workspace = true }
nvx = { workspace = true }
libc_string = { workspace = true }
sys = { workspace = true }
sysapi = { workspace = true }
syscall = { workspace = true, features = ["syscall"] }
sysalloc = { workspace = true }

[build-dependencies]
cc = { workspace = true }
cfg-if = { workspace = true }

[features]
default = ["panic"]
ipc-bench = []
payload-sweep = []
payload-sweep-only = ["payload-sweep"]
trace = ["nvx/trace"]
debug = ["nvx/debug"]
info = ["nvx/info"]
warn = ["nvx/warn"]
error = ["nvx/error"]
panic = ["nvx/panic"]

[lints]
workspace = true
