[package]
name = "networkd"
version.workspace = true
license-file.workspace = true
edition.workspace = true
authors.workspace = true
description = "Network Daemon for Nanvix"
homepage.workspace = true

[lib]
name = "networkd"
path = "src/lib.rs"

[dependencies]
log = { workspace = true }
net-backend = { workspace = true }
sys = { workspace = true, features = ["std"] }
syscall = { workspace = true, features = ["std"] }
sysapi = { workspace = true, features = ["std"] }

# The decoupled server transport (and its `networkd` binary) and the epoll wrapper are Linux-only,
# matching how the UserVM gates its own dependency on `syscomm`. Keeping these out of the
# all-platform dependency set ensures the `networkd` library still builds on Windows, where the
# UserVM links it in-process for standalone mode.
[target.'cfg(target_os = "linux")'.dependencies]
libc = { workspace = true }
syscomm = { workspace = true }

[target.'cfg(target_os = "linux")'.dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }

[features]
default = []

[lints]
workspace = true
