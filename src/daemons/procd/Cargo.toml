[package]
name = "procd"
version.workspace = true
license-file.workspace = true
edition.workspace = true
authors.workspace = true
description = "Process Management Daemon"
homepage.workspace = true

[dependencies]
proc = { workspace = true, features = ["daemon"] }
nvx = { workspace = true }

[build-dependencies]
cc = { workspace = true }
cfg-if = { workspace = true }

[features]
default = ["panic"]
trace = ["nvx/trace"]
debug = ["nvx/debug"]
info = ["nvx/info"]
warn = ["nvx/warn"]
error = ["nvx/error"]
panic = ["nvx/panic"]
