[package]
name = "linuxd"
version = "0.4.0"
license-file = "LICENSE.txt"
edition = "2021"
authors = ["The Maintainers of Nanvix"]
description = "Linux Provider Daemon"
homepage = "https://github.com/nanvix"

[dependencies]
nvx = { path = "../../libs/nvx", features = ["std"] }
posix = { path = "../../libs/posix", default-features = false }
anyhow = "1.0.95"
log = "0.4.22"
flexi_logger = "0.29.6"
libc = "0.2.164"
signal-hook = "0.3.17"

[profile.release]
opt-level = 3
debug = false
strip = "symbols"
debug-assertions = false
overflow-checks = true
lto = "fat"
panic = 'abort'
incremental = false
codegen-units = 1
rpath = false
