[package]
name = "linuxd"
version.workspace = true
license-file.workspace = true
edition.workspace = true
authors.workspace = true
description = "Linux Provider Daemon"
homepage.workspace = true

[lib]
name = "linuxd"
path = "src/lib.rs"

[[bin]]
name = "linuxd"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
config = { workspace = true }
flexi_logger = { workspace = true }
libc = { workspace = true }
log = { workspace = true }
mio = { workspace = true, features = ["net", "os-poll"] }
num_enum = { workspace = true }
profiler = { workspace = true }
signal-hook = { workspace = true }
slab_external = { workspace = true }
sys = { workspace = true, features = ["std"] }
sysapi = { workspace = true, features = ["std"] }
syscall = { workspace = true, features = ["std"] }
syscomm = { workspace = true }

[features]
default = []
timestamp-messages = ["profiler/timestamp-messages"]
