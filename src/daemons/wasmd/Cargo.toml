[package]
name = "wasmd"
version = "0.0.1"
license-file = "LICENSE.txt"
edition = "2021"
authors = ["The Maintainers of Nanvix"]
description = "WASM Daemon"
homepage = "https://github.com/nanvix"

[[bin]]
name = "wasmd"

[dependencies]
wasmi = { version = "0.36.0", default-features = false, features = [
    "no-hash-maps",
] }
nvx = { path = "../../libs/nvx", features = ["allocator"] }
posix = { path = "../../libs/posix", default-features = false, features = ["syscall", "allocator"] }

[build-dependencies]
cc = "1.1.24"
cfg-if = "1.0.0"

[dev-dependencies]
wasm-bindgen = "0.2.93"
