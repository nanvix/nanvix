[package]
name = "memd"
version = "0.0.9"
license-file = "LICENSE.txt"
edition = "2021"
authors = ["The Maintainers of Nanvix"]
description = "Memory Management Daemon"
homepage = "https://github.com/nanvix"

[[bin]]
name = "memd"

[dependencies]
nvx = { path = "../../libs/nvx" }
procd = { path = "../../libs/procd", features = ["syscall"] }

[build-dependencies]
cc = "1.1.24"
cfg-if = "1.0.0"
