[package]
name = "uservm"
version.workspace = true
license-file.workspace = true
edition = "2024"
authors.workspace = true
homepage.workspace = true

[lib]
name = "uservm"
path = "src/lib.rs"

[[bin]]
name = "uservm"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
arch = { workspace = true, features = ["cpuid", "msr"] }
serde_cbor = { workspace = true }
cfg-if = { workspace = true }
config = { workspace = true }
control-plane-api = { workspace = true }
elf = { workspace = true, features = ["std"] }
fatfs = { workspace = true }
gdbstub = { workspace = true, optional = true }
gdbstub_arch = { workspace = true, optional = true }
log = { workspace = true }
mkramfs = { workspace = true }
multibin = { workspace = true, features = ["std"] }
multiimage = { workspace = true, features = ["std"] }
profiler = { workspace = true, features = ["auto-calibrate"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["std"], optional = true }
static_assert = { workspace = true }
sys = { workspace = true, features = ["std"] }
syscall = { workspace = true }
syslog = { workspace = true, features = ["std"] }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["full"] }

[target.'cfg(target_os = "linux")'.dependencies]
kvm-bindings = { workspace = true, features = ["fam-wrappers", "serde"] }
kvm-ioctls = { workspace = true }
libc = { workspace = true }
syscomm = { workspace = true }
user-vm-api = { workspace = true }
vmm-sys-util = { workspace = true }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { workspace = true }

[features]
default = ["microvm"]
gdb = ["microvm", "dep:gdbstub", "dep:gdbstub_arch"]
microvm = ["config/microvm"]
whp = ["config/whp"]
# Enables fine-grained time profiling.
profile-time = ["dep:serde_json"]
timestamp-messages = ["profiler/timestamp-messages"]

[lints]
workspace = true
