[package]
name = "uservm"
version.workspace = true
license-file.workspace = true
edition = "2024"
authors.workspace = true
homepage.workspace = true

[lib]
name = "uservm"
path = "src/lib.rs"

[[bin]]
name = "uservm"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
arch = { workspace = true, features = ["cpuid", "msr"] }
serde_cbor = { workspace = true }
cfg-if = { workspace = true }
config = { workspace = true }
elf = { workspace = true, features = ["std"] }
gdbstub = { workspace = true, optional = true }
gdbstub_arch = { workspace = true, optional = true }
hostfs-api = { workspace = true }
hostfsd = { workspace = true }
koptions = { workspace = true, features = ["std"] }
log = { workspace = true }
multibin = { workspace = true, features = ["std"] }
multiimage = { workspace = true, features = ["std"] }
nanvix-sandbox-config = { workspace = true }
networkd = { workspace = true }
profiler = { workspace = true, features = ["auto-calibrate"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["std"], optional = true }
static_assert = { workspace = true }
sys = { workspace = true, features = ["std"] }
syscall = { workspace = true, default-features = false }
syslog = { workspace = true, features = ["std"] }
tokio = { workspace = true, features = ["full"] }
user-vm-api = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
kvm-bindings = { workspace = true, features = ["fam-wrappers", "serde"] }
kvm-ioctls = { workspace = true }
libc = { workspace = true }
vmm-sys-util = { workspace = true }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { workspace = true }

[features]
default = ["microvm"]
gdb = ["microvm", "dep:gdbstub", "dep:gdbstub_arch"]
microvm = ["config/microvm"]
whp = ["microvm", "config/whp"]
# Enables fine-grained time profiling.
profile-time = ["dep:serde_json"]
# Enables nightly performance optimizations that trade defensive guarantees for
# speed. Enabled automatically for release builds (RELEASE=yes). Currently this
# skips zero-filling the BSS region of loaded ELF segments, relying on the VMM
# backends allocating zero-filled guest physical memory.
nightly-performance-optimizations = []

[lints]
workspace = true
