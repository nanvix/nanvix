[package]
name = "linux-app"
version.workspace = true
license-file.workspace = true
edition.workspace = true
authors.workspace = true
description = "Linux App Benchmark"
homepage.workspace = true

[[bin]]
name = "linux-app"

[dependencies]
libc_string = { workspace = true }
sys = { workspace = true }
nvx = { workspace = true }
sysapi = { workspace = true }
syscall = { workspace = true, features = ["syscall"] }
syslog = { workspace = true, default-features = true }

[build-dependencies]
cc = { workspace = true }
cfg-if = { workspace = true }

[features]
default = ["panic"]
trace = ["nvx/trace"]
debug = ["nvx/debug"]
info = ["nvx/info"]
warn = ["nvx/warn"]
error = ["nvx/error"]
panic = ["nvx/panic"]

[lints]
workspace = true
