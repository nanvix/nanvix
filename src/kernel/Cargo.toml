[package]
name = "kernel"
version = "1.5.0"
license-file = "LICENSE.txt"
edition = "2021"
authors = ["The Maintainers of Nanvix"]
description = "Nanvix Kernel"
homepage = "https://github.com/nanvix"

[lib]
name = "sys"
path = "src/lib.rs"

[[bin]]
name = "kernel"
path = "src/kmain.rs"

[dependencies]
cfg-if = "1.0.0"

[build-dependencies]
cc = "1.2.3"
cfg-if = "1.0.0"

[features]
default = ["qemu-pc"]

# Machine Types
microvm = [
    "stdio",
    "acpi",
    "cpuid",
    "ioapic",
    "madt",
    "msr",
    "pic",
    "xapic",
]
pc = [
    "bios",
    "cmos",
    "mboot",
    "pit",
    "warn",
    "acpi",
    "cpuid",
    "ioapic",
    "madt",
    "msr",
    "pic",
    "xapic",
]
qemu-pc = ["pc"]
qemu-pc-smp = ["qemu-pc", "smp"]
qemu-baremetal = ["pc"]
qemu-baremetal-smp = ["qemu-baremetal", "smp"]
qemu-isapc = ["pc"]

# Architecture Features
acpi = []
cpuid = []
ioapic = []
madt = []
msr = []
pic = []
xapic = []

# Platform Features
smp = []
bios = []
cmos = []
mboot = []
pit = []
stdio = []

# Interface Features
kcall = []

# Logging Features
trace = ["debug"]
debug = ["info"]
info = ["warn"]
warn = ["error"]
error = []
