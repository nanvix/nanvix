[package]
name = "kernel"
version.workspace = true
license-file.workspace = true
edition.workspace = true
authors.workspace = true
description = "Nanvix Kernel"
homepage.workspace = true

[[bin]]
name = "kernel"
path = "src/kmain.rs"

[dependencies]
bitmap = { workspace = true }
cfg-if = { workspace = true }
config = { workspace = true, optional = true }
raw-array = { workspace = true }
slab = { workspace = true }
sys = { workspace = true }
hyperlight_common = { workspace = true, optional = true }

[build-dependencies]
cc = { workspace = true }
cfg-if = { workspace = true }

[features]
default = ["microvm"]

# Machine Types
hyperlight = [
    "sys/hyperlight",
    "putb",
    "puts",
    "stdio",
    "acpi",
    "cpuid",
    "ioapic",
    "madt",
    "msr",
    "pic",
    "xapic",
    "dep:hyperlight_common",
    "dep:config",
    "config/hyperlight",
]
microvm = [
    "sys/microvm",
    "putb",
    "stdio",
    "acpi",
    "cpuid",
    "ioapic",
    "madt",
    "msr",
    "pic",
    "xapic",
    "dep:config",
    "config/microvm",
]
pc = [
    "sys/pc",
    "putb",
    "bios",
    "cmos",
    "mboot",
    "pit",
    "warn",
    "acpi",
    "cpuid",
    "ioapic",
    "madt",
    "msr",
    "pic",
    "xapic",
    "dep:config",
    "config/pc",
]
qemu-pc = ["sys/qemu-pc", "pc"]
qemu-pc-smp = ["sys/qemu-pc-smp", "qemu-pc", "smp"]
qemu-baremetal = ["sys/qemu-baremetal", "pc"]
qemu-baremetal-smp = ["sys/qemu-baremetal-smp", "qemu-baremetal", "smp"]
qemu-isapc = ["sys/qemu-isapc", "pc"]

# Architecture Features
acpi = []
cpuid = []
ioapic = []
madt = []
msr = []
pic = []
xapic = []

# Platform Features
smp = []
bios = []
cmos = []
mboot = []
pit = []
putb = []
puts = []
stdio = []

# Interface Features
kcall = []

# Logging Features
trace = ["debug"]
debug = ["info"]
info = ["warn"]
warn = ["error"]
error = []
