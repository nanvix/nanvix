[package]
name = "kernel"
version.workspace = true
license-file.workspace = true
edition.workspace = true
authors.workspace = true
description = "Nanvix Kernel"
homepage.workspace = true

[[bin]]
name = "kernel"
path = "src/kmain.rs"

[dependencies]
arch = { workspace = true }
bitmap = { workspace = true }
bump-allocator = { workspace = true }
cfg-if = { workspace = true }
config = { workspace = true, optional = true }
elf = { workspace = true }
mmio-tag = { workspace = true }
no_fail = { workspace = true }
type-safe = { workspace = true }
raw-array = { workspace = true }
slab = { workspace = true }
sorted-vec = { workspace = true }
sys = { workspace = true }
hyperlight-common = { workspace = true, optional = true }
hyperlight-guest = { workspace = true, optional = true }
multibin = { workspace = true, optional = true }
static_assert = { workspace = true }

[build-dependencies]
build-utils = { workspace = true }

[features]
default = ["microvm"]

# Machine Types
hyperlight = [
    "arch/hyperlight",
    "puts",
    "stdio",
    "pit",
    "dep:hyperlight-common",
    "dep:hyperlight-guest",
    "dep:config",
    "dep:multibin",
    "config/hyperlight",
]
microvm = [
    "arch/microvm",
    "putb",
    "stdio",
    "pit",
    "dep:config",
    "dep:multibin",
    "config/microvm",
]
# Platform Features

whp = ["config/whp"]
smp = []
pit = []
putb = []
puts = []
stdio = []

# Enables latest performance optimizations.
nightly-performance-optimizations = []

# Interface Features
kcall = []

# Logging Features
trace = ["debug"]
debug = ["info"]
info = ["warn"]
warn = ["error"]
error = ["panic"]
panic = []

[lints]
workspace = true
