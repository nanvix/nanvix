[package]
name = "nvx"
version.workspace = true
license-file.workspace = true
edition.workspace = true
authors.workspace = true
description = "Nanvix Runtime Library"
homepage.workspace = true

[lib]
crate-type = ["lib", "staticlib"]

[dependencies]
sysalloc = { workspace = true, optional = true }
cfg-if = { workspace = true }
syslog = { workspace = true }
sys = { workspace = true, features = ["kcall"] }

[features]
default = ["staticlib", "sysalloc"]
staticlib = []
sysalloc = ["dep:sysalloc"]

# Logging Features
trace = ["syslog/trace", "syslog/trace"]
debug = ["syslog/debug", "syslog/debug"]
info = ["syslog/info", "syslog/info"]
warn = ["syslog/warn", "syslog/warn"]
error = ["syslog/error", "syslog/error"]
panic = ["syslog/panic", "syslog/panic"]
