]

[[sections]]
title = "Square Root and Cube Root"
functions = ["sqrt", "cbrt", "hypot", "sqrtf", "cbrtf", "hypotf"]

[[sections]]
title = "Rounding and Truncation"
functions = [
    "ceil",
    "floor",
    "round",
    "trunc",
    "ceilf",
