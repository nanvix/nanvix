[package]
name = "arch"
version.workspace = true
license-file.workspace = true
edition.workspace = true
authors.workspace = true
description = "Architecture-Specific Library"
homepage.workspace = true

[dependencies]
cfg-if = { workspace = true }
config = { workspace = true }
error = { workspace = true }
num_enum = { workspace = true }
static_assert = { workspace = true }
sys = { workspace = true }

[build-dependencies]
cc = { workspace = true }
cfg-if = { workspace = true }

[features]
default = ["microvm"]
std = []

# Machine Types
hyperlight = [
    "putb",
    "puts",
    "stdio",
    "acpi",
    "cpuid",
    "ioapic",
    "madt",
    "msr",
    "pic",
    "xapic",
]
microvm = [
    "putb",
    "stdio",
    "acpi",
    "cpuid",
    "ioapic",
    "madt",
    "msr",
    "pic",
    "pit",
    "xapic",
]
pc = [
    "putb",
    "bios",
    "cmos",
    "mboot",
    "pit",
    "acpi",
    "cpuid",
    "ioapic",
    "madt",
    "msr",
    "pic",
    "xapic",
]
qemu-pc = ["pc"]
qemu-pc-smp = ["qemu-pc", "smp"]
qemu-baremetal = ["pc"]
qemu-baremetal-smp = ["qemu-baremetal", "smp"]
qemu-isapc = ["pc"]

# Architecture Features
acpi = []
cpuid = []
ioapic = []
madt = []
msr = []
pic = []
xapic = []

# Platform Features
smp = []
bios = []
cmos = []
mboot = []
pit = []
putb = []
puts = []
stdio = []
