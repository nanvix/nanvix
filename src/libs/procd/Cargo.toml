[package]
name = "procd"
version = "0.0.10"
license-file = "LICENSE.txt"
edition = "2021"
authors = ["The Maintainers of Nanvix"]
description = "Process Management Daemon"
homepage = "https://github.com/nanvix"

[lib]
crate-type = ["lib"]

[dependencies]
nvx = { path = "../../libs/nvx" }

[features]
default = []
syscall = []
daemon = ["nvx/allocator"]

[build-dependencies]
cc = "1.2.6"
cfg-if = "1.0.0"
