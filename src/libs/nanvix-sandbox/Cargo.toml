[package]
name = "nanvix-sandbox"
version.workspace = true
license-file.workspace = true
edition.workspace = true
authors.workspace = true
description = "Sandbox management for Nanvix"
homepage.workspace = true

[dependencies]
anyhow = { workspace = true }
cfg-if = { workspace = true }
config = { workspace = true }
control-plane-api = { workspace = true }
hwloc = { workspace = true }
linuxd = { workspace = true }
libc = { workspace = true }
syscomm = { workspace = true }
syslog = { workspace = true, features = ["std"] }
sys = { workspace = true }
tokio = { workspace = true, features = ["full"] }
user-vm-api = { workspace = true }
uservm = { workspace = true }

[features]
default = []
# If enabled this feature is enabled, the Linux Daemon (linuxd) and User VM (uservm) are embedded
# into the sandbox.
single-process = []
hyperlight = ["config/hyperlight", "uservm/hyperlight"]

[lints]
workspace = true
