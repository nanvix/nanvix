[package]
name = "nanvix-sandbox"
version.workspace = true
license-file.workspace = true
edition.workspace = true
authors.workspace = true
description = "Sandbox management for Nanvix"
homepage.workspace = true

[dependencies]
anyhow = { workspace = true }
build-utils = { workspace = true }
cfg-if = { workspace = true }
chrono = { workspace = true }
config = { workspace = true }
control-plane-api = { workspace = true }
hwloc = { workspace = true }
indexmap = { workspace = true }
linuxd = { workspace = true, optional = true }
libc = { workspace = true }
log = { workspace = true }
rand = { workspace = true }
nanvix-sandbox-config = { workspace = true, optional = true }
serde_json = { workspace = true }
syscomm = { workspace = true }
sys = { workspace = true }
tokio = { workspace = true, features = ["full"] }
user-vm-api = { workspace = true }
uservm = { workspace = true }

[features]
default = ["microvm", "standalone"]
# If enabled this feature is enabled, the Linux Daemon (linuxd) and User VM (uservm) are embedded
# into the sandbox.
single-process = [
    "linuxd",
    "nanvix-sandbox-config",
    "nanvix-sandbox-config/single-process",
]
standalone = []
gdb = ["uservm/gdb"]
# Enables fine-grained time profiling.
profile-time = ["uservm/profile-time"]
microvm = ["config/microvm", "uservm/microvm"]
whp = ["config/whp", "uservm/whp"]

[lints]
workspace = true
