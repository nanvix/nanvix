[package]
name = "sysalloc"
version.workspace = true
license-file.workspace = true
edition.workspace = true
authors.workspace = true
description = "System Allocator"
homepage.workspace = true

[dependencies]
arch = { workspace = true }
talc = { workspace = true }
cfg-if = { workspace = true }
config = { workspace = true }
syslog = { workspace = true }
sys = { workspace = true, features = ["kcall"] }

[features]
default = []
staticlib = []

# Logging Features
trace = ["syslog/trace"]
debug = ["syslog/debug"]
info = ["syslog/info"]
warn = ["syslog/warn"]
error = ["syslog/error"]
panic = ["syslog/panic"]
