# C header specification for paths.h.

file = "paths.h"
brief = "Default path prefixes for system files and directories."
description = '''
Defines the `_PATH_*` string constants that name the conventional locations of
system files and directories and the default executable search paths.'''
guard = "_NANVIX_PATHS_H"
extern_c = false
content_order = ["rust_constants:abi", "raw:0"]

[[rust_constants]]
path = "paths::_PATH_DEFPATH"
group = "abi"
emit = false

[[rust_constants]]
path = "paths::_PATH_STDPATH"
group = "abi"
emit = false

[[rust_constants]]
path = "paths::_PATH_BSHELL"
group = "abi"
emit = false

[[rust_constants]]
path = "paths::_PATH_CSHELL"
group = "abi"
emit = false

[[rust_constants]]
path = "paths::_PATH_CONSOLE"
group = "abi"
emit = false

[[rust_constants]]
path = "paths::_PATH_DEVNULL"
group = "abi"
emit = false

[[rust_constants]]
path = "paths::_PATH_TTY"
group = "abi"
emit = false

[[rust_constants]]
path = "paths::_PATH_DEV"
group = "abi"
emit = false

[[rust_constants]]
path = "paths::_PATH_TMP"
group = "abi"
emit = false

[[rust_constants]]
path = "paths::_PATH_MOUNTED"
group = "abi"
emit = false

[[rust_constants]]
path = "paths::_PATH_MNTTAB"
group = "abi"
emit = false

[[rust_constants]]
path = "paths::_PATH_NOLOGIN"
group = "abi"
emit = false

[[rust_constants]]
path = "paths::_PATH_SHELLS"
group = "abi"
emit = false

[[rust_constants]]
path = "paths::_PATH_WTMP"
group = "abi"
emit = false

[[rust_constants]]
path = "paths::_PATH_UTMP"
group = "abi"
emit = false

[[rust_constants]]
path = "paths::_PATH_LASTLOG"
group = "abi"
emit = false

[[raw_sections]]
title = ""
text = '''
#define _PATH_DEFPATH "/usr/bin:/bin"
#define _PATH_STDPATH "/usr/bin:/bin:/usr/sbin:/sbin"
#define _PATH_BSHELL "/bin/sh"
#define _PATH_CSHELL "/bin/csh"
#define _PATH_CONSOLE "/dev/console"
#define _PATH_DEVNULL "/dev/null"
#define _PATH_TTY "/dev/tty"
#define _PATH_DEV "/dev/"
#define _PATH_TMP "/tmp/"
#define _PATH_MOUNTED "/etc/mtab"
#define _PATH_MNTTAB "/etc/fstab"
#define _PATH_NOLOGIN "/etc/nologin"
#define _PATH_SHELLS "/etc/shells"
#define _PATH_WTMP "/var/log/wtmp"
#define _PATH_UTMP "/var/run/utmp"
#define _PATH_LASTLOG "/var/log/lastlog"'''
