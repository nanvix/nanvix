# C header specification for poll.h.

file = "poll.h"
brief = "Synchronous I/O multiplexing via poll()."
description = '''
The `pollfd` layout mirrors the Rust definition in the sysapi crate
(poll.rs).'''
guard = "_NANVIX_POLL_H"
scan_crates = ["syscall"]
content_order = ["rust_types", "raw:0", "section:0"]

[[rust_types]]
path = "poll::nfds_t"
c_declaration = '''
typedef unsigned int nfds_t;

/** @brief A descriptor to be polled. */
struct pollfd {
    int fd;        /**< File descriptor.        */
    short events;  /**< Requested events.       */
    short revents; /**< Returned events.        */
};'''

[[rust_types]]
path = "poll::pollfd"
style = "tag"
emit = false

[[rust_constants]]
path = "poll::poll_flags::POLLIN"
emit = false

[[rust_constants]]
path = "poll::poll_flags::POLLPRI"
emit = false

[[rust_constants]]
path = "poll::poll_flags::POLLOUT"
emit = false

[[rust_constants]]
path = "poll::poll_errors::POLLERR"
emit = false

[[rust_constants]]
path = "poll::poll_errors::POLLHUP"
emit = false

[[rust_constants]]
path = "poll::poll_errors::POLLNVAL"
emit = false

[[rust_constants]]
path = "poll::poll_flags::POLLRDNORM"
emit = false

[[rust_constants]]
path = "poll::poll_flags::POLLRDBAND"
emit = false

[[rust_constants]]
path = "poll::poll_flags::POLLWRNORM"
emit = false

[[rust_constants]]
path = "poll::poll_flags::POLLWRBAND"
emit = false

[[raw_sections]]
title = "Event flags"
text = '''
#define POLLIN 0x0001
#define POLLPRI 0x0002
#define POLLOUT 0x0004
#define POLLERR 0x0008
#define POLLHUP 0x0010
#define POLLNVAL 0x0020
#define POLLRDNORM POLLIN
#define POLLRDBAND 0x0080
#define POLLWRNORM POLLOUT
#define POLLWRBAND 0x0100'''

[[sections]]
title = "Functions"
functions = ["poll"]

[overrides]
poll = '''
extern int poll(struct pollfd *fds, nfds_t nfds, int timeout);'''
