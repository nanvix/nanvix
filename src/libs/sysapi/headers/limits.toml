#
# C header specification for limits.h.
# The C integer limits are compiler-defined; the POSIX limits mirror
# src/libs/sysapi/src/limits.rs.

file = "limits.h"
brief = "Implementation-defined constants."
description = """
Declares the numerical limits of the standard integer types (via compiler
builtins) and the POSIX path/name/resource limits. The POSIX limits mirror the
Rust definitions in the sysapi crate (limits.rs)."""
guard = "_NANVIX_LIMITS_H"
content_order = ["rust_constants:abi", "raw:0"]

[[rust_constants]]
path = "limits::CHAR_BIT"
group = "abi"
emit = false

[[rust_constants]]
path = "limits::MB_LEN_MAX"
group = "abi"
emit = false

[[rust_constants]]
path = "limits::HOST_NAME_MAX"
c_value = "255"
group = "abi"
emit = false

[[rust_constants]]
path = "limits::IOV_MAX"
group = "abi"
emit = false

[[rust_constants]]
path = "limits::NAME_MAX"
c_value = "255"
group = "abi"
emit = false

[[rust_constants]]
path = "limits::OPEN_MAX"
group = "abi"
emit = false

[[rust_constants]]
path = "limits::PATH_MAX"
c_value = "1024"
group = "abi"
emit = false

[[rust_constants]]
path = "limits::PTHREAD_KEYS_MAX"
c_value = "128"
group = "abi"
emit = false

[[rust_constants]]
path = "limits::SSIZE_MAX"
c_value = "INT_MAX"
group = "abi"
emit = false

# Alias dependencies for public implementation limits.
[[rust_constants]]
path = "limits::POSIX_HOST_NAME_MAX"
emit = false

[[rust_constants]]
path = "limits::XOPEN_NAME_MAX"
emit = false

[[rust_constants]]
path = "limits::XOPEN_PATH_MAX"
emit = false

[[rust_constants]]
path = "limits::_POSIX_THREAD_KEYS_MAX"
emit = false

[[raw_sections]]
title = "Constants"
c_only_reason = "Compiler-provided integer limits and C suffix-preserving aliases."
text = """
/* Numerical limits of the standard integer types (compiler-defined). */
#define CHAR_BIT 8
#define MB_LEN_MAX 4

#define SCHAR_MIN (-__SCHAR_MAX__ - 1)
#define SCHAR_MAX __SCHAR_MAX__
#define UCHAR_MAX (__SCHAR_MAX__ * 2 + 1)

/* char is signed on the i686 target. */
#define CHAR_MIN SCHAR_MIN
#define CHAR_MAX SCHAR_MAX

#define SHRT_MIN (-__SHRT_MAX__ - 1)
#define SHRT_MAX __SHRT_MAX__
#define USHRT_MAX (__SHRT_MAX__ * 2 + 1)

#define INT_MIN (-__INT_MAX__ - 1)
#define INT_MAX __INT_MAX__
#define UINT_MAX (__INT_MAX__ * 2U + 1U)

#define LONG_MIN (-__LONG_MAX__ - 1L)
#define LONG_MAX __LONG_MAX__
#define ULONG_MAX (__LONG_MAX__ * 2UL + 1UL)

#define LLONG_MIN (-__LONG_LONG_MAX__ - 1LL)
#define LLONG_MAX __LONG_LONG_MAX__
#define ULLONG_MAX (__LONG_LONG_MAX__ * 2ULL + 1ULL)

/* POSIX path, name, and resource limits (sysapi/limits.rs). */
#define HOST_NAME_MAX 255
#define IOV_MAX 16
#define NAME_MAX 255
#define OPEN_MAX 64
#define PATH_MAX 1024
#define PTHREAD_KEYS_MAX 128
#define SSIZE_MAX INT_MAX
"""
