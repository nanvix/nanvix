#
# C header specification for dirent.h.
# Constants and layouts mirror src/libs/sysapi/src/dirent.rs; prototypes are
# generated from the syscall crate.

file = "dirent.h"
brief = "Directory entries."
description = """
Declares the directory-stream type, the directory-entry structures, and the
directory-traversal interfaces. The layouts mirror the Rust definitions in the
sysapi crate (dirent.rs)."""
includes = ["sys/types.h", "limits.h"]
guard = "_NANVIX_DIRENT_H"
scan_crates = ["syscall"]
content_order = ["rust_constants", "rust_types", "section:0"]

[[rust_constants]]
path = "dirent::dirent_file_type::DT_UNKNOWN"
comment = "Unknown file type."

[[rust_constants]]
path = "dirent::dirent_file_type::DT_FIFO"
comment = "FIFO."

[[rust_constants]]
path = "dirent::dirent_file_type::DT_CHR"
comment = "Character device."

[[rust_constants]]
path = "dirent::dirent_file_type::DT_DIR"
comment = "Directory."

[[rust_constants]]
path = "dirent::dirent_file_type::DT_BLK"
comment = "Block device."

[[rust_constants]]
path = "dirent::dirent_file_type::DT_REG"
comment = "Regular file."

[[rust_constants]]
path = "dirent::dirent_file_type::DT_LNK"
comment = "Symbolic link."

[[rust_constants]]
path = "dirent::dirent_file_type::DT_SOCK"
comment = "Socket."

[[rust_types]]
path = "dirent::dirent"
style = "tag"
c_only_reason = "DIR is an opaque C tag whose Rust implementation layout is intentionally private."
c_declaration = """
/** @brief Directory stream type. */
typedef struct __dirstream DIR;

/** @brief Directory entry. */
struct dirent {
    ino_t d_ino;                /**< File serial number.                  */
    char d_name[NAME_MAX + 1];  /**< Null-terminated file name.           */
};"""

[[rust_types]]
path = "dirent::posix_dent"
style = "tag"
c_declaration = """
/** @brief Extended (Nanvix) directory entry. */
struct posix_dent {
    ino_t d_ino;                /**< File serial number.                  */
    reclen_t d_reclen;          /**< Length of this entry.                */
    unsigned char d_type;       /**< File type.                           */
    char d_name[NAME_MAX + 1];  /**< Null-terminated file name.           */
    char d_pad[1];              /**< Padding.                             */
};"""

[[sections]]
title = "Directory Operations"
functions = ["opendir", "fdopendir", "readdir", "closedir", "rewinddir"]

# opendir's Rust binding spells its path argument `*const i8`; declare the
# standard POSIX prototype so C callers can pass a `const char *`.
# fdopendir's Rust binding returns the opaque `*mut c_void` placeholder; declare
# the standard POSIX prototype so C callers see the `DIR *` return type.
[overrides]
opendir = "extern DIR *opendir(const char *dirname);"
fdopendir = "extern DIR *fdopendir(int fd);"
rewinddir = "extern void rewinddir(DIR *dirp);"
