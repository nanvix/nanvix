# C header specification for sys/ioctl.h.

file = "sys/ioctl.h"
brief = "Device control operations."
description = '''
Declares `ioctl()` and the terminal-control requests used by interactive
ports. In standalone mode the terminal-attribute and window-size requests
(`TCGETS`/`TCSETS`/`TIOCGWINSZ`/`TIOCSWINSZ`) are served by the vfsd console
backend, while foreground process-group requests (`TIOCGPGRP`/`TIOCSPGRP`)
are served by procd; hosted deployments have no guest terminal device and
ignore them.'''
guard = "_NANVIX_SYS_IOCTL_H"
scan_crates = ["libc_sys_ioctl"]
content_order = [
    "rust_types:structures",
    "rust_constants:requests",
    "rust_constants:request_encoding",
    "section:0",
]

[[rust_types]]
path = "sys_ioctl::Winsize"
c_name = "winsize"
group = "structures"
section_title = "Structures"
c_declaration = '''
/** @brief Terminal window size. */
struct winsize {
    unsigned short ws_row;    /**< Rows, in characters.    */
    unsigned short ws_col;    /**< Columns, in characters. */
    unsigned short ws_xpixel; /**< Horizontal size, pixels. */
    unsigned short ws_ypixel; /**< Vertical size, pixels.   */
};'''

[[rust_constants]]
path = "sys_ioctl::TCGETS"
group = "requests"
section_title = "Requests"
c_declaration = '''
#define TCGETS 0x5401
#define TCSETS 0x5402
#define TIOCGPGRP 0x540f
#define TIOCSPGRP 0x5410
#define TIOCGWINSZ 0x5413
#define TIOCSWINSZ 0x5414
#define FIONREAD 0x541b'''
no_comment = true

