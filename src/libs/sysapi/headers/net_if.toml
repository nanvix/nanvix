# C header specification for net/if.h.

file = "net/if.h"
brief = "Network interface name limits."
description = '''
Defines `IF_NAMESIZE`/`IFNAMSIZ`, the maximum length of a network interface
name including the terminating null byte, and `struct if_nameindex`, which
pairs an interface index with its name.'''
guard = "_NANVIX_NET_IF_H"
extern_c = false
content_order = ["rust_constants:abi", "rust_types:abi", "raw:0"]

[[rust_constants]]
path = "net_if::IF_NAMESIZE"
group = "abi"
emit = false

[[rust_constants]]
path = "net_if::IFNAMSIZ"
group = "abi"
emit = false

[[rust_constants]]
path = "net_if::IF_NAMESIZE"
emit = false

[[rust_types]]
path = "net_if::if_nameindex"
group = "abi"
emit = false

[[raw_sections]]
title = ""
text = '''
#define IF_NAMESIZE 16
#define IFNAMSIZ IF_NAMESIZE

struct if_nameindex {
    unsigned int if_index;
    char *if_name;
};'''
