# C header specification for termios.h.

file = "termios.h"
brief = "General terminal interface."
description = '''
Declares `struct termios` and the terminal-attribute interfaces. In standalone
mode `tcgetattr`/`tcsetattr` are served by the vfsd console backend; hosted
deployments have no guest terminal device, so they fail with `ENOSYS`. The
definitions let ports with an interactive mode (e.g. the QuickJS REPL) compile
and link.'''
includes = ["sys/types.h"]
guard = "_NANVIX_TERMIOS_H"
scan_crates = ["nanvix_libc"]
content_order = [
    "rust_types",
    "raw:0",
    "raw:1",
    "raw:2",
    "raw:3",
    "raw:4",
    "raw:5",
    "rust_constants:tcsetattr_actions",
    "rust_constants:flush_queues",
    "rust_constants:flow_actions",
    "section:0",
]

[[rust_types]]
path = "termios::tcflag_t"
c_declaration = '''
typedef unsigned int tcflag_t;
typedef unsigned char cc_t;
typedef unsigned int speed_t;

#define NCCS 32

struct termios {
    tcflag_t c_iflag; /**< Input modes.   */
    tcflag_t c_oflag; /**< Output modes.  */
    tcflag_t c_cflag; /**< Control modes. */
    tcflag_t c_lflag; /**< Local modes.   */
    cc_t c_line;      /**< Line discipline. */
    cc_t c_cc[NCCS];  /**< Control characters. */
    speed_t c_ispeed; /**< Input speed.   */
    speed_t c_ospeed; /**< Output speed.  */
};'''

[[rust_types]]
path = "termios::cc_t"
emit = false

[[rust_types]]
