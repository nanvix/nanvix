# C header specification for fenv.h.

file = "fenv.h"
brief = "Floating-point environment."
description = '''
Declares the floating-point rounding-mode and exception interfaces. The
rounding-mode constants follow the x86 control-word layout.'''
guard = "_NANVIX_FENV_H"
scan_crates = ["libc_math"]
content_order = [
    "rust_types:abi",
    "rust_constants:abi",
    "types",
    "raw:0",
    "raw:1",
    "section:0",
]

[[rust_types]]
path = "fenv::fenv_t"
group = "abi"
emit = false

[[rust_types]]
path = "fenv::fexcept_t"
group = "abi"
emit = false

[[rust_constants]]
path = "fenv::FE_TONEAREST"
group = "abi"
emit = false

[[rust_constants]]
path = "fenv::FE_DOWNWARD"
group = "abi"
emit = false

[[rust_constants]]
path = "fenv::FE_UPWARD"
group = "abi"
emit = false

[[rust_constants]]
path = "fenv::FE_TOWARDZERO"
group = "abi"
emit = false

[[rust_constants]]
path = "fenv::FE_INVALID"
group = "abi"
emit = false

[[rust_constants]]
path = "fenv::FE_DENORMAL"
group = "abi"
emit = false

[[rust_constants]]
path = "fenv::FE_DIVBYZERO"
group = "abi"
emit = false

[[rust_constants]]
path = "fenv::FE_OVERFLOW"
group = "abi"
emit = false

[[rust_constants]]
path = "fenv::FE_UNDERFLOW"
group = "abi"
emit = false

[[rust_constants]]
path = "fenv::FE_INEXACT"
group = "abi"
emit = false

[[rust_constants]]
path = "fenv::FE_ALL_EXCEPT"
group = "abi"
emit = false

[[rust_constants]]
path = "fenv::FE_DFL_ENV"
c_value = "((const fenv_t *)-1)"
group = "abi"
emit = false

# Alias dependencies for FE_ALL_EXCEPT.
[[rust_constants]]
path = "fenv::FE_INVALID"
emit = false

[[rust_constants]]
path = "fenv::FE_DENORMAL"
emit = false

[[rust_constants]]
path = "fenv::FE_DIVBYZERO"
emit = false

[[rust_constants]]
path = "fenv::FE_OVERFLOW"
emit = false

[[rust_constants]]
path = "fenv::FE_UNDERFLOW"
emit = false

[[rust_constants]]
path = "fenv::FE_INEXACT"
emit = false

[[types]]
text = '''
/** @brief Floating-point environment. */
typedef int fenv_t;

/** @brief Floating-point exception flags. */
typedef int fexcept_t;'''

[[raw_sections]]
title = "Rounding modes"
text = '''
#define FE_TONEAREST 0x0000
#define FE_DOWNWARD 0x0400
#define FE_UPWARD 0x0800
#define FE_TOWARDZERO 0x0c00'''

[[raw_sections]]
title = "Exception flags"
text = '''
#define FE_INVALID 0x01
#define FE_DENORMAL 0x02
#define FE_DIVBYZERO 0x04
#define FE_OVERFLOW 0x08
#define FE_UNDERFLOW 0x10
#define FE_INEXACT 0x20
#define FE_ALL_EXCEPT                                                                              \
    (FE_INVALID | FE_DENORMAL | FE_DIVBYZERO | FE_OVERFLOW | FE_UNDERFLOW | FE_INEXACT)

/** @brief Default floating-point environment. */
#define FE_DFL_ENV ((const fenv_t *)-1)'''

[[sections]]
title = "Functions"
functions = [
    "fegetround",
    "fesetround",
    "feclearexcept",
    "feraiseexcept",
    "fetestexcept",
    "fegetenv",
    "fesetenv",
    "feholdexcept",
    "feupdateenv",
]

[overrides]
fegetenv = '''
extern int fegetenv(fenv_t *envp);'''
fesetenv = '''
extern int fesetenv(const fenv_t *envp);'''
feholdexcept = '''
extern int feholdexcept(fenv_t *envp);'''
feupdateenv = '''
extern int feupdateenv(const fenv_t *envp);'''
