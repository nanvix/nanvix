#
# C header specification for sched.h.
# Constants and the sched_param layout mirror src/libs/sysapi/src/sched.rs.

file = "sched.h"
brief = "Execution scheduling."
description = """
Declares the scheduling policy constants and the sched_param structure used to
get and set scheduling parameters. Mirrors the Rust definitions in the sysapi
crate (sched.rs)."""
guard = "_NANVIX_SCHED_H"
scan_crates = ["syscall"]
includes = ["sys/types.h", "stddef.h"]
content_order = ["rust_constants", "rust_types", "section:0"]

[[rust_constants]]
path = "sched::sched_policy::SCHED_OTHER"
comment = "Another scheduling policy."

[[rust_constants]]
path = "sched::sched_policy::SCHED_FIFO"
comment = "First in-first out scheduling policy."

[[rust_constants]]
path = "sched::sched_policy::SCHED_RR"
comment = "Round-robin scheduling policy."

[[rust_types]]
path = "sched::sched_param"
style = "tag"
packed = false
comment = "Scheduling parameters."
field_comments = { sched_priority = "Process or thread execution scheduling priority." }

[[sections]]
title = "Scheduling"
functions = ["sched_yield", "sched_getaffinity"]
