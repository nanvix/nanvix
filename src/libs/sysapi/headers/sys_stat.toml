[[rust_types]]
path = "sys_stat::stat"
style = "tag"
c_declaration = '''
/** @brief File status. */
struct stat {
    dev_t st_dev;             /**< Device ID.                      */
    ino_t st_ino;             /**< File serial number.             */
    mode_t st_mode;           /**< File mode.                      */
    nlink_t st_nlink;         /**< Link count.                     */
    uid_t st_uid;             /**< User ID of file.                */
    gid_t st_gid;             /**< Group ID of file.               */
    dev_t st_rdev;            /**< Device ID (if special file).    */
    off_t st_size;            /**< File size in bytes.             */
    struct timespec st_atim;  /**< Last data access timestamp.     */
    struct timespec st_mtim;  /**< Last data modification timestamp.*/
    struct timespec st_ctim;  /**< Last status change timestamp.   */
    blksize_t st_blksize;     /**< Preferred I/O block size.       */
    blkcnt_t st_blocks;       /**< Number of blocks allocated.     */
};'''

[[raw_sections]]
title = ""
c_only_reason = "C member aliases for POSIX timestamp shorthand fields."
text = '''
/* POSIX timestamp field shorthands. */
#define st_atime st_atim.tv_sec
#define st_mtime st_mtim.tv_sec
#define st_ctime st_ctim.tv_sec

/* Special tv_nsec values for utimensat()/futimens(). */
#define UTIME_NOW ((1L << 30) - 1L)
#define UTIME_OMIT ((1L << 30) - 2L)

/* File-type test macros. */
#define S_ISFIFO(m) (((m) & S_IFMT) == S_IFIFO)
#define S_ISCHR(m)  (((m) & S_IFMT) == S_IFCHR)
#define S_ISDIR(m)  (((m) & S_IFMT) == S_IFDIR)
#define S_ISBLK(m)  (((m) & S_IFMT) == S_IFBLK)
#define S_ISREG(m)  (((m) & S_IFMT) == S_IFREG)
#define S_ISLNK(m)  (((m) & S_IFMT) == S_IFLNK)
#define S_ISSOCK(m) (((m) & S_IFMT) == S_IFSOCK)'''

