#
# C header specification for sys/un.h.
# The sockaddr_un layout mirrors src/libs/sysapi/src/sys_un.rs.

file = "sys/un.h"
brief = "UNIX domain socket address."
description = """
Declares the UNIX-domain socket address structure. The layout mirrors the Rust
definition in the sysapi crate (sys_un.rs)."""
includes = ["sys/socket.h"]
guard = "_NANVIX_SYS_UN_H"
content_order = ["rust_constants", "rust_types"]

[[rust_constants]]
path = "sys_un::SUNPATHLEN"
comment = "Size of the sun_path field."

[[rust_types]]
path = "sys_un::sockaddr_un"
style = "tag"
packed = false
comment = "UNIX domain socket address."
field_c_declarations = { sun_len = "unsigned char sun_len" }
field_comments = { sun_len = "Total length.", sun_family = "Address family.", sun_path = "Socket path." }
