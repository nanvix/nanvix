#
# C header specification for locale.h.
# The gen-headers tool combines this with the extern "C" signatures parsed
# from this crate's sources to produce include/locale.h.

file = "locale.h"
brief = "Localization."
description = """
Declares functions and types for locale-specific formatting. Only the
C/POSIX locale is supported. Implemented by the libc_locale Rust crate."""
includes = ["stddef.h"]
guard = "_NANVIX_LOCALE_H"
# Emit the type block (which defines `locale_t`) before the constants so that the
# `LC_GLOBAL_LOCALE` macro, whose value casts to `locale_t`, follows the typedef.
content_order = ["types", "macros", "section:0", "section:1"]

[[macros]]
name = "LC_CTYPE"
value = "0"

[[macros]]
name = "LC_NUMERIC"
value = "1"

[[macros]]
name = "LC_TIME"
value = "2"

[[macros]]
name = "LC_COLLATE"
value = "3"

[[macros]]
name = "LC_MONETARY"
value = "4"

[[macros]]
name = "LC_MESSAGES"
value = "5"

[[macros]]
name = "LC_ALL"
value = "6"

[[macros]]
name = "LC_CTYPE_MASK"
value = "(1 << LC_CTYPE)"

[[macros]]
name = "LC_NUMERIC_MASK"
value = "(1 << LC_NUMERIC)"

[[macros]]
name = "LC_TIME_MASK"
value = "(1 << LC_TIME)"

[[macros]]
name = "LC_COLLATE_MASK"
value = "(1 << LC_COLLATE)"

[[macros]]
name = "LC_MONETARY_MASK"
value = "(1 << LC_MONETARY)"

[[macros]]
name = "LC_MESSAGES_MASK"
value = "(1 << LC_MESSAGES)"

[[macros]]
name = "LC_ALL_MASK"
value = "(LC_CTYPE_MASK | LC_NUMERIC_MASK | LC_TIME_MASK | LC_COLLATE_MASK | LC_MONETARY_MASK | LC_MESSAGES_MASK)"

[[macros]]
name = "LC_GLOBAL_LOCALE"
value = "((locale_t) -1)"

[[types]]
text = """
#ifndef _LOCALE_T_DEFINED
#define _LOCALE_T_DEFINED
typedef void *locale_t;
#endif

/** @brief Locale-specific numeric formatting information. */
struct lconv {
    char *decimal_point;     /**< Decimal point character.            */
    char *thousands_sep;     /**< Thousands separator.                */
    char *grouping;          /**< Digit grouping.                     */
    char *int_curr_symbol;   /**< International currency symbol.      */
    char *currency_symbol;   /**< Local currency symbol.              */
    char *mon_decimal_point; /**< Monetary decimal point.             */
    char *mon_thousands_sep; /**< Monetary thousands separator.       */
    char *mon_grouping;      /**< Monetary digit grouping.            */
    char *positive_sign;     /**< Positive sign string.               */
    char *negative_sign;     /**< Negative sign string.               */
    char int_frac_digits;    /**< International fractional digits.    */
    char frac_digits;        /**< Local fractional digits.            */
    char p_cs_precedes;      /**< Currency symbol precedes positive.  */
    char p_sep_by_space;     /**< Space separates symbol and positive.*/
    char n_cs_precedes;      /**< Currency symbol precedes negative.  */
    char n_sep_by_space;     /**< Space separates symbol and negative.*/
    char p_sign_posn;        /**< Positive sign position.             */
    char n_sign_posn;        /**< Negative sign position.             */
    char int_p_cs_precedes;  /**< Int. symbol precedes positive.      */
    char int_p_sep_by_space; /**< Int. space separates positive.      */
    char int_n_cs_precedes;  /**< Int. symbol precedes negative.      */
    char int_n_sep_by_space; /**< Int. space separates negative.      */
    char int_p_sign_posn;    /**< Int. positive sign position.        */
    char int_n_sign_posn;    /**< Int. negative sign position.        */
};
"""

[[sections]]
title = "Functions"
functions = ["setlocale", "localeconv"]

[[sections]]
title = "Locale Management"
functions = ["newlocale", "duplocale", "freelocale", "uselocale"]

[overrides]
newlocale = "extern locale_t newlocale(int category_mask, const char *locale, locale_t base);"
duplocale = "extern locale_t duplocale(locale_t locobj);"
freelocale = "extern void freelocale(locale_t locobj);"
uselocale = "extern locale_t uselocale(locale_t newloc);"
