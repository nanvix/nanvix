[package]
name = "nanvix-sandbox-cache"
version.workspace = true
license-file.workspace = true
edition.workspace = true
authors.workspace = true
description = "Sandbox cache management for Nanvix"
homepage.workspace = true

[dependencies]
anyhow = { workspace = true }
config = { workspace = true }
nanvix-sandbox = { workspace = true }
rand = { workspace = true }
syslog = { workspace = true, features = ["std"] }
tokio = { workspace = true, features = ["full"] }

[features]
default = []
hyperlight = ["config/hyperlight", "nanvix-sandbox/hyperlight"]
single-process = ["nanvix-sandbox/single-process"]
