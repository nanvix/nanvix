# C header specification for stdio.h.

file = "stdio.h"
brief = "Standard input/output."
description = '''
Declares functions for formatted and unformatted I/O, stream management,
and error reporting. Implemented by the libc_stdio Rust crate.'''
includes = ["stdarg.h", "stddef.h", "sys/types.h"]
guard = "_NANVIX_STDIO_H"
symbol_crates = ["sysapi"]
content_order = [
    "rust_constants:constants",
    "rust_types",
    "section:0",
    "raw:0",
    "raw:1",
    "section:1",
    "section:2",
    "raw:2",
    "section:3",
    "section:4",
    "section:5",
    "section:6",
    "section:7",
    "section:8",
]

[[rust_types]]
path = "FILE"
c_declaration = '''
/**
 * @brief Opaque file stream type.
 *
 * The internal layout matches the Rust FILE struct in libc_stdio::streams.
 * Fields should not be accessed directly; use the accessor functions below.
 */
typedef struct {
    int fd;          /**< Underlying file descriptor.       */
    int eof;         /**< End-of-file indicator.            */
    int error;       /**< Error indicator.                  */
    int ungetc_buf;  /**< Push-back character buffer.       */
    int orientation; /**< 0 unoriented, >0 wide, <0 byte.   */
} FILE;'''

[[rust_constants]]
path = "EOF"
group = "constants"
section_title = "Constants"
c_only_reason = "NULL is a C null-pointer macro rather than a Rust constant ABI item."
c_declaration = '''
#ifndef EOF
#define EOF (-1)
#endif

#ifndef SEEK_SET
#define SEEK_SET 0
#endif

#ifndef SEEK_CUR
#define SEEK_CUR 1
#endif

#ifndef SEEK_END
#define SEEK_END 2
#endif

#ifndef NULL
#define NULL ((void *)0)
#endif

#ifndef BUFSIZ
#define BUFSIZ 8192
#endif

#ifndef FOPEN_MAX
#define FOPEN_MAX 256
#endif

#ifndef FILENAME_MAX
#define FILENAME_MAX 4096
#endif

#ifndef L_tmpnam
#define L_tmpnam 20
#endif

#ifndef TMP_MAX
#define TMP_MAX 10000
#endif'''
no_comment = true

