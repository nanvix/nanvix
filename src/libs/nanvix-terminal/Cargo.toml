[package]
name = "nanvix-terminal"
version.workspace = true
license-file.workspace = true
edition.workspace = true
authors.workspace = true
description = "Terminal interface for Nanvix"
homepage.workspace = true

[dependencies]
anyhow = { workspace = true }
config = { workspace = true, optional = true }
libc = { workspace = true }
log = { workspace = true }
nanvix-sandbox = { workspace = true, optional = true }
nanvix-sandbox-cache = { workspace = true, optional = true }
nanvix-sandbox-config = { workspace = true, optional = true }
tokio = { workspace = true, features = ["full"] }
user-vm-api = { workspace = true }
uservm = { workspace = true, optional = true }

[features]
default = ["microvm", "multi-process"]
single-process = [
    "nanvix-sandbox-config",
    "nanvix-sandbox-config/single-process",
    "nanvix-sandbox",
    "nanvix-sandbox/single-process",
]
multi-process = [
    "nanvix-sandbox-config",
    "nanvix-sandbox-cache",
    "nanvix-sandbox-cache/multi-process",
]
standalone = ["config", "uservm"]
gdb = ["uservm?/gdb"]
# Enables fine-grained time profiling.
profile-time = ["uservm?/profile-time", "nanvix-sandbox?/profile-time"]
hyperlight = [
    "config?/hyperlight",
    "uservm?/hyperlight",
    "nanvix-sandbox?/hyperlight",
    "nanvix-sandbox-cache?/hyperlight",
]
microvm = [
    "config?/microvm",
    "uservm?/microvm",
    "nanvix-sandbox?/microvm",
    "nanvix-sandbox-cache?/microvm",
]
whp = [
    "config?/whp",
    "uservm?/whp",
    "nanvix-sandbox?/whp",
    "nanvix-sandbox-cache?/whp",
]

[lints]
workspace = true
