[package]
name = "nanvix-shim-standalone"
description = "Standalone execution mode for the Nanvix containerd shim"
version.workspace = true
edition.workspace = true
homepage.workspace = true
authors.workspace = true
license-file.workspace = true

[dependencies]
nanvix-oci = { workspace = true }
nanvix-shim-core = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
chrono = { workspace = true }
log = { workspace = true }
tokio = { workspace = true, features = ["sync", "process", "time", "net", "io-util", "rt"] }
serde_json = { workspace = true, features = ["std"] }
tempfile = "3"
portpicker = "0.1"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", features = ["signal", "process", "mount"] }

[dev-dependencies]
serde_json = { workspace = true, features = ["std"] }
tempfile = "3"
portpicker = "0.1"

[lints]
workspace = true
