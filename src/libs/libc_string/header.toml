#
# C header specification for string.h.
# The gen-headers tool combines this with the extern "C" signatures parsed
# from this crate's sources to produce include/string.h.

file = "string.h"
brief = "String and memory operations."
description = """
Declares byte-string length and memory manipulation routines implemented by
the libc_string Rust crate."""
includes = ["stddef.h"]
guard = "_NANVIX_STRING_H"

[[sections]]
title = "Memory Operations"
functions = [
    "memccpy",
    "memchr",
    "memcmp",
    "memcpy",
    "memmove",
    "mempcpy",
    "memrchr",
    "memset",
]

[[sections]]
title = "String Operations"
functions = [
    "stpcpy",
    "stpncpy",
    "strcasecmp",
    "strcasestr",
    "strcat",
    "strchr",
    "strchrnul",
    "strcmp",
    "strcoll",
    "strcpy",
    "strcspn",
    "strdup",
    "strerror",
    "strerror_r",
    "strlcat",
    "strlcpy",
    "strlen",
    "strncasecmp",
    "strncat",
    "strncmp",
    "strncpy",
    "strndup",
    "strnlen",
    "strpbrk",
    "strrchr",
    "strsep",
    "strsignal",
    "strspn",
    "strstr",
    "strtok",
    "strtok_r",
    "strverscmp",
]
