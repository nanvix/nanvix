[package]
name = "posix"
version.workspace = true
license-file.workspace = true
edition.workspace = true
authors.workspace = true
description = "POSIX Library"
homepage.workspace = true

[lib]
crate-type = ["lib", "staticlib"]

[dependencies]
# `nvx` provides the panic handler and PIE relocation helper.
# `nvx` does carry an optional `sysalloc` dependency, but only behind its
# `runtime` feature.  The workspace `nvx` dependency is pinned to
# `default-features = false` (see the root `Cargo.toml`), so the `runtime`
# feature — and the `sysalloc` dependency it would pull in — stays disabled
# here.  That keeps this dep from re-introducing the duplicate-`sysalloc`
# bug — see `nanvix-todo/dlopen-load-address-conflict.md`.
nvx = { workspace = true }
sys = { workspace = true }
cfg-if = { workspace = true }
config = { workspace = true }
num_enum = { workspace = true }
spin = { workspace = true, features = ["lazy", "spin_mutex"] }
syscall = { workspace = true, features = ["syscall", "dlfcn"] }
static_assert = { workspace = true }
sysapi = { workspace = true }
sysalloc = { workspace = true, optional = true }
syslog = { workspace = true, default-features = true, optional = true }
type-safe = { workspace = true }

[features]
default = ["syscall", "allocator", "c-main"]
allocator = ["dep:sysalloc"]
syscall = ["syslog", "syscall/dlfcn"]
standalone = ["syscall/standalone"]
std = []

# `init-array` makes `__nanvix_libc_start_main` run global constructors /
# destructors by walking the `.preinit_array` / `.init_array` / `.fini_array`
# sections (bounded by the `__*_array_{start,end}` symbols from `user.ld`).
# Off by default: a default `libposix` neither references those linker symbols
# nor walks the arrays, so consumers with their own linker scripts keep linking
# unchanged and rely on the `nvx-crt0` `c-main` trampoline's legacy `_init` /
# `_fini` hooks.  Enabled (together with `nvx-crt0/init-array`) by the in-tree
# `nanvix_libc` bundle.
init-array = []

# `c-main` gates the link-time errno wiring used by C executables (cpython,
# numpy, ...).  When enabled, `syscall/staticlib` switches
# `__errno_location()` from a self-contained local errno to an `extern fn
# __errno()` that resolves to newlib's implementation, so errno is shared
# between libposix and libc in the final link.
#
# The staticlib build of `libposix.a` (consumed by cpython) has this on by
# default.  Rust no_std binaries that depend on `posix` via cargo opt out
# with `default-features = false` so they keep the self-contained errno
# variant (no newlib in their link).
c-main = ["syscall/staticlib"]

# Logging
trace = ["syslog/trace"]
debug = ["syslog/debug"]
info = ["syslog/info"]
warn = ["syslog/warn"]
error = ["syslog/error"]
panic = ["syslog/panic"]

[lints]
workspace = true
