[package]
name = "posix"
version = "0.5.0"
license-file = "LICENSE.txt"
edition = "2021"
authors = ["The Maintainers of Nanvix"]
description = "Linux Daemon Library"
homepage = "https://github.com/nanvix"

[lib]
crate-type = ["lib", "staticlib"]

[dependencies]
nvx = { path = "../../nvx" }
cfg-if = "1.0.0"
num_enum = { version = "0.7.3", default-features = false }

[features]
default = ["syscall", "nvx/allocator"]
syscall = []
std = []
staticlib = ["nvx/staticlib"]

[profile.release]
opt-level = 3
debug = false
strip = "symbols"
debug-assertions = false
overflow-checks = true
lto = "fat"
panic = 'abort'
incremental = false
codegen-units = 1
rpath = false
