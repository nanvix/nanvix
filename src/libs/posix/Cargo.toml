[package]
name = "posix"
version.workspace = true
license-file.workspace = true
edition.workspace = true
authors.workspace = true
description = "POSIX Library"
homepage.workspace = true

[lib]
crate-type = ["lib", "staticlib"]

[dependencies]
# `nvx` provides the panic handler and PIE relocation helper.
# `nvx` does carry an optional `sysalloc` dependency, but only behind its
# `runtime` feature.  The workspace `nvx` dependency is pinned to
# `default-features = false` (see the root `Cargo.toml`), so the `runtime`
# feature — and the `sysalloc` dependency it would pull in — stays disabled
# here.  That keeps this dep from re-introducing the duplicate-`sysalloc`
# bug — see `nanvix-todo/dlopen-load-address-conflict.md`.
nvx = { workspace = true }
sys = { workspace = true }
config = { workspace = true }
syscall = { workspace = true, features = ["syscall", "dlfcn"] }
static_assert = { workspace = true }
sysapi = { workspace = true }
sysalloc = { workspace = true, optional = true }
syslog = { workspace = true, default-features = true, optional = true }
# POSIX modules split into standalone `libc_*` crates and re-exported by this
# bundle (see lib.rs).  Optional and tied to the `syscall` feature so a
# `--no-default-features` posix build does not pull in the syscall-backed
# surface.
libc_arpa_inet = { workspace = true, optional = true }
libc_dlfcn = { workspace = true, optional = true }
libc_errno = { workspace = true, optional = true }
libc_netdb = { workspace = true, optional = true }
libc_poll = { workspace = true, optional = true }
libc_pthread = { workspace = true, optional = true }
libc_pwd = { workspace = true, optional = true }
libc_utime = { workspace = true, optional = true }
libc_sys_ioctl = { workspace = true, optional = true }
libc_sys_resource = { workspace = true, optional = true }
libc_sys_stat = { workspace = true, optional = true }
libc_sys_time = { workspace = true, optional = true }
libc_sys_times = { workspace = true, optional = true }
libc_sys_un = { workspace = true, optional = true }
libc_sys_uio = { workspace = true, optional = true }
libc_sys_utsname = { workspace = true, optional = true }

[features]
default = ["syscall", "allocator", "c-main"]
allocator = ["dep:sysalloc"]
syscall = [
    "syslog",
    # Propagate to the `syscall` crate's optional C bindings so the
    # syscall-backed surface is exported by `libposix.a`.
    "syscall/dlfcn",
    "dep:libc_arpa_inet",
    "dep:libc_dlfcn",
    "dep:libc_errno",
    "dep:libc_netdb",
    "dep:libc_poll",
    "dep:libc_pthread",
    "dep:libc_pwd",
    "dep:libc_utime",
    "dep:libc_sys_ioctl",
    "dep:libc_sys_resource",
    "dep:libc_sys_stat",
    "dep:libc_sys_time",
    "dep:libc_sys_times",
    "dep:libc_sys_un",
    "dep:libc_sys_uio",
    "dep:libc_sys_utsname",
]

# Surfaces the syscall-backed signal-control calls (`sigaction`, `sigprocmask`)
# from the `syscall` crate, covering a gap in Newlib: ports linked against the
# standalone `libposix.a` (e.g. xz) need them, but Newlib does not provide them.
#
# Deliberately kept OUT of the `syscall` feature. The in-tree `nanvix_libc`
# bundle (`libc.a`) pulls `posix` in via its `backend-nanvix` feature and ALREADY
# defines `sigaction` (in `nanvix_libc`) and `sigprocmask` (in `libc_signal`), so
# enabling the `syscall` versions there too would emit DUPLICATE `sigaction` /
# `sigprocmask` symbols into `libc.a`. This feature is therefore enabled ONLY for
# the standalone `libposix.a` build (see `GUEST_STATICLIB_FEATURES_posix` in
# `build/make/generic-guest-staticlibs.mk`), which carries neither `nanvix_libc`
# nor `libc_signal`.
newlib-compat = ["syscall/signal"]
standalone = ["syscall/standalone"]
std = []

# `init-array` makes `__nanvix_libc_start_main` run global constructors /
# destructors by walking the `.preinit_array` / `.init_array` / `.fini_array`
# sections (bounded by the `__*_array_{start,end}` symbols from `user.ld`).
# Off by default: a default `libposix` neither references those linker symbols
# nor walks the arrays, so consumers with their own linker scripts keep linking
# unchanged and rely on the `nvx-crt0` `c-main` trampoline's legacy `_init` /
# `_fini` hooks.  Enabled (together with `nvx-crt0/init-array`) by the in-tree
# `nanvix_libc` bundle.
init-array = []

# `c-main` gates the link-time errno wiring used by C executables (cpython,
# numpy, ...).  When enabled, `syscall/staticlib` switches
# `__errno_location()` from a self-contained local errno to an `extern fn
# __errno()` that resolves to newlib's implementation, so errno is shared
# between libposix and libc in the final link.
#
# The staticlib build of `libposix.a` (consumed by cpython) has this on by
# default.  Rust no_std binaries that depend on `posix` via cargo opt out
# with `default-features = false` so they keep the self-contained errno
# variant (no newlib in their link).
c-main = ["syscall/staticlib"]

# Logging
trace = ["syslog/trace"]
debug = ["syslog/debug"]
info = ["syslog/info"]
warn = ["syslog/warn"]
error = ["syslog/error"]
panic = ["syslog/panic"]

[lints]
workspace = true
