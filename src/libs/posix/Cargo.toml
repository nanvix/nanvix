[package]
name = "posix"
version.workspace = true
license-file.workspace = true
edition.workspace = true
authors.workspace = true
description = "POSIX Library"
homepage.workspace = true

[lib]
crate-type = ["lib", "staticlib"]

[dependencies]
nvx = { workspace = true }
config = { workspace = true }
cfg-if = { workspace = true }
elf = { workspace = true }
goblin = { workspace = true, features = [
    "elf32",
    "elf64",
    "endian_fd",
    "mach32",
    "mach64",
] }
num_enum = { workspace = true }
spin = { workspace = true, features = ["lazy", "spin_mutex"] }
time = { workspace = true }
type-safe = { workspace = true }

[features]
default = ["syscall", "allocator", "staticlib"]
allocator = ["nvx/allocator"]
syscall = []
std = ["nvx/std"]
staticlib = ["nvx/staticlib"]

# Logging
trace = ["nvx/trace"]
debug = ["nvx/debug"]
info = ["nvx/info"]
warn = ["nvx/warn"]
error = ["nvx/error"]
panic = ["nvx/panic"]
