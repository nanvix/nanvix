[package]
name = "sys"
version.workspace = true
license-file.workspace = true
edition.workspace = true
authors.workspace = true
description = "System Library"
homepage.workspace = true

[dependencies]
cfg-if = { workspace = true }

[build-dependencies]
cc = { workspace = true }
cfg-if = { workspace = true }

[features]
default = ["microvm"]

# Machine Types
microvm = ["stdio", "acpi", "cpuid", "ioapic", "madt", "msr", "pic", "xapic"]
pc = [
    "bios",
    "cmos",
    "mboot",
    "pit",
    "warn",
    "acpi",
    "cpuid",
    "ioapic",
    "madt",
    "msr",
    "pic",
    "xapic",
]
qemu-pc = ["pc"]
qemu-pc-smp = ["qemu-pc", "smp"]
qemu-baremetal = ["pc"]
qemu-baremetal-smp = ["qemu-baremetal", "smp"]
qemu-isapc = ["pc"]

# Architecture Features
acpi = []
cpuid = []
ioapic = []
madt = []
msr = []
pic = []
xapic = []

# Platform Features
smp = []
bios = []
cmos = []
mboot = []
pit = []
stdio = []

# Interface Features
kcall = []

# Logging Features
trace = ["debug"]
debug = ["info"]
info = ["warn"]
warn = ["error"]
error = []
