#
# C header specification for fnmatch.h.
# The gen-headers tool combines this with the extern "C" signatures parsed
# from this crate's sources to produce include/fnmatch.h.

file = "fnmatch.h"
brief = "Filename matching."
description = """
Declares the filename-matching routine fnmatch() and its flags, implemented by
the libc_fnmatch Rust crate."""
includes = []
guard = "_NANVIX_FNMATCH_H"
content_order = ["rust_constants:flags", "section:0"]

[[rust_constants]]
path = "fnmatch::FNM_NOMATCH"
group = "flags"
section_title = "Flags"
c_declaration = '''
#define FNM_NOMATCH 1  /* Value returned on no match. */

#define FNM_PATHNAME (1 << 0) /* No wildcard can ever match '/'. */
#define FNM_PERIOD   (1 << 2) /* Leading '.' is matched only explicitly. */
#define FNM_NOESCAPE (1 << 1) /* Backslashes do not quote special chars. */
#define FNM_CASEFOLD (1 << 4) /* Compare case-insensitively. */

/* Equivalent to FNM_CASEFOLD. */
#define FNM_IGNORECASE FNM_CASEFOLD'''
no_comment = true

[[rust_constants]]
path = "fnmatch::FNM_PATHNAME"
group = "flags"
emit = false

[[rust_constants]]
path = "fnmatch::FNM_PERIOD"
group = "flags"
emit = false

[[rust_constants]]
path = "fnmatch::FNM_NOESCAPE"
group = "flags"
emit = false

[[rust_constants]]
path = "fnmatch::FNM_CASEFOLD"
emit = false

[[rust_constants]]
path = "fnmatch::FNM_IGNORECASE"
group = "flags"
c_value = "FNM_CASEFOLD"
emit = false

[[sections]]
title = "Filename Matching"
functions = ["fnmatch"]
