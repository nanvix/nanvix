# Name of the TAP device in the L2 VM.
tap_name = "vmtap0"

# IP address of linuxd when running inside an L2 VM.
guest_tap_ip_address = "192.168.249.2"

# IP of the TAP device host processes can use to communicate with linuxd inside the L2 VM.
host_tap_ip_address = "192.168.249.3"

# Magic string used to detect when an L2 VM is ready to be snapshotted.
snapshot_magic_string = "Linuxd hit pre-snapshot trap"

# Name for the snapshot file stored in the images directory.
snapshot_name = "l2-sysvm-snapshot"

# Ports used for different services in linuxd.
control_plane_port = 9000
user_vm_port = 9001

# Each user VM instance gets a different gateway port, so we define the allowed port range
# here. Note that this range limits the total number of concurrent user VMs we can have
# at any point in time. We pick large values that are unlikely to overlap with other
# services, and with the ephemeral port range used in Linux, readable with:
# cat /proc/sys/net/ipv4/ip_local_port_range
gateway_port_range_begin = 49152
gateway_port_range_end = 65535
