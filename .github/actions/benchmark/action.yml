name: "Benchmark"
description: "Run all Nanvix micro-benchmarks for performance regression testing"

inputs:
  arch:
    description: "Architecture"
    required: true
    default: "X64"
  benchmark_list:
    description: "List of benchmarks to run"
    required: true

runs:
  using: "composite"
  steps:
  # MicroVM benchmarks
  - name: Create temp dir
    run: |
      TMPDIR_MICROVM=$(mktemp -d /tmp/nanvix-bench-microvm-XXXXX)
      echo "TMPDIR_MICROVM=$TMPDIR_MICROVM" >> "$GITHUB_ENV"
    shell: bash
  - name: Build (MicroVM)
    run: |
      python3 scripts/ci.py --toolchain-dir=$HOME/toolchain --target-arch=x86 --log-level=panic --target-machine=microvm --release --without-opt --build --sccache=${SCCACHE}
    shell: bash
  - name: Run micro-benchmarks (MicroVM)
    run: |
      # Build array from lines, strip CRs, and drop blank/whitespace-only lines.
      mapfile -t benchmarks < <(
        printf '%s\n' "${{ inputs.benchmark_list }}" | tr -d '\r' | sed '/^[[:space:]]*$/d'
      )

      for bench in "${benchmarks[@]}"; do
        # FIXME (#937): cold-start-l2 is failing intermittently on MicroVM
        if [[ "$bench" == "cold-start-l2" ]]; then
          continue
        fi
        bench_underscore=${bench//-/_}
        ./bin/nanvix-bench.elf -tmp-dir ${TMPDIR_MICROVM} -toolchain-bin-dir $HOME/toolchain/bin -benchmark ${bench} -hwloc $HOME/hwloc.json -iterations 1000 | grep -E '^(p50:|p95:|p99:)' > bench_${bench_underscore}_microvm_${{ inputs.arch }}.txt
      done
    shell: bash
  - name: Clean-up temporary directory
    if: always()
    run: rm -rf ${TMPDIR_MICROVM}
    shell: bash

  # Hyperlight benchmarks
  - name: Create temp dir
    run: |
      TMPDIR_HL=$(mktemp -d /tmp/nanvix-bench-hl-XXXXX)
      echo "TMPDIR_HL=$TMPDIR_HL" >> "$GITHUB_ENV"
    shell: bash
  - name: Build (Hyperlight)
    run: |
      python3 scripts/ci.py --toolchain-dir=$HOME/toolchain --target-arch=x86 --log-level=panic --target-machine=hyperlight --release --without-opt --build --sccache=${SCCACHE}
    shell: bash
  - name: Run micro-benchmarks (Hyperlight)
    run: |
      # Build array from lines, strip CRs, and drop blank/whitespace-only lines.
      mapfile -t benchmarks < <(
        printf '%s\n' "${{ inputs.benchmark_list }}" | tr -d '\r' | sed '/^[[:space:]]*$/d'
      )

      for bench in "${benchmarks[@]}"; do
        # FIXME (#709): warm-start-vmm is stuck on hyperlight
        if [[ "$bench" == "warm-start-vmm" ]]; then
              continue
        fi

        # FIXME (#926): cold-start-l2 fails on hyperlight
        if [[ "$bench" == "cold-start-l2" ]]; then
              continue
        fi

        bench_underscore=${bench//-/_}
        ./bin/nanvix-bench.elf -tmp-dir ${TMPDIR_HL} -toolchain-bin-dir $HOME/toolchain/bin -benchmark ${bench}  -hwloc $HOME/hwloc.json -iterations 1000 | grep -E '^(p50:|p95:|p99:)' > bench_${bench_underscore}_hyperlight_${{ inputs.arch }}.txt
      done
    shell: bash
  - name: Clean-up temporary directory
    if: always()
    run: rm -rf ${TMPDIR_HL}
    shell: bash

  # Post-process the results
  - name: Format benchmark results
    id: format
    run: |
      # Build array from lines, strip CRs, and drop blank/whitespace-only lines.
      mapfile -t benchmarks < <(
        printf '%s\n' "${{ inputs.benchmark_list }}" | tr -d '\r' | sed '/^[[:space:]]*$/d'
      )
      comma_separated_benchmarks=$(IFS=,; echo "${benchmarks[*]}")

      python3 ./scripts/ci_bench_summary.py \
        --dev-dir $HOME/ubench-results-dev \
        --target-dir $(pwd) \
        --benchmarks ${comma_separated_benchmarks} \
        --machine-types microvm,hyperlight \
        --archs X64 \
        --output-file /tmp/comment.txt

      echo "BENCHMARK_RESULT<<EOF" >> $GITHUB_OUTPUT
      cat /tmp/comment.txt >> $GITHUB_OUTPUT
      echo "EOF" >> $GITHUB_OUTPUT
    shell: bash
  - name: Get PR number if this push relates to an open PR
    # Only attempt to resolve a PR number when running for a pull_request event
    if: ${{ github.event_name == 'pull_request' }}
    id: pr
    run: |
      PR_NUM="${{ github.event.pull_request.number }}"
      echo "pr_number=$PR_NUM" >> $GITHUB_OUTPUT
    shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
  # Check if we have already written a comment once, in order to update it.
  - name: Find benchmark results comment if it exists
    uses: peter-evans/find-comment@v3
    # Only on PR workflows, and only if we have a PR number
    if: ${{ github.event_name == 'pull_request' && steps.pr.outputs.pr_number != '' }}
    id: fc
    with:
      issue-number: ${{ steps.pr.outputs.pr_number }}
      comment-author: "github-actions[bot]"
      body-includes: "Benchmark Results"
  - name: Post comment to PR (Create comment)
    if: ${{ github.event_name == 'pull_request' && steps.pr.outputs.pr_number != '' && steps.fc.outputs.comment-id == '' }}
    uses: peter-evans/create-or-update-comment@v4
    with:
      issue-number: ${{ steps.pr.outputs.pr_number }}
      body: |
        ## 🔬 Benchmark Results
        ${{ steps.format.outputs.BENCHMARK_RESULT }}
  - name: Post comment to PR (Update comment)
    if: ${{ github.event_name == 'pull_request' && steps.fc.outputs.comment-id != '' }}
    uses: peter-evans/create-or-update-comment@v4
    with:
      comment-id: ${{ steps.fc.outputs.comment-id }}
      edit-mode: replace
      body: |
        ## 🔬 Benchmark Results
        ${{ steps.format.outputs.BENCHMARK_RESULT }}

  # Persist the results if committing on `dev` branch (not a PR).
  - name: Run only on dev branch
    if: github.ref_name == 'dev'
    run: |
      mkdir -p $HOME/ubench-results-dev

      for machine in microvm hyperlight; do
        for benchmark in boot_time cold_start warm_start warm_start_vmm; do
          for arch in X64; do
            file_name="bench_${benchmark}_${machine}_${arch}.txt"
            # Do not fail if file does not exist, but still log an error.
            cp ${file_name} $HOME/ubench-results-dev/${file_name} || true
          done
        done
      done
    shell: bash
