name: "Benchmark"
description: "Run all Nanvix micro-benchmarks for performance regression testing"

inputs:
  arch:
    description: "Architecture"
    required: true
    default: "X64"
  benchmark_list:
    description: "List of benchmarks to run"
    required: true
  github-token:
    description: "GitHub token for API access"
    required: true

runs:
  using: "composite"
  steps:
  # MicroVM benchmarks
  - name: Build (MicroVM)
    run: |
      python3 scripts/ci.py \
        --toolchain-dir=$HOME/toolchain \
        --target-arch=x86 \
        --log-level=panic \
        --target-machine=microvm \
        --release \
        --without-opt \
        --build \
        --sccache=${SCCACHE} \
        --features L2_VM=yes
    shell: bash
  - name: Run micro-benchmarks (MicroVM)
    id: run-microvm-benchmarks
    run: |
      # Build array from lines, strip CRs, and drop blank/whitespace-only lines.
      mapfile -t benchmarks < <(
        printf '%s\n' "${{ inputs.benchmark_list }}" | tr -d '\r' | sed '/^[[:space:]]*$/d'
      )

      must_run_echo_breakdown=false

      for bench in "${benchmarks[@]}"; do
        if [[ "$bench" == "echo-breakdown" || "$bench" == "echo-breakdown-l2" ]]; then
          must_run_echo_breakdown=true
          continue
        fi

        # FIXME(1171): the current L2 deployment involves a very slow network
        # namespace creation, particularly at high-churn, so we must temporarily
        # reduce the number of iterations of the benchmarks.
        python3 ./scripts/benchmark.py \
          run \
          --benchmark ${bench} \
          --machine-type microvm \
          --hwloc $HOME/hwloc.json \
          --iterations 100 \
          --toolchain-bin-dir $HOME/toolchain/bin \
          --output-dir $(pwd)
      done

      echo "must_run_echo_breakdown=$must_run_echo_breakdown" >> "$GITHUB_OUTPUT"
    shell: bash
  - name: Run the echo-breakdown benchmarks (Microvm, require re-compilation)
    if: steps.run-microvm-benchmarks.outputs.must_run_echo_breakdown == 'true'
    shell: bash
    run: |
      # Build array from lines, strip CRs, and drop blank/whitespace-only lines.
      mapfile -t benchmarks < <(
        printf '%s\n' "${{ inputs.benchmark_list }}" | tr -d '\r' | sed '/^[[:space:]]*$/d'
      )

      # Re-compile.
      python3 scripts/ci.py \
        --toolchain-dir=$HOME/toolchain \
        --target-arch=x86 \
        --log-level=panic \
        --target-machine=microvm \
        --release \
        --without-opt \
        --build \
        --sccache=${SCCACHE} \
        --features L2_VM=yes,TIMESTAMP_MSG=yes

      # Run only the specific benchmarks.
      for bench in "${benchmarks[@]}"; do
        if [[ "$bench" == "echo-breakdown" || "$bench" == "echo-breakdown-l2" ]]; then
          python3 ./scripts/benchmark.py \
            run \
            --benchmark ${bench} \
            --machine-type microvm \
            --hwloc $HOME/hwloc.json \
            --iterations 1000 \
            --toolchain-bin-dir $HOME/toolchain/bin \
            --output-dir $(pwd)
        fi
      done

  # Hyperlight benchmarks
  - name: Build (Hyperlight)
    run: |
      python3 scripts/ci.py \
        --toolchain-dir=$HOME/toolchain \
        --target-arch=x86 \
        --log-level=panic \
        --target-machine=hyperlight \
        --release \
        --without-opt \
        --build \
        --sccache=${SCCACHE} \
        --features L2_VM=yes
    shell: bash
  - name: Run micro-benchmarks (Hyperlight)
    id: run-hyperlight-benchmarks
    run: |
      # Build array from lines, strip CRs, and drop blank/whitespace-only lines.
      mapfile -t benchmarks < <(
        printf '%s\n' "${{ inputs.benchmark_list }}" | tr -d '\r' | sed '/^[[:space:]]*$/d'
      )

      must_run_echo_breakdown=false

      for bench in "${benchmarks[@]}"; do
        # FIXME (#709): warm-start-vmm is stuck on hyperlight
        if [[ "$bench" == "warm-start-vmm" ]]; then
          continue
        fi

        # FIXME (#1016): boot-time is failing on hyperlight
        if [[ "$bench" == "boot-time" ]]; then
          continue
        fi

        if [[ "$bench" == "echo-breakdown" || "$bench" == "echo-breakdown-l2" ]]; then
          must_run_echo_breakdown=true
          continue
        fi

        # FIXME(1171): the current L2 deployment involves a very slow network
        # namespace creation, particularly at high-churn, so we must temporarily
        # reduce the number of iterations of the benchmarks.
        python3 ./scripts/benchmark.py \
          run \
          --benchmark ${bench} \
          --machine-type hyperlight \
          --hwloc $HOME/hwloc.json \
          --iterations 100 \
          --toolchain-bin-dir $HOME/toolchain/bin \
          --output-dir $(pwd)
      done

      echo "must_run_echo_breakdown=$must_run_echo_breakdown" >> "$GITHUB_OUTPUT"
    shell: bash
  - name: Run the echo-breakdown benchmarks (Hyperlight, require re-compilation)
    if: steps.run-hyperlight-benchmarks.outputs.must_run_echo_breakdown == 'true'
    shell: bash
    run: |
      # Build array from lines, strip CRs, and drop blank/whitespace-only lines.
      mapfile -t benchmarks < <(
        printf '%s\n' "${{ inputs.benchmark_list }}" | tr -d '\r' | sed '/^[[:space:]]*$/d'
      )

      # Re-compile.
      python3 scripts/ci.py \
        --toolchain-dir=$HOME/toolchain \
        --target-arch=x86 \
        --log-level=panic \
        --target-machine=hyperlight \
        --release \
        --without-opt \
        --build \
        --sccache=${SCCACHE} \
        --features L2_VM=yes,TIMESTAMP_MSG=yes

      # Run only the specific benchmarks.
      for bench in "${benchmarks[@]}"; do
        if [[ "$bench" == "echo-breakdown" || "$bench" == "echo-breakdown-l2" ]]; then
          python3 ./scripts/benchmark.py \
            run \
            --benchmark ${bench} \
            --machine-type hyperlight \
            --hwloc $HOME/hwloc.json \
            --iterations 1000 \
            --toolchain-bin-dir $HOME/toolchain/bin \
            --output-dir $(pwd)
        fi
      done

  # Post-process the results
  - name: Format benchmark results
    id: format
    run: |
      # Build array from lines, strip CRs, and drop blank/whitespace-only lines.
      mapfile -t benchmarks < <(
        printf '%s\n' "${{ inputs.benchmark_list }}" | tr -d '\r' | sed '/^[[:space:]]*$/d'
      )
      comma_separated_benchmarks=$(IFS=,; echo "${benchmarks[*]}")

      python3 ./scripts/benchmark.py \
        ci-summary \
        --dev-dir $HOME/ubench-results-dev \
        --target-dir $(pwd) \
        --benchmarks ${comma_separated_benchmarks} \
        --machine-types microvm,hyperlight \
        --archs X64 \
        --output-file /tmp/comment.txt

      echo "BENCHMARK_RESULT<<EOF" >> $GITHUB_OUTPUT
      cat /tmp/comment.txt >> $GITHUB_OUTPUT
      echo "EOF" >> $GITHUB_OUTPUT
    shell: bash
  - name: Get PR number if this push relates to an open PR
    # Only attempt to resolve a PR number when running for a pull_request event
    if: ${{ github.event_name == 'pull_request' }}
    id: pr
    run: |
      PR_NUM="${{ github.event.pull_request.number }}"
      echo "pr_number=$PR_NUM" >> $GITHUB_OUTPUT
    shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
  # Check if we have already written a comment once, in order to update it.
  - name: Find benchmark results comment if it exists
    uses: peter-evans/find-comment@v3
    # Only on PR workflows, and only if we have a PR number
    if: ${{ github.event_name == 'pull_request' && steps.pr.outputs.pr_number != '' }}
    id: fc
    with:
      token: ${{ inputs.github-token }}
      issue-number: ${{ steps.pr.outputs.pr_number }}
      comment-author: "github-actions[bot]"
      body-includes: "Benchmark Results"
  - name: Post comment to PR (Create comment)
    if: ${{ github.event_name == 'pull_request' && steps.pr.outputs.pr_number != '' && steps.fc.outputs.comment-id == '' }}
    uses: peter-evans/create-or-update-comment@v4
    with:
      token: ${{ inputs.github-token }}
      issue-number: ${{ steps.pr.outputs.pr_number }}
      body: |
        ## 🔬 Benchmark Results
        ${{ steps.format.outputs.BENCHMARK_RESULT }}
  - name: Post comment to PR (Update comment)
    if: ${{ github.event_name == 'pull_request' && steps.fc.outputs.comment-id != '' }}
    uses: peter-evans/create-or-update-comment@v4
    with:
      token: ${{ inputs.github-token }}
      comment-id: ${{ steps.fc.outputs.comment-id }}
      edit-mode: replace
      body: |
        ## 🔬 Benchmark Results
        ${{ steps.format.outputs.BENCHMARK_RESULT }}

  # Persist the results if committing on `dev` branch (not a PR).
  - name: Run only on dev branch
    if: github.ref_name == 'dev'
    run: |
      target_dir=$HOME/ubench-results-dev
      mkdir -p ${target_dir}

      # Build array from lines, strip CRs, and drop blank/whitespace-only lines.
      mapfile -t benchmarks < <(
        printf '%s\n' "${{ inputs.benchmark_list }}" | tr -d '\r' | sed '/^[[:space:]]*$/d'
      )
      comma_separated_benchmarks=$(IFS=,; echo "${benchmarks[*]}")
      comma_separated_machines=microvm,hyperlight
      comma_separated_archs=X64

      python3 ./scripts/benchmark.py \
        copy-results \
        --benchmarks ${comma_separated_benchmarks} \
        --machine-types ${comma_separated_machines} \
        --archs ${comma_separated_archs} \
        --source-dir $(pwd) \
        --target-dir ${target_dir}
    shell: bash
