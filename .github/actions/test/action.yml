name: "Test"
description: "Run the integration tests for all machine types"

inputs:
  release:
    description: "Release type"
    required: true
    default: "release"
  log-level:
    description: "Log level"
    required: true
    default: "trace"
  machine-type:
    description: "Machine type"
    required: true
    default: "qemu-pc"

runs:
  using: "composite"
  steps:
  - name: "Test (${{ inputs.machine-type }})"
    run: |
      python3 scripts/ci.py --toolchain-dir=$HOME/toolchain --target-arch=x86 --log-level=${{ inputs.log-level }} --target-machine=${{ inputs.machine-type }} --${{ inputs.release }} --test
    shell: bash
