name: "Benchmark Report"
description: "Format benchmark results and post them as a PR comment"

inputs:
  benchmarks:
    description: "Comma-separated list of all benchmark names"
    required: true
  machine-types:
    description: "Comma-separated list of machine types"
    required: true
    default: "microvm"
  archs:
    description: "Comma-separated list of architectures"
    required: true
    default: "X64"
  dev-dir:
    description: "Directory containing baseline results from the dev branch"
    required: true
  runner-label:
    description: "Label identifying the runner environment (e.g., self-hosted,
      github-hosted). Used to distinguish artifacts and PR comments."
    required: true
  github-token:
    description: "GitHub token for posting PR comments"
    required: true

runs:
  using: "composite"
  steps:
    - name: "Format benchmark results"
      id: format
      shell: bash
      env:
        BENCHMARKS: ${{ inputs.benchmarks }}
        MACHINE_TYPES: ${{ inputs.machine-types }}
        ARCHS: ${{ inputs.archs }}
        DEV_DIR: ${{ inputs.dev-dir }}
      run: |
        python3 ./scripts/benchmark.py \
          ci-summary \
          --dev-dir "${DEV_DIR}" \
          --target-dir "$(pwd)" \
          --benchmarks "${BENCHMARKS}" \
          --machine-types "${MACHINE_TYPES}" \
          --archs "${ARCHS}" \
          --output-file /tmp/comment.txt

        echo "BENCHMARK_RESULT<<EOF" >> "$GITHUB_OUTPUT"
        cat /tmp/comment.txt >> "$GITHUB_OUTPUT"
        echo "EOF" >> "$GITHUB_OUTPUT"

    - name: "Get PR number"
      if: ${{ github.event_name == 'pull_request' || github.event_name ==
        'pull_request_target' }}
      id: pr
      shell: bash
      run: |
        PR_NUM="${{ github.event.pull_request.number }}"
        echo "pr_number=$PR_NUM" >> "$GITHUB_OUTPUT"

    - name: "Determine PR comment strategy"
      if: ${{ (github.event_name == 'pull_request' || github.event_name ==
        'pull_request_target') && steps.pr.outputs.pr_number != '' }}
      id: comment-strategy
      shell: bash
      run: |
        origin_repo="${{ github.repository }}"
        head_repo="${{ github.event.pull_request.head.repo.full_name }}"

        if [[ "${head_repo}" == "${origin_repo}" ]]; then
          echo "can_comment_directly=true" >> "$GITHUB_OUTPUT"
          echo "needs_deferred_comment=false" >> "$GITHUB_OUTPUT"
        else
          echo "can_comment_directly=false" >> "$GITHUB_OUTPUT"
          echo "needs_deferred_comment=true" >> "$GITHUB_OUTPUT"
        fi

    - name: "Find benchmark results comment if it exists"
      uses: peter-evans/find-comment@v4
      if: ${{ (github.event_name == 'pull_request' || github.event_name ==
        'pull_request_target') && steps.pr.outputs.pr_number != '' &&
        steps.comment-strategy.outputs.can_comment_directly == 'true' }}
      id: fc
      # Posting the PR comment is best-effort: a transient GitHub API hiccup
      # (e.g. an intermittent 401) must not fail the benchmark finalize job.
      continue-on-error: true
      with:
        token: ${{ inputs.github-token }}
        issue-number: ${{ steps.pr.outputs.pr_number }}
        comment-author: "github-actions[bot]"
        body-includes: "🔬 Benchmark Results (${{ inputs.runner-label }})"

    - name: "Post comment to PR (Create)"
      if: ${{ (github.event_name == 'pull_request' || github.event_name ==
        'pull_request_target') && steps.pr.outputs.pr_number != '' &&
        steps.comment-strategy.outputs.can_comment_directly == 'true' &&
        steps.fc.outcome == 'success' &&
        steps.fc.outputs.comment-id == '' }}
      uses: peter-evans/create-or-update-comment@v5
      # Posting the PR comment is best-effort: a transient GitHub API hiccup
      # (e.g. an intermittent 401) must not fail the benchmark finalize job.
      continue-on-error: true
      with:
        token: ${{ inputs.github-token }}
        issue-number: ${{ steps.pr.outputs.pr_number }}
        body: |
          ## 🔬 Benchmark Results (${{ inputs.runner-label }})
          ${{ steps.format.outputs.BENCHMARK_RESULT }}

    - name: "Post comment to PR (Update)"
      if: ${{ (github.event_name == 'pull_request' || github.event_name ==
        'pull_request_target') &&
        steps.comment-strategy.outputs.can_comment_directly == 'true' &&
        steps.fc.outcome == 'success' &&
        steps.fc.outputs.comment-id != '' }}
      uses: peter-evans/create-or-update-comment@v5
      # Posting the PR comment is best-effort: a transient GitHub API hiccup
      # (e.g. an intermittent 401) must not fail the benchmark finalize job.
      continue-on-error: true
      with:
        token: ${{ inputs.github-token }}
        comment-id: ${{ steps.fc.outputs.comment-id }}
        edit-mode: replace
        body: |
          ## 🔬 Benchmark Results (${{ inputs.runner-label }})
          ${{ steps.format.outputs.BENCHMARK_RESULT }}

    - name: "Prepare benchmark comment payload"
      if: ${{ (github.event_name == 'pull_request' || github.event_name ==
        'pull_request_target') && steps.pr.outputs.pr_number != '' }}
      id: benchmark-comment-payload
      shell: bash
      env:
        BENCHMARK_RESULT: ${{ steps.format.outputs.BENCHMARK_RESULT }}
        NEEDS_DEFERRED: ${{ steps.comment-strategy.outputs.needs_deferred_comment || 'false' }}
        RUNNER_LABEL: ${{ inputs.runner-label }}
      run: |
        mkdir -p comment-payload

        {
          printf '## 🔬 Benchmark Results (%s)\n' "${RUNNER_LABEL}"
          printf '%s\n' "${BENCHMARK_RESULT}"
        } > comment-payload/body.md

        if [[ "${NEEDS_DEFERRED}" == "true" ]]; then
          needs_comment=true
        else
          needs_comment=false
        fi

        cat <<EOF > comment-payload/metadata.json
        {
          "pr_number": "${{ steps.pr.outputs.pr_number }}",
          "needs_comment": ${needs_comment},
          "workflow_run_id": "${{ github.run_id }}"
        }
        EOF

    - name: "Upload benchmark comment payload"
      if: ${{ (github.event_name == 'pull_request' || github.event_name ==
        'pull_request_target') && steps.pr.outputs.pr_number != '' }}
      uses: actions/upload-artifact@v6
      with:
        name: benchmark-comment-${{ inputs.runner-label }}-${{ github.run_id }}
        path: comment-payload
        retention-days: 7
