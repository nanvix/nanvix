name: "Integration Test"
description: "Run integration tests for microvm/hyperlight or qemu-pc machine types"

inputs:
  build-type:
    description: "Build type (debug or release)"
    required: true
  machine-type:
    description: "Machine type"
    required: true
  deployment-type:
    description: "Deployment type"
    required: true

runs:
  using: "composite"
  steps:
  # For microvm/hyperlight: smoke test that boots nanvixd and checks for the
  # kernel magic string, verifying the multibin initrd (procd, testd, memd).
  - name: "Smoke Test (microvm/hyperlight)"
    if: inputs.machine-type == 'microvm' || inputs.machine-type == 'hyperlight'
    shell: bash
    env:
      RUST_LOG: debug
    run: |
      set -Eeuo pipefail

      MAGIC_STRING="hello, world!"
      TIMEOUT=120

      # Build multibin image from pre-built artifacts.
      ./bin/mkimage.elf -o nanvix.img \
          "bin/procd.elf;procd" \
          "bin/memd.elf;memd" \
          "bin/testd.elf;testd"

      if [[ "${{ inputs.build-type }}" == "release" ]]; then
        # In release builds, CI sets LOG_LEVEL=error, which suppresses the
        # debug-level magic string. Validate success by requiring nanvixd to
        # exit cleanly before timeout.
        if ! bash scripts/run-nanvixd.sh \
              "${{ inputs.machine-type }}" nanvix.img "${TIMEOUT}"; then
          echo "::error::Smoke test failed: nanvixd did not exit cleanly within ${TIMEOUT}s."
          exit 1
        fi
      else
        # In debug builds, assert successful boot by waiting for kernel magic
        # string in console output.
        if ! bash scripts/run-nanvixd.sh \
              "${{ inputs.machine-type }}" nanvix.img "${TIMEOUT}" \
              --wait-for-string "${MAGIC_STRING}"; then
          echo "::error::Smoke test failed: magic string '${MAGIC_STRING}' not found within ${TIMEOUT}s."
          exit 1
        fi
      fi

      echo "Smoke test passed."

  # For microvm/hyperlight: run test binary directly from downloaded artifacts.
  - name: "Integration Test (microvm/hyperlight)"
    if: inputs.machine-type == 'microvm' || inputs.machine-type == 'hyperlight'
    shell: bash
    env:
      RUST_LOG: info
    run: |
      set -Eeuo pipefail

      # Determine test config based on deployment type.
      case "${{ inputs.deployment-type }}" in
        single-process) TEST_CONFIG="test/test-single_process.toml" ;;
        multi-process)  TEST_CONFIG="test/test-multi_process.toml" ;;
        l2)             TEST_CONFIG="test/test-l2.toml" ;;
        *)
          echo "::error::Unknown deployment type: ${{ inputs.deployment-type }}"
          exit 1
          ;;
      esac

      echo "Running: ./bin/nanvix-test.elf ${TEST_CONFIG}"
      ./bin/nanvix-test.elf "${TEST_CONFIG}"

  # For qemu-pc: create an ISO from the pre-built artifacts and run QEMU directly.
  - name: "Integration Test (qemu-pc)"
    if: inputs.machine-type == 'qemu-pc'
    shell: bash
    run: |
      set -Eeuo pipefail

      MAGIC_STRING="hello, world!"
      TIMEOUT=600

      # Build the ISO image from pre-built artifacts.
      mkdir -p image/boot/grub
      cp build/iso/boot/grub/grub.cfg image/boot/grub/
      cp bin/*.elf image/
      grub-mkrescue image -o nanvix.iso

      if [[ "${{ inputs.build-type }}" == "release" ]]; then
        # In release builds, CI sets LOG_LEVEL=error, which suppresses the debug-level
        # magic string. Validate success by requiring QEMU to exit cleanly before timeout.
        if ! bash scripts/run-qemu.sh x86 qemu-pc nanvix.iso --no-debug "${TIMEOUT}"; then
          echo "::error::Integration test failed: QEMU did not exit cleanly within ${TIMEOUT}s."
          exit 1
        fi
      else
        # In debug builds, assert successful execution by waiting for kernel magic string.
        if ! bash scripts/run-qemu.sh x86 qemu-pc nanvix.iso --no-debug "${TIMEOUT}" \
          --wait-for-string "${MAGIC_STRING}"; then
          echo "::error::Integration test failed: magic string '${MAGIC_STRING}' not found within ${TIMEOUT}s."
          exit 1
        fi
      fi

      echo "Integration test passed."
