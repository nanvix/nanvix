name: "Free Disk Space"
description: "Remove pre-installed software from GitHub-hosted runners to
  reclaim disk space"

inputs:
  remove-hostedtoolcache:
    description: "Remove /opt/hostedtoolcache (pre-installed runner tools such as
      Node.js and Python). Set to 'false' when the runner still needs these
      tools (e.g., Copilot agent)."
    required: false
    default: "true"

runs:
  using: "composite"
  steps:
    - name: "Disk Usage (before cleanup)"
      shell: bash
      run: df -h /

    - name: "Free Disk Space"
      shell: bash
      run: |
        # Remove pre-installed software in parallel (I/O-bound, no ordering deps).
        sudo rm -rf /usr/lib/jvm &                        # Java (JDKs)
        sudo rm -rf /usr/share/dotnet &                   # .NET SDKs
        sudo rm -rf /usr/share/swift &                    # Swift toolchain
        sudo rm -rf /usr/local/.ghcup &                   # Haskell (GHC)
        sudo rm -rf /opt/ghc &                            # GHC (secondary location)
        sudo rm -rf /usr/local/julia* &                   # Julia
        sudo rm -rf /usr/local/lib/android &              # Android SDKs
        sudo rm -rf /usr/local/share/chromium &           # Chromium
        sudo rm -rf /opt/microsoft /opt/google &          # Microsoft Edge / Google Chrome
        sudo rm -rf /opt/az &                             # Azure CLI
        sudo rm -rf /usr/local/share/powershell &         # PowerShell
        if [[ "${{ inputs.remove-hostedtoolcache }}" == "true" ]]; then
          sudo rm -rf /opt/hostedtoolcache &              # GitHub hosted tool cache
        fi
        sudo apt-get clean &
        wait
        docker system prune -af || true
        docker builder prune -af || true

    - name: "Disk Usage (after cleanup)"
      shell: bash
      run: df -h /
