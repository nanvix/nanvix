name: "Spellcheck"
description: "Run the spellcheck target on the source code and documentation"

inputs:
  release:
    description: "Release type"
    required: true
    default: "release"
  log-level:
    description: "Log level"
    required: true
    default: "trace"
  machine-type:
    description: "Machine type"
    required: true
    default: "qemu-pc"
  deployment-type:
    description: "Deployment type"
    required: true
    default: "single-process"

runs:
  using: "composite"
  steps:
  - id: deployment
    uses: ./.github/actions/deployment-features
    with:
      deployment-type: "${{ inputs.deployment-type }}"
  - name: "Spellcheck (${{ inputs.machine-type }})"
    shell: bash
    run: |
      ./z build \
        --toolchain-dir "$HOME/toolchain" \
        -- \
        spellcheck \
        "MACHINE=${{ inputs.machine-type }}" \
        TARGET=x86 \
        "LOG_LEVEL=${{ inputs.log-level }}" \
        VERBOSE=yes \
        ${{ inputs.release == 'release' && 'RELEASE=yes' || '' }} \
        ${{ steps.deployment.outputs.make-flags }}
