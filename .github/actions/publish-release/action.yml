name: "Publish Release"
description: "Publish the latest release to GitHub and trigger downstream dispatches"

inputs:
  github-token:
    description: "GitHub token for creating releases"
    required: true
  dispatch-token:
    description: "Token for dispatching to downstream repositories (optional)"
    required: false
    default: ""

runs:
  using: "composite"
  steps:
  - name: "Extract Version"
    id: version
    shell: bash
    run: |
      version=$(grep -m 1 '^version = ' Cargo.toml | sed 's/version = "\(.*\)"/\1/')
      if [ -z "${version}" ]; then
        echo "Warning: Failed to extract version from Cargo.toml, using fallback"
        version="?.?.?"
      fi
      echo "version=${version}" >> "${GITHUB_OUTPUT}"

  - name: "Download release artifacts"
    uses: actions/download-artifact@v7
    with:
      pattern: release-*
      path: release-artifacts

  - name: "Reset Latest Release"
    uses: actions/github-script@v8
    with:
      github-token: ${{ inputs.github-token }}
      script: |
        const tag = 'latest';
        const owner = context.repo.owner;
        const repo = context.repo.repo;

        async function deleteReleaseByTag() {
          try {
            const { data } = await github.rest.repos.getReleaseByTag({ owner, repo, tag });
            core.info(`Deleting release ${data.id} (${tag}).`);
            await github.rest.repos.deleteRelease({ owner, repo, release_id: data.id });
          } catch (error) {
            if (error.status === 404) {
              core.info('No existing latest release to delete.');
              return;
            }
            throw error;
          }
        }

        // Clean up orphaned draft releases left behind by prior runs that
        // failed after creating a draft but before publishing it.
        // getReleaseByTag() only finds published releases, so draft orphans
        // are invisible to the deleteReleaseByTag() cleanup above.
        async function deleteStaleDraftReleases() {
          const releases = await github.paginate(
            github.rest.repos.listReleases,
            { owner, repo, per_page: 100 }
          );
          const stale = releases.filter(r =>
            r.draft && r.tag_name === tag
          );
          for (const rel of stale) {
            core.info(`Deleting stale draft release ${rel.id} ("${rel.name}").`);
            await github.rest.repos.deleteRelease({ owner, repo, release_id: rel.id });
          }
          if (stale.length === 0) {
            core.info('No stale draft releases found.');
          }
        }

        async function deleteTagRef() {
          try {
            await github.rest.git.deleteRef({ owner, repo, ref: `tags/${tag}` });
            core.info('Deleted refs/tags/latest tag.');
          } catch (error) {
            if (error.status === 404 || error.status === 422) {
              core.info('Tag refs/tags/latest not found; nothing to delete.');
              return;
            }
            throw error;
          }
        }

        await deleteReleaseByTag();
        await deleteStaleDraftReleases();
        await deleteTagRef();

  - name: "Create Latest Release"
    uses: actions/github-script@v8
    env:
      RELEASE_VERSION: ${{ steps.version.outputs.version }}
    with:
      github-token: ${{ inputs.github-token }}
      script: |
        const fs = require('fs');
        const path = require('path');

        const owner = context.repo.owner;
        const repo = context.repo.repo;
        const tag = 'latest';
        const version = process.env.RELEASE_VERSION;
        const commitSha = context.sha;

        // Create a published release, explicitly targeting the workflow commit
        // to prevent benchmark-persist (which may have advanced the default
        // branch HEAD) from causing the tag to point to the wrong commit.
        core.info(`Creating release "Nanvix ${version}" at ${commitSha}...`);
        const { data: release } = await github.rest.repos.createRelease({
          owner,
          repo,
          tag_name: tag,
          target_commitish: commitSha,
          name: `Nanvix ${version}`,
          body: `Automated release for Nanvix ${version}.`,
          draft: false,
          prerelease: false,
          make_latest: "true",
        });
        core.info(`Created release ${release.id} (${release.html_url}).`);

        // Upload a single release asset with retries on transient failures.
        async function uploadAssetWithRetry(releaseId, name, data, retries = 3) {
          for (let attempt = 1; attempt <= retries; attempt++) {
            try {
              await github.rest.repos.uploadReleaseAsset({
                owner,
                repo,
                release_id: releaseId,
                name,
                data,
                headers: {
                  'content-type': 'application/x-bzip2',
                  'content-length': data.length,
                },
              });
              return;
            } catch (error) {
              if (attempt < retries) {
                const delay = attempt * 2000;
                core.warning(`Upload of ${name} failed (attempt ${attempt}/${retries}): ${error.message}. Retrying in ${delay}ms...`);
                await new Promise(r => setTimeout(r, delay));
              } else {
                throw error;
              }
            }
          }
        }

        // Upload release artifacts.
        const globber = await glob.create('release-artifacts/**/*.tar.bz2');
        const files = await globber.glob();
        core.info(`Found ${files.length} artifact(s) to upload.`);

        for (const filePath of files) {
          const name = path.basename(filePath);
          const data = fs.readFileSync(filePath);
          core.info(`Uploading ${name} (${data.length} bytes)...`);
          await uploadAssetWithRetry(release.id, name, data);
        }

        // Verify the release is published and not draft.
        const { data: verify } = await github.rest.repos.getRelease({
          owner,
          repo,
          release_id: release.id,
        });

        if (verify.draft) {
          core.setFailed(`Release ${release.id} is unexpectedly a draft after creation.`);
          return;
        }
        core.info(`Verified release ${release.id} is published (draft=${verify.draft}).`);

  - name: "Trigger Nanvix Release Dispatch"
    shell: bash
    env:
      DISPATCH_TOKEN: ${{ inputs.dispatch-token }}
    run: |
      if [[ -z "${DISPATCH_TOKEN}" ]]; then
        echo "::warning::DISPATCH_TOKEN secret is not configured; skipping release dispatch."
        exit 0
      fi

      repos=("bzip2" "cpython" "cymem" "kiwi" "libexpat" "libffi" "murmurhash" "numpy" "openblas" "openssl" "preshed" "quickjs" "rusty_v8" "sqlite" "srsly" "zlib")
      failed=0

      for repo in "${repos[@]}"; do
        API_URL="https://api.github.com/repos/nanvix/${repo}/dispatches"
        PAYLOAD=$(cat <<JSON
      {
        "event_type": "nanvix-minor-release",
        "client_payload": {
          "source_repo": "nanvix/nanvix",
          "ref": "${GITHUB_REF}",
          "sha": "${GITHUB_SHA}",
          "component": "${repo}",
          "reason": "sync build from nanvix/nanvix"
        }
      }
      JSON
      )

        http_response=$(curl -sS -o /dev/null -w "%{http_code}" -X POST \
          -H "Accept: application/vnd.github+json" \
          -H "Authorization: Bearer ${DISPATCH_TOKEN}" \
          -H "X-GitHub-Api-Version: 2022-11-28" \
          "$API_URL" \
          -d "${PAYLOAD}")

        if [[ "${http_response}" -ge 200 && "${http_response}" -lt 300 ]]; then
          echo "Dispatched nanvix-release event to nanvix/${repo} (HTTP ${http_response})."
        else
          echo "::error::Failed to dispatch nanvix-release event to nanvix/${repo} (HTTP ${http_response})."
          failed=1
        fi
      done

      if [[ "${failed}" -eq 1 ]]; then
        exit 1
      fi
