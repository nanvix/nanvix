name: "Native Setup"
description: "Set up native build environment on GitHub-hosted runners (no Docker)"

inputs:
  components:
    description: "Space-separated list of additional Rust components to install (e.g., 'rustfmt clippy')"
    required: false
    default: ""
  install-cloud-hypervisor:
    description: "Build and install cloud-hypervisor from source (for benchmark runs)"
    required: false
    default: "false"

runs:
  using: "composite"
  steps:
    - name: "Free Disk Space"
      uses: ./.github/actions/free-disk-space

    - name: "Install Rust Toolchain"
      shell: bash
      run: |
        # The rust-toolchain file auto-configures the channel via rustup.
        rustup show
        # Install additional components if requested.
        for component in ${{ inputs.components }}; do
          rustup component add "${component}"
        done

    - name: "Install System Dependencies"
      shell: bash
      run: |
        if [ "${{ inputs.install-cloud-hypervisor }}" = "true" ]; then
          ./z setup --l2-deployment
        else
          ./z setup
        fi

    - name: "Setup Python Environment"
      shell: bash
      run: |
        python3 -m venv .venv
        .venv/bin/pip install --quiet -r requirements.txt
