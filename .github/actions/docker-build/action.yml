name: "Docker Build"
description: "Build all Nanvix targets and run unit tests using Docker toolchain"

inputs:
  release:
    description: "Release type"
    required: true
    default: "release"
  log-level:
    description: "Log level"
    required: true
    default: "trace"
  machine-type:
    description: "Machine type"
    required: true
    default: "microvm"
  deployment-type:
    description: "Deployment type"
    required: true
    default: "single-process"
  target-arch:
    description: "Target architecture (x86 or x86_64)"
    required: false
    default: "x86"
  timeout:
    description: "Build timeout in seconds passed through to make"
    required: false
    default: "600"
  sccache-gha-enabled:
    description: "Enable sccache GitHub Actions cache backend (true/false)"
    required: false
    default: "false"

runs:
  using: "composite"
  steps:
  - id: deployment
    uses: ./.github/actions/deployment-features
    with:
      deployment-type: "${{ inputs.deployment-type }}"
  - name: "Build & Unit Test (${{ inputs.machine-type }})"
    shell: bash
    env:
      MACHINE_TYPE: ${{ inputs.machine-type }}
      LOG_LEVEL: ${{ inputs.log-level }}
      BUILD_TIMEOUT: ${{ inputs.timeout }}
      RELEASE_FLAG: ${{ inputs.release == 'release' && 'RELEASE=yes' || '' }}
      # For release builds, also run 'release' (which depends on 'all install'
      # and creates a tar archive) so that the archive is built inside Docker
      # with correct file permissions and can be reused directly by the
      # release-package action.
      BUILD_TARGETS: ${{ inputs.release == 'release' && 'all run-unit-tests release' || 'all run-unit-tests' }}
      MAKE_FLAGS: ${{ steps.deployment.outputs.make-flags }}
      # sccache GitHub Actions cache backend variables. When sccache-gha-enabled
      # is true, these are forwarded into the Docker build so that sccache inside
      # the container uses the GHA cache as a remote storage backend.
      # SCCACHE_GHA_CACHE_TO sets the cache key for writing compilation results.
      # SCCACHE_GHA_CACHE_FROM sets the cache key for reading cached results;
      # without it sccache writes to the cache but never reads, causing 0% hit rate.
      SCCACHE_GHA_ENABLED: ${{ inputs.sccache-gha-enabled == 'true' && 'true' || '' }}
      SCCACHE_GHA_CACHE_TO: ${{ inputs.sccache-gha-enabled == 'true' && format('sccache-{0}-{1}-{2}-{3}', inputs.target-arch, inputs.machine-type, inputs.deployment-type, inputs.release) || '' }}
      SCCACHE_GHA_CACHE_FROM: ${{ inputs.sccache-gha-enabled == 'true' && format('sccache-{0}-{1}-{2}-{3}', inputs.target-arch, inputs.machine-type, inputs.deployment-type, inputs.release) || '' }}
    run: |
      ./z build --with-minimal-docker -- ${BUILD_TARGETS} \
        "MACHINE=${MACHINE_TYPE}" \
        TARGET=${{ inputs.target-arch }} \
        "LOG_LEVEL=${LOG_LEVEL}" \
        VERBOSE=yes \
        BUILD_OPT=yes \
        "TIMEOUT=${BUILD_TIMEOUT}" \
        ${RELEASE_FLAG} \
        ${MAKE_FLAGS}
