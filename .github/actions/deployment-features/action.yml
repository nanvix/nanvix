name: "Resolve Deployment Features"
description: "Compute make flags for a given deployment type"

inputs:
  deployment-type:
    description: "Deployment type"
    required: true

outputs:
  make-flags:
    description: "Make flags for builds"
    value: ${{ steps.compute.outputs.make-flags }}

runs:
  using: "composite"
  steps:
    - id: compute
      shell: bash
      run: |
        case "${{ inputs.deployment-type }}" in
          standalone|single-process|multi-process|l2)
            echo "make-flags=DEPLOYMENT_MODE=${{ inputs.deployment-type }}" >> "$GITHUB_OUTPUT"
            ;;
          *)
            echo "invalid deployment type: ${{ inputs.deployment-type }}" >&2
            exit 1
            ;;
        esac
