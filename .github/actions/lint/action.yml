name: "Lint"
description: "Run the lint target on the source code"

inputs:
  release:
    description: "Release type"
    required: true
    default: "release"
  log-level:
    description: "Log level"
    required: true
    default: "trace"
  machine-type:
    description: "Machine type"
    required: true
    default: "microvm"
  deployment-type:
    description: "Deployment type"
    required: true
    default: "single-process"

runs:
  using: "composite"
  steps:
    - name: "Lint (${{ inputs.machine-type }})"
      shell: bash
      run: |
        ./z build \
          -- \
          lint-check \
          "MACHINE=${{ inputs.machine-type }}" \
          TARGET=x86 \
          "LOG_LEVEL=${{ inputs.log-level }}" \
          VERBOSE=yes \
          ${{ inputs.release == 'release' && 'RELEASE=yes' || '' }} \
          "DEPLOYMENT_MODE=${{ inputs.deployment-type }}"
