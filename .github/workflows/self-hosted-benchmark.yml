name: "Nanvix Benchmark (Self-Hosted)"

on:
  pull_request:
    types:
      - 'opened'
      - 'synchronize'
      - 'reopened'
      - 'ready_for_review'
    branches:
      - 'dev'

  push:
    branches:
      - 'dev'

# Cancel previous running actions for the same PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/dev' }}

env:
  TARGET_BRANCH: ${{ github.ref_name }}
  SCCACHE: "/usr/local/bin/sccache"

jobs:
  benchmark:
    name: "Nanvix Benchmark (self-hosted)"
    timeout-minutes: 240
    strategy:
      matrix:
        build-type: [release]
        arch: [X64]
    runs-on: [self-hosted, Linux, X64, baremetal]

    # Only run the benchmark for:
    # - Pushes to 'dev' (handled by workflow triggers above)
    # - Non-draft PRs where the source branch starts with one of:
    #     'enhancement-', 'feature-', 'bugfix-', or 'copilot/' (skip dependabot PRs)
    if: |
      github.event_name != 'pull_request' ||
      (
        !github.event.pull_request.draft &&
        !startsWith(github.head_ref, 'dependabot/') &&
        !startsWith(github.head_ref, 'dependabot-') &&
        (
          startsWith(github.head_ref, 'enhancement-') ||
          startsWith(github.head_ref, 'feature-') ||
          startsWith(github.head_ref, 'bugfix-') ||
          startsWith(github.head_ref, 'copilot/')
        )
      )

    steps:
    - uses: actions/checkout@v5

    - name: "Benchmark"
      uses: ./.github/actions/benchmark
      with:
        arch: '${{ matrix.arch }}'
        benchmark_list: |
          boot-time
          cold-start
          cold-start-l2
          warm-start
          warm-start-l2
          warm-start-vmm


    - name: "Upload logs in case of benchmark failures"
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: nanvix-benchmark-logs-${{ github.event.pull_request.number || github.run_number }}-${{ matrix.build-type }}-${{ matrix.arch }}
        # Overwrite to limit the amount of storage we use.
        overwrite: 'true'
        path: |
          logs/
          **/*.log
          **/*.out
          **/*.err
          bench_*.txt
