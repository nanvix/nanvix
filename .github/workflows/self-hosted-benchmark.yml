name: "Nanvix Benchmark (Self-Hosted)"

on:
  pull_request:
    types:
      - 'opened'
      - 'synchronize'
      - 'reopened'
      - 'ready_for_review'
    branches:
      - 'dev'

  push:
    branches:
      - 'dev'

# Cancel previous running actions for the same PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/dev' }}

env:
  TARGET_BRANCH: ${{ github.ref_name }}
  SCCACHE: "/usr/local/bin/sccache"

jobs:
  precheck:
    uses: nanvix/nanvix/.github/workflows/branch-up-to-date.yml@dev
    secrets: inherit

  benchmark:
    name: "Nanvix Benchmark (self-hosted)"
    needs: precheck
    timeout-minutes: 240
    strategy:
      matrix:
        build-type: [release]
        arch: [X64]
    runs-on: [self-hosted, Linux, X64, baremetal]
    permissions:
      contents: read
      pull-requests: write
      issues: write

    # Only run the benchmark for:
    # - Non-merge pushes to 'dev'.
    # - Non-draft PRs.
    if: |
      github.repository == 'nanvix/nanvix' && (
        (
          github.event_name != 'push' ||
          github.event.head_commit == null ||
          !startsWith(github.event.head_commit.message, 'Merge ')
        ) && (
          github.event_name != 'pull_request' ||
          !github.event.pull_request.draft
        ) && needs.precheck.outputs.up_to_date == 'true'
      )

    steps:
    - uses: actions/checkout@v6

    - name: "Cache Cargo Target"
      uses: actions/cache@v5
      with:
        path: target
        key: ${{ runner.os }}-benchmark-target-${{ matrix.arch }}-${{ matrix.build-type }}
        restore-keys: |
          ${{ runner.os }}-benchmark-target-${{ matrix.arch }}-${{ matrix.build-type }}
          ${{ runner.os }}-benchmark-target-${{ matrix.arch }}
          ${{ runner.os }}-benchmark-target

    - name: "Benchmark"
      uses: ./.github/actions/benchmark
      with:
        arch: '${{ matrix.arch }}'
        github-token: ${{ secrets.GITHUB_TOKEN }}
        benchmark_list: |
          boot-time
          cold-start
          cold-start-l2
          cold-start-uvm
          concurrent
          concurrent-l2
          echo-breakdown
          echo-breakdown-l2
          round-trip-latency
          warm-start
          warm-start-l2
          warm-start-vmm

    - name: "Dump SCCACHE Statistics"
      if: always()
      shell: bash
      run: |
        if [[ -n "${SCCACHE}" ]] && [[ -x "${SCCACHE}" ]]; then
          echo "SCCACHE Statistics:"
          "${SCCACHE}" --show-stats || echo "Failed to retrieve sccache statistics"
        else
          echo "SCCACHE not configured or not available"
        fi

    - name: "Collect L2 diagnostics"
      if: failure()
      shell: bash
      run: |
        set -Eeuo pipefail

        snapshot_path="${GITHUB_WORKSPACE}/images/l2-sysvm-snapshot"
        log_root="${GITHUB_WORKSPACE}/logs"

        echo '::group::L2 snapshot metadata'
        if [[ -e "${snapshot_path}" ]]; then
          ls -al "${snapshot_path}"
          sha256sum "${snapshot_path}" || true
          file "${snapshot_path}" || true
        else
          echo "Snapshot not found at ${snapshot_path}."
        fi
        echo '::endgroup::'

        echo '::group::Cloud Hypervisor stderr logs'
        shopt -s nullglob
        clh_logs=("${log_root}"/**/cloud-hypervisor-stderr.log)
        if [[ ${#clh_logs[@]} -eq 0 ]]; then
          echo "No cloud-hypervisor stderr logs found under ${log_root}."
        else
          for log_path in "${clh_logs[@]}"; do
            echo "--- ${log_path} ---"
            tail -n 400 "${log_path}" || true
          done
        fi
        echo '::endgroup::'

        echo '::group::Kernel console logs'
        console_logs=("${log_root}"/**/kernel_*.log)
        if [[ ${#console_logs[@]} -eq 0 ]]; then
          echo "No kernel console logs found under ${log_root}."
        else
          for log_path in "${console_logs[@]}"; do
            echo "--- ${log_path} ---"
            tail -n 200 "${log_path}" || true
          done
        fi
        echo '::endgroup::'

        echo '::group::/tmp namespace overview'
        sudo ls -al /tmp || true
        sudo find /tmp -maxdepth 1 -name 'nvx*' -print || true
        sudo find /tmp -maxdepth 2 -name 'nanvixd-clh.*' -print || true
        echo '::endgroup::'


    - name: "Cleanup Dangling Resources"
      if: always()
      run: |
        sudo rm -rf images
        sudo find /tmp -maxdepth 1 -name 'nvx:*' -exec rm -rf {} + 2>/dev/null || true
        sudo rm -rf /tmp/clh-console 2>/dev/null || true
      shell: bash

    - name: "Upload logs in case of benchmark failures"
      if: failure()
      uses: actions/upload-artifact@v6
      with:
        name: nanvix-benchmark-logs-${{ github.event.pull_request.number || github.run_number }}-${{ matrix.build-type }}-${{ matrix.arch }}
        # Overwrite to limit the amount of storage we use.
        overwrite: 'true'
        path: |
          logs/
          **/*.log
          **/*.out
          **/*.err
          bench_*.txt
