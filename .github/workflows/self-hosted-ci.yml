name: "Nanvix CI/CD (Self-Hosted)"

on:
  pull_request:
    types:
      - 'opened'
      - 'synchronize'
      - 'reopened'
      - 'ready_for_review'
    branches:
      - 'dev'

  push:
    branches:
      - 'dev'

# Cancel previous running actions for the same PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  TARGET_BRANCH: ${{ github.ref_name }}

jobs:
  ci:
    name: "Nanvix CI/CD (self-hosted)"
    runs-on: [self-hosted]
    timeout-minutes: 240

    # Only run the CI if it is a push to 'dev' (enforced above) or, if the
    # event trigger is a PR, we must make sure that: (i) it is not draft,
    # and (ii) the source branch matches one of the accepted source branches.
    if: |
      github.event_name != 'pull_request' ||
      (
        !github.event.pull_request.draft &&
        (
          startsWith(github.head_ref, 'enhancement-') ||
          startsWith(github.head_ref, 'feature-') ||
          startsWith(github.head_ref, 'bugfix-') ||
          startsWith(github.head_ref, 'dependabot-') ||
          startsWith(github.head_ref, 'dependabot/')
        )
      )

    steps:
    - uses: actions/checkout@v4

    # Debug
    - name: "Lint (debug)"
      uses: ./.github/actions/lint
      with:
        release: 'debug'
        log-level: 'trace'
    - name: "Build (debug)"
      uses: ./.github/actions/build
      with:
        release: 'debug'
        log-level: 'trace'
    - name: "Test (debug)"
      uses: ./.github/actions/test
      with:
        release: 'debug'
        log-level: 'trace'

    # Release
    - name: "Lint (release)"
      uses: ./.github/actions/lint
      with:
        release: 'release'
        log-level: 'trace'
    - name: "Build (release)"
      uses: ./.github/actions/build
      with:
        release: 'release'
        log-level: 'trace'
    - name: "Test (release)"
      uses: ./.github/actions/test
      with:
        release: 'release'
        log-level: 'trace'

    # Benchmark
    - name: "Benchmark (release)"
      uses: ./.github/actions/benchmark
