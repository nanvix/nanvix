name: "Nanvix CI/CD (Self-Hosted)"

on:
  pull_request:
    types:
      - 'opened'
      - 'synchronize'
      - 'reopened'
      - 'ready_for_review'
    branches:
      - 'dev'

  push:
    branches:
      - 'dev'

# Cancel previous running actions for the same PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/dev' }}

env:
  TARGET_BRANCH: ${{ github.ref_name }}
  SCCACHE: "/usr/local/bin/sccache"

jobs:
  precheck:
    uses: nanvix/nanvix/.github/workflows/branch-up-to-date.yml@dev
    secrets: inherit
    # No additional with: parameters needed.

  ci:
    name: "Nanvix CI/CD (self-hosted)"
    needs: precheck
    timeout-minutes: 60
    strategy:
      matrix:
        build-type: [debug, release]
        machine-type: [qemu-pc, microvm, hyperlight]
        deployment-type: [single-process, multi-process, l2]
        exclude:
          - machine-type: qemu-pc
            deployment-type: single-process
          - machine-type: qemu-pc
            deployment-type: l2
    runs-on: [self-hosted, Linux, X64]
    permissions:
      contents: read

    # Only run the CI for:
    # - Non-merge pushes to 'dev'.
    # - Non-draft PRs.
    if: |
      (
        github.event_name != 'push' ||
        github.event.head_commit == null ||
        !startsWith(github.event.head_commit.message, 'Merge ')
      ) && (
        github.event_name != 'pull_request' ||
        !github.event.pull_request.draft
      ) && needs.precheck.outputs.up_to_date == 'true'

    steps:
    - uses: actions/checkout@v6

    - name: "Check Code Format"
      uses: ./.github/actions/format
      with:
        release: '${{ matrix.build-type }}'
        log-level: 'trace'
        machine-type: '${{ matrix.machine-type }}'
        deployment-type: '${{ matrix.deployment-type }}'

    - name: "Lint"
      uses: ./.github/actions/lint
      with:
        release: '${{ matrix.build-type }}'
        log-level: 'trace'
        machine-type: '${{ matrix.machine-type }}'
        deployment-type: '${{ matrix.deployment-type }}'
    - name: "Spellcheck"
      uses: ./.github/actions/spellcheck
      with:
        release: '${{ matrix.build-type }}'
        log-level: 'trace'
        machine-type: '${{ matrix.machine-type }}'
        deployment-type: '${{ matrix.deployment-type }}'
    - name: "Build"
      uses: ./.github/actions/build
      with:
        release: '${{ matrix.build-type }}'
        log-level: 'trace'
        machine-type: '${{ matrix.machine-type }}'
        deployment-type: '${{ matrix.deployment-type }}'
    - name: "Test"
      uses: ./.github/actions/test
      with:
        release: '${{ matrix.build-type }}'
        log-level: 'trace'
        machine-type: '${{ matrix.machine-type }}'
        deployment-type: '${{ matrix.deployment-type }}'

    - name: "Collect L2 diagnostics"
      if: ${{ failure() && matrix.deployment-type == 'l2' }}
      shell: bash
      run: |
        set -Eeuo pipefail

        snapshot_path="${GITHUB_WORKSPACE}/images/l2-sysvm-snapshot"
        log_root="${GITHUB_WORKSPACE}/logs"

        echo '::group::L2 snapshot metadata'
        if [[ -e "${snapshot_path}" ]]; then
          ls -al "${snapshot_path}"
          sha256sum "${snapshot_path}" || true
          file "${snapshot_path}" || true
        else
          echo "Snapshot not found at ${snapshot_path}."
        fi
        echo '::endgroup::'

        echo '::group::Cloud Hypervisor stderr logs'
        shopt -s nullglob
        clh_logs=("${log_root}"/**/cloud-hypervisor-stderr.log)
        if [[ ${#clh_logs[@]} -eq 0 ]]; then
          echo "No cloud-hypervisor stderr logs found under ${log_root}."
        else
          for log_path in "${clh_logs[@]}"; do
            echo "--- ${log_path} ---"
            tail -n 400 "${log_path}" || true
          done
        fi
        echo '::endgroup::'

        echo '::group::Kernel console logs'
        console_logs=("${log_root}"/**/kernel_*.log)
        if [[ ${#console_logs[@]} -eq 0 ]]; then
          echo "No kernel console logs found under ${log_root}."
        else
          for log_path in "${console_logs[@]}"; do
            echo "--- ${log_path} ---"
            tail -n 200 "${log_path}" || true
          done
        fi
        echo '::endgroup::'

        echo '::group::/tmp namespace overview'
        sudo ls -al /tmp || true
        sudo find /tmp -maxdepth 1 -name 'nvx*' -print || true
        sudo find /tmp -maxdepth 2 -name 'nanvixd-clh.*' -print || true
        echo '::endgroup::'

    - id: release-archive
      name: "Create Release Archive"
      if: ${{ success() && github.ref == 'refs/heads/dev' && matrix.build-type == 'release' &&  matrix.deployment-type != 'l2' }}
      run: |
        single_process="no"
        if [[ "${{ matrix.deployment-type }}" == "single-process" ]]; then
          single_process="yes"
        fi

        # Ensure a clean build.
        git clean -fdx

        # Build the release archive.
        ./z build \
          --toolchain-dir $HOME/toolchain \
          -- \
          MACHINE="${{ matrix.machine-type }}" \
          SINGLE_PROCESS="${single_process}" \
          RELEASE="yes" \
          BUILD_OPT="yes" \
          LOG_LEVEL="error" \
          release

        archive_path=$(ls -1t nanvix-*.tar.bz2 2>/dev/null | head -n 1)
        if [[ -z "${archive_path}" ]]; then
          echo "No release archive found." >&2
          exit 1
        fi

        machine="${{ matrix.machine-type }}"
        deployment="${{ matrix.deployment-type }}"
        build_type="${{ matrix.build-type }}"
        commit_id="${GITHUB_SHA}"

        archive_name="nanvix-${machine}-${deployment}-${build_type}-${commit_id}.tar.bz2"
        mv "${archive_path}" "${archive_name}"

        echo "archive-path=${archive_name}" >> "${GITHUB_OUTPUT}"
      shell: bash

    - name: "Upload Release Artifact"
      if: ${{ success() && github.ref == 'refs/heads/dev' && matrix.build-type == 'release' && matrix.deployment-type != 'l2' }}
      uses: actions/upload-artifact@v6
      with:
        name: release-${{ matrix.machine-type }}-${{ matrix.deployment-type }}
        path: ${{ steps.release-archive.outputs.archive-path }}
        overwrite: true

    - name: "Cleanup Dangling Resources"
      if: always()
      run: |
        sudo rm -rf images
        sudo find /tmp -maxdepth 1 -name 'nvx:*' -exec rm -rf {} + 2>/dev/null || true
        sudo rm -rf /tmp/clh-console 2>/dev/null || true
      shell: bash

    - name: "Upload logs in case of failures"
      if: failure()
      uses: actions/upload-artifact@v6
      with:
        name: nanvix-ci-logs-${{ github.event.pull_request.number || github.run_number }}-${{ matrix.build-type }}-${{ matrix.machine-type }}
        # Overwrite to limit the amount of storage we use.
        overwrite: 'true'
        path: |
          logs/
          **/*.log
          **/*.out
          **/*.err

  publish-latest:
    name: "Publish Latest Release"
    needs: ci
    if: ${{ github.ref == 'refs/heads/dev' }}
    runs-on: [self-hosted, Linux, X64]
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v6

    - name: "Extract Version"
      id: version
      run: |
        version=$(grep -m 1 '^version = ' Cargo.toml | sed 's/version = "\(.*\)"/\1/')
        if [ -z "${version}" ]; then
          echo "Warning: Failed to extract version from Cargo.toml, using fallback"
          version="?.?.?"
        fi
        echo "version=${version}" >> "${GITHUB_OUTPUT}"
      shell: bash

    - name: "Download release artifacts"
      uses: actions/download-artifact@v7
      with:
        pattern: release-*
        path: release-artifacts

    - name: "Update Latest Release"
      uses: ncipollo/release-action@v1
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        tag: latest
        name: Nanvix ${{ steps.version.outputs.version }}
        draft: false
        prerelease: false
        allowUpdates: true
        makeLatest: true
        removeArtifacts: true
        artifacts: release-artifacts/**/*.tar.bz2
        artifactContentType: application/x-bzip2
        body: Automated release for Nanvix ${{ steps.version.outputs.version }}.

    - name: "Trigger Nanvix Release Dispatch"
      env:
        DISPATCH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
      run: |
        if [[ -z "${DISPATCH_TOKEN}" ]]; then
          echo "::warning::DISPATCH_TOKEN secret is not configured; skipping release dispatch."
          exit 0
        fi

        API_URL="https://api.github.com/repos/nanvix/rusty_v8/dispatches"
        PAYLOAD=$(cat <<JSON
        {
          "event_type": "nanvix-minor-release",
          "client_payload": {
            "source_repo": "nanvix/nanvix",
            "ref": "${GITHUB_REF}",
            "sha": "${GITHUB_SHA}",
            "component": "rusty_v8",
            "reason": "sync build from nanvix/nanvix"
          }
        }
        JSON
        )

        http_response=$(curl -sS -o /dev/null -w "%{http_code}" -X POST \
          -H "Accept: application/vnd.github+json" \
          -H "Authorization: Bearer ${DISPATCH_TOKEN}" \
          -H "X-GitHub-Api-Version: 2022-11-28" \
          "$API_URL" \
          -d "${PAYLOAD}")

        if [[ "${http_response}" -ge 200 && "${http_response}" -lt 300 ]]; then
          echo "Dispatched nanvix-release event to nanvix/rusty_v8 (HTTP ${http_response})."
        else
          echo "::error::Failed to dispatch nanvix-release event to nanvix/rusty_v8 (HTTP ${http_response})."
          exit 1
        fi
