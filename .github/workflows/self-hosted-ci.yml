name: "Nanvix CI/CD (Self-Hosted)"

on:
  pull_request:
    types:
      - 'opened'
      - 'synchronize'
      - 'reopened'
      - 'ready_for_review'
    branches:
      - 'dev'

  push:
    branches:
      - 'dev'

# Cancel previous running actions for the same PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/dev' }}

env:
  TARGET_BRANCH: ${{ github.ref_name }}
  SCCACHE: "/usr/local/bin/sccache"

jobs:
  ci:
    name: "Nanvix CI/CD (self-hosted)"
    timeout-minutes: 60
    strategy:
      matrix:
        build-type: [debug, release]
        arch: [X64]
    runs-on: [self-hosted, Linux, X64]

    # Only run the CI for:
    # - Pushes to 'dev' (handled by workflow triggers above)
    # - Non-draft PRs where the source branch starts with one of:
    #     'enhancement-', 'feature-', 'bugfix-', 'dependabot-', 'dependabot/', or 'copilot/'
    if: |
      github.event_name != 'pull_request' ||
      (
        !github.event.pull_request.draft &&
        (
          startsWith(github.head_ref, 'enhancement-') ||
          startsWith(github.head_ref, 'feature-') ||
          startsWith(github.head_ref, 'bugfix-') ||
          startsWith(github.head_ref, 'dependabot-') ||
          startsWith(github.head_ref, 'dependabot/') ||
          startsWith(github.head_ref, 'copilot/')
        )
      )

    steps:
    - uses: actions/checkout@v5

    - name: "Check Code Format"
      uses: ./.github/actions/format
      with:
        release: '${{ matrix.build-type }}'
        log-level: 'trace'

    - name: "Lint"
      uses: ./.github/actions/lint
      with:
        release: '${{ matrix.build-type }}'
        log-level: 'trace'
    - name: "Spellcheck"
      uses: ./.github/actions/spellcheck
      with:
        release: '${{ matrix.build-type }}'
        log-level: 'trace'
    - name: "Build"
      uses: ./.github/actions/build
      with:
        release: '${{ matrix.build-type }}'
        log-level: 'trace'
    - name: "Test"
      uses: ./.github/actions/test
      with:
        release: '${{ matrix.build-type }}'
        log-level: 'trace'

    - name: "Upload logs in case of failures"
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: nanvix-ci-logs-${{ github.event.pull_request.number || github.run_number }}-${{ matrix.build-type }}-${{ matrix.arch }}
        # Overwrite to limit the amount of storage we use.
        overwrite: 'true'
        path: |
          logs/
          **/*.log
          **/*.out
          **/*.err
