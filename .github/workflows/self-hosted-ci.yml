name: "Nanvix CI/CD (Self-Hosted)"

on:
  push:
    branches:
      - 'enhancement-*'
      - 'feature-*'
      - 'bugfix-*'
      - 'dev'
      - 'dependabot-*'

env:
  TARGET_BRANCH: ${{ github.ref_name }}

jobs:
  ci:
    name: "Nanvix CI/CD (self-hosted)"
    runs-on: [self-hosted]
    timeout-minutes: 240
    steps:
    - uses: actions/checkout@v4

    # Debug
    - name: "Lint (debug)"
      uses: ./.github/actions/lint
      with:
        release: 'debug'
        log-level: 'trace'
    - name: "Build (debug)"
      uses: ./.github/actions/build
      with:
        release: 'debug'
        log-level: 'trace'
    - name: "Test (debug)"
      uses: ./.github/actions/test
      with:
        release: 'debug'
        log-level: 'trace'

    # Release
    - name: "Lint (release)"
      uses: ./.github/actions/lint
      with:
        release: 'release'
        log-level: 'trace'
    - name: "Build (release)"
      uses: ./.github/actions/build
      with:
        release: 'release'
        log-level: 'trace'
    - name: "Test (release)"
      uses: ./.github/actions/test
      with:
        release: 'release'
        log-level: 'trace'

    # Benchmark
    - name: "Benchmark (release)"
      uses: ./.github/actions/benchmark
