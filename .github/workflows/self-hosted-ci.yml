name: "Nanvix CI/CD (Self-Hosted)"

on:
  pull_request:
    types:
      - 'opened'
      - 'synchronize'
      - 'reopened'
      - 'ready_for_review'
    branches:
      - 'dev'

  push:
    branches:
      - 'dev'

# Cancel previous running actions for the same PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/dev' }}

env:
  TARGET_BRANCH: ${{ github.ref_name }}
  SCCACHE: "/usr/local/bin/sccache"

jobs:
  precheck:
    uses: nanvix/nanvix/.github/workflows/branch-up-to-date.yml@dev
    secrets: inherit
    # No additional with: parameters needed.

  ci:
    name: "Nanvix CI/CD (self-hosted)"
    needs: precheck
    timeout-minutes: 60
    strategy:
      matrix:
        build-type: [debug, release]
        machine-type: [qemu-pc, microvm, hyperlight]
        deployment-type: [single-process, multi-process, l2]
        exclude:
          - machine-type: qemu-pc
            deployment-type: single-process
          - machine-type: qemu-pc
            deployment-type: l2
    runs-on: [self-hosted, Linux, X64]

    # Only run the CI for:
    # - Non-merge pushes to 'dev'.
    # - Non-draft PRs where the source branch starts with one of:
    #     'enhancement-', 'feature-', 'bugfix-', 'dependabot-', 'dependabot/', or 'copilot/'
    if: |
      (
        github.event_name != 'push' ||
        github.event.head_commit == null ||
        !startsWith(github.event.head_commit.message, 'Merge ')
      ) && (
        github.event_name != 'pull_request' || (
          !github.event.pull_request.draft && (
            startsWith(github.head_ref, 'enhancement-') ||
            startsWith(github.head_ref, 'feature-') ||
            startsWith(github.head_ref, 'bugfix-') ||
            startsWith(github.head_ref, 'dependabot-') ||
            startsWith(github.head_ref, 'dependabot/') ||
            startsWith(github.head_ref, 'copilot/')
          )
        )
      ) && needs.precheck.outputs.up_to_date == 'true'

    steps:
    - uses: actions/checkout@v5

    - name: "Check Code Format"
      uses: ./.github/actions/format
      with:
        release: '${{ matrix.build-type }}'
        log-level: 'trace'
        machine-type: '${{ matrix.machine-type }}'
        deployment-type: '${{ matrix.deployment-type }}'

    - name: "Lint"
      uses: ./.github/actions/lint
      with:
        release: '${{ matrix.build-type }}'
        log-level: 'trace'
        machine-type: '${{ matrix.machine-type }}'
        deployment-type: '${{ matrix.deployment-type }}'
    - name: "Spellcheck"
      uses: ./.github/actions/spellcheck
      with:
        release: '${{ matrix.build-type }}'
        log-level: 'trace'
        machine-type: '${{ matrix.machine-type }}'
        deployment-type: '${{ matrix.deployment-type }}'
    - name: "Build"
      uses: ./.github/actions/build
      with:
        release: '${{ matrix.build-type }}'
        log-level: 'trace'
        machine-type: '${{ matrix.machine-type }}'
        deployment-type: '${{ matrix.deployment-type }}'
    - name: "Test"
      uses: ./.github/actions/test
      with:
        release: '${{ matrix.build-type }}'
        log-level: 'trace'
        machine-type: '${{ matrix.machine-type }}'
        deployment-type: '${{ matrix.deployment-type }}'

    - id: release-archive
      name: "Create Release Archive"
      if: ${{ success() && github.ref == 'refs/heads/dev' && matrix.build-type == 'release' &&  matrix.deployment-type != 'l2' }}
      run: |
        single_process="no"
        if [[ "${{ matrix.deployment-type }}" == "single-process" ]]; then
          single_process="yes"
        fi

        # Ensure a clean build.
        git clean -fdx

        # Build the release archive.
        ./z build \
          --toolchain-dir $HOME/toolchain \
          -- \
          MACHINE="${{ matrix.machine-type }}" \
          SINGLE_PROCESS="${single_process}" \
          RELEASE="yes" \
          BUILD_OPT="yes" \
          LOG_LEVEL="error" \
          release

        archive_path=$(ls -1t nanvix-*.tar.bz2 2>/dev/null | head -n 1)
        if [[ -z "${archive_path}" ]]; then
          echo "No release archive found." >&2
          exit 1
        fi

        machine="${{ matrix.machine-type }}"
        deployment="${{ matrix.deployment-type }}"
        build_type="${{ matrix.build-type }}"
        run_id="${GITHUB_RUN_ID}"

        archive_name="nanvix-${machine}-${deployment}-${build_type}-${run_id}.tar.bz2"
        mv "${archive_path}" "${archive_name}"

        echo "archive-path=${archive_name}" >> "${GITHUB_OUTPUT}"
      shell: bash

    - name: "Upload Release Artifact"
      if: ${{ success() && github.ref == 'refs/heads/dev' && matrix.build-type == 'release' && matrix.deployment-type != 'l2' }}
      uses: actions/upload-artifact@v5
      with:
        name: release-${{ matrix.machine-type }}-${{ matrix.deployment-type }}
        path: ${{ steps.release-archive.outputs.archive-path }}
        overwrite: true

    - name: "Upload logs in case of failures"
      if: failure()
      uses: actions/upload-artifact@v5
      with:
        name: nanvix-ci-logs-${{ github.event.pull_request.number || github.run_number }}-${{ matrix.build-type }}-${{ matrix.machine-type }}
        # Overwrite to limit the amount of storage we use.
        overwrite: 'true'
        path: |
          logs/
          **/*.log
          **/*.out
          **/*.err

    - name: "Cleanup images directory"
      if: always()
      run: sudo rm -rf images
      shell: bash

  publish-latest:
    name: "Publish Latest Release"
    needs: ci
    if: ${{ github.ref == 'refs/heads/dev' }}
    runs-on: [self-hosted, Linux, X64]

    steps:
    - name: "Download release artifacts"
      uses: actions/download-artifact@v6
      with:
        pattern: release-*
        path: release-artifacts

    - name: "Update Latest Release"
      uses: ncipollo/release-action@v1
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        tag: latest
        name: Latest
        draft: false
        prerelease: false
        allowUpdates: true
        makeLatest: true
        removeArtifacts: true
        artifacts: release-artifacts/**/*.tar.bz2
        artifactContentType: application/x-bzip2
        body: Automated release update for ${{ github.run_id }}.
