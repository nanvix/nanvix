name: "Nanvix CI/CD (Self-Hosted)"

on:
  pull_request:
    types:
      - 'opened'
      - 'synchronize'
      - 'reopened'
      - 'ready_for_review'
    branches:
      - 'dev'

  push:
    branches:
      - 'dev'

# Cancel previous running actions for the same PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  TARGET_BRANCH: ${{ github.ref_name }}

jobs:
  ci:
    name: "Nanvix CI/CD (self-hosted)"
    timeout-minutes: 240
    strategy:
      matrix:
        build-type: [debug, release]
        arch: [X64]
    runs-on: [self-hosted, Linux, X64, baremetal]

    # Only run the CI for:
    # - Pushes to 'dev' (handled by workflow triggers above)
    # - Non-draft PRs where the source branch starts with one of:
    #     'enhancement-', 'feature-', 'bugfix-', 'dependabot-', 'dependabot/', or 'copilot/'
    if: |
      github.event_name != 'pull_request' ||
      (
        !github.event.pull_request.draft &&
        (
          startsWith(github.head_ref, 'enhancement-') ||
          startsWith(github.head_ref, 'feature-') ||
          startsWith(github.head_ref, 'bugfix-') ||
          startsWith(github.head_ref, 'dependabot-') ||
          startsWith(github.head_ref, 'dependabot/') ||
          startsWith(github.head_ref, 'copilot/')
        )
      )

    steps:
    - uses: actions/checkout@v4

    - name: "Lint"
      uses: ./.github/actions/lint
      with:
        release: '${{ matrix.build-type }}'
        log-level: 'trace'
    - name: "Build"
      uses: ./.github/actions/build
      with:
        release: '${{ matrix.build-type }}'
        log-level: 'trace'
    - name: "Test"
      uses: ./.github/actions/test
      with:
        release: '${{ matrix.build-type }}'
        log-level: 'trace'

    # Benchmark (only for release builds, skip for Dependabot PRs)
    - name: "Benchmark"
      if: |
        matrix.build-type == 'release' &&
        !startsWith(github.head_ref, 'dependabot/') &&
        !startsWith(github.head_ref, 'dependabot-')
      uses: ./.github/actions/benchmark
      with:
        arch: '${{ matrix.arch }}'
