name: "Hyperlight Update"

on:
  # schedule:
  #   # Run daily at 05:00 UTC.
  #   - cron: "0 5 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-hyperlight-update
  cancel-in-progress: true

jobs:
  hyperlight-update:
    name: "Update Hyperlight Crates"
    runs-on: ubuntu-24.04
    if: github.repository == 'nanvix/nanvix'
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v6
        with:
          ref: dev

      - name: "Set Up Rust Toolchain"
        run: rustup show

      - name: "Update Hyperlight Crates"
        id: update
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash scripts/update-hyperlight.sh > /tmp/hl-output.txt
          cat /tmp/hl-output.txt
          cat /tmp/hl-output.txt >> "$GITHUB_OUTPUT"

      - name: "Create Pull Request"
        if: steps.update.outputs.UPDATED == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.DISPATCH_TOKEN }}
          base: dev
          branch: auto/hyperlight-update
          commit-message: "[build] Update hyperlight to ${{ steps.update.outputs.VERSION }} (${{ steps.update.outputs.NEW_REV }})"
          title: "[build] Update hyperlight to ${{ steps.update.outputs.VERSION }}"
          body: |
            Automated hyperlight version bump.

            | Field | Value |
            |-------|-------|
            | Repository | [`hyperlight-dev/hyperlight`](https://github.com/hyperlight-dev/hyperlight) |
            | Version | `${{ steps.update.outputs.VERSION }}` |
            | Old ref | `${{ steps.update.outputs.OLD_REF }}` |
            | New rev | `${{ steps.update.outputs.NEW_REV }}` |

            **Files changed:**
            - `Cargo.toml` — updated hyperlight crate references
            - `Cargo.lock` — regenerated

            > Generated by the **Hyperlight Update** workflow.
          assignees: ppenna,danbugs
          delete-branch: true
