name: build

on:
  workflow_call:
    inputs:
      release:
        description: 'Release type'
        required: true
        default: 'release'
        type: string
      log-level:
        description: 'Log level'
        required: true
        default: 'trace'
        type: string
    secrets:
      hostname:
        description: 'Hostname'
        required: true
      username:
        description: 'Username'
        required: true
      sshkey:
        description: 'SSH key'
        required: true
      portnum:
        description: 'Port number'
        required: true

env:
  TARGET_BRANCH: ${{ github.ref_name }}
  RELEASE_TYPE: ${{ inputs.release }}
  LOG_LEVEL: ${{ inputs.log-level }}

jobs:
  build-qemu-isapc:
    name: Build (qemu-isapc)
    runs-on: ubuntu-latest
    steps:
    - name: Build
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.hostname }}
        username: ${{ secrets.username }}
        key: ${{ secrets.sshkey }}
        port: ${{ secrets.portnum }}
        envs: TARGET_BRANCH, RELEASE_TYPE, LOG_LEVEL
        script: |
          cd github/nanvix-${TARGET_BRANCH}-${RELEASE_TYPE}
          python3 scripts/ci.py --toolchain-dir=$HOME/toolchain --target-arch=x86 --log-level=${LOG_LEVEL} --target-machine=qemu-isapc --${RELEASE_TYPE} --build

  build-qemu-pc:
    name: Build (qemu-pc)
    runs-on: ubuntu-latest
    needs: build-qemu-isapc
    steps:
    - name: Build
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.hostname }}
        username: ${{ secrets.username }}
        key: ${{ secrets.sshkey }}
        port: ${{ secrets.portnum }}
        envs: TARGET_BRANCH, RELEASE_TYPE, LOG_LEVEL
        script: |
          cd github/nanvix-${TARGET_BRANCH}-${RELEASE_TYPE}
          python3 scripts/ci.py --toolchain-dir=$HOME/toolchain --target-arch=x86 --log-level=${LOG_LEVEL} --target-machine=qemu-pc --${RELEASE_TYPE} --build

  build-qemu-baremetal:
    name: Build (qemu-baremetal)
    runs-on: ubuntu-latest
    needs: build-qemu-pc
    steps:
    - name: Build
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.hostname }}
        username: ${{ secrets.username }}
        key: ${{ secrets.sshkey }}
        port: ${{ secrets.portnum }}
        envs: TARGET_BRANCH, RELEASE_TYPE, LOG_LEVEL
        script: |
          cd github/nanvix-${TARGET_BRANCH}-${RELEASE_TYPE}
          python3 scripts/ci.py --toolchain-dir=$HOME/toolchain --target-arch=x86 --log-level=${LOG_LEVEL} --target-machine=qemu-baremetal --${RELEASE_TYPE} --build

  build-microvm:
    name: Build (microvm)
    runs-on: ubuntu-latest
    needs: build-qemu-baremetal
    steps:
    - name: Build
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.hostname }}
        username: ${{ secrets.username }}
        key: ${{ secrets.sshkey }}
        port: ${{ secrets.portnum }}
        envs: TARGET_BRANCH, RELEASE_TYPE, LOG_LEVEL
        command_timeout: 30m
        script: |
          cd github/nanvix-${TARGET_BRANCH}-${RELEASE_TYPE}
          python3 scripts/ci.py --toolchain-dir=$HOME/toolchain --target-arch=x86 --log-level=${LOG_LEVEL} --target-machine=microvm --${RELEASE_TYPE} --build

  build-hyperlight:
    name: Build (hyperlight)
    runs-on: ubuntu-latest
    needs: build-microvm
    steps:
    - name: Build
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.hostname }}
        username: ${{ secrets.username }}
        key: ${{ secrets.sshkey }}
        port: ${{ secrets.portnum }}
        envs: TARGET_BRANCH, RELEASE_TYPE, LOG_LEVEL
        script: |
          cd github/nanvix-${TARGET_BRANCH}-${RELEASE_TYPE}
          python3 scripts/ci.py --toolchain-dir=$HOME/toolchain --target-arch=x86 --log-level=${LOG_LEVEL} --target-machine=hyperlight --${RELEASE_TYPE} --build
