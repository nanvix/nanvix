name: "Cargo Upgrade"

on:
  schedule:
    # Run daily at 04:00 UTC (one hour after Dependabot).
    - cron: "0 4 * * *"
  workflow_dispatch:

jobs:
  cargo-upgrade:
    name: "Upgrade Crate Versions"
    runs-on: ubuntu-24.04
    if: github.repository == 'nanvix/nanvix'
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v6
        with:
          ref: dev

      - name: "Install Rust Toolchain"
        run: rustup show

      - name: "Install cargo-edit"
        run: cargo install cargo-edit --locked

      - name: "Run cargo upgrade"
        run: |
          cargo upgrade --workspace --incompatible allow \
            --exclude fatfs \
            --exclude hyperlight-common \
            --exclude hyperlight-host \
            --exclude hyperlight-guest \
            --exclude spin \
            --exclude talc \
            --exclude vstd

      - name: "Check for changes"
        id: diff
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: "Create Pull Request"
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: dependabot-cargo-upgrade
          commit-message: "[build] Upgrade crate versions"
          title: "[build] Upgrade crate versions"
          body: |
            Automated `cargo upgrade` run.

            This PR updates version requirements in `Cargo.toml` to the
            latest available versions for all crates.io-indexed dependencies.

            > Generated by the **Cargo Upgrade** workflow.
          labels: enhancement
          delete-branch: true
