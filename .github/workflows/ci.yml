name: "Nanvix CI/CD"

on:
  schedule:
    # Publish release artifacts for the latest version nightly at midnight UTC.
    - cron: "0 0 * * *"

  workflow_dispatch:

  pull_request:
    types:
      - "opened"
      - "synchronize"
      - "reopened"
      - "ready_for_review"
    branches:
      - "dev"

  merge_group:
    types:
      - "checks_requested"

  push:
    branches:
      - "dev"

# Cancel previous running actions for the same PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/dev' }}

# Build-type strategy:
#   pull_request      → debug only   (fast feedback during development)
#   merge_group       → release only (final validation before landing on dev)
#   push (dev)        → release only (CI pipeline only, no release publish)
#   schedule          → release only (nightly release archives & publish pipeline)
#   workflow_dispatch → both          (full coverage for manual runs)

jobs:
  # ==========================================================================================
  # Pre-check
  # ==========================================================================================

  precheck:
    # The merge queue already ensures the branch is up-to-date, so skip this
    # check for merge_group events to avoid false negatives from the merge
    # commit detection in the reusable workflow. Scheduled runs have no PR
    # context, so skip them as well.
    if: github.event_name != 'merge_group' && github.event_name != 'schedule'
    uses: nanvix/nanvix/.github/workflows/branch-up-to-date.yml@dev
    secrets: inherit

  # ==========================================================================================
  # Stage 1: Source Checks (GitHub-Hosted Runners)
  # ==========================================================================================

  # Run config-independent source checks once (format, spellcheck) instead of
  # repeating them in every matrix entry. Downstream jobs (ci-build, ci-l2)
  # wait for these to pass.
  checks:
    name: "Source Checks"
    needs: precheck
    timeout-minutes: 60
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/nanvix/ci:ubuntu-24.04
    permissions:
      contents: read
      packages: read

    # Only run the CI for:
    # - Merge queue validation runs.
    # - Nightly scheduled runs.
    # - Non-merge pushes to 'dev'.
    # - Non-draft PRs.
    # NOTE: !cancelled() overrides the implicit success() status check so that
    # the job is not transitively skipped when precheck is skipped
    # (schedule / merge_group events). See actions/runner#2205.
    if: |
      !cancelled() &&
      github.repository == 'nanvix/nanvix' && (
        github.event_name == 'merge_group' || github.event_name == 'schedule' || (
          needs.precheck.outputs.up_to_date == 'true' && (
            github.event_name != 'push' ||
            github.event.head_commit == null ||
            !startsWith(github.event.head_commit.message, 'Merge ')
          ) && (
            github.event_name != 'pull_request' ||
            !github.event.pull_request.draft
          )
        )
      )

    steps:
      - uses: actions/checkout@v6

      - name: "Setup"
        uses: ./.github/actions/native-setup
        with:
          components: "rustfmt"

      - name: "Check Code Format"
        shell: bash
        run: |
          ./z build -- format-check

      - name: "Spellcheck"
        shell: bash
        run: |
          ./z build -- spellcheck

  # ==========================================================================================
  # Stage 1 (parallel): Config-Dependent Source Checks (GitHub-Hosted Runners)
  # ==========================================================================================

  # Lint and verify run in parallel with config-independent checks (format,
  # spellcheck) since they are independent source checks that only need
  # precheck. ci-build waits for all of them (checks + lint + verify) to pass.
  #
  # Lint is config-dependent (features differ per machine-type + deployment-type)
  # but does NOT depend on build-type (debug vs release). Run lint once per
  # unique (machine-type, deployment-type) pair (6 jobs) instead of once per
  # build matrix entry (12 jobs).
  lint:
    name: "Lint (${{ matrix.machine-type }}, ${{ matrix.deployment-type }})"
    needs: [precheck]
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        machine-type: [microvm, hyperlight]
        deployment-type: [standalone, single-process, multi-process]
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/nanvix/ci:ubuntu-24.04
    permissions:
      contents: read
      packages: read

    # NOTE: !cancelled() — see comment on 'checks' job (actions/runner#2205).
    if: |
      !cancelled() &&
      github.repository == 'nanvix/nanvix' && (
        github.event_name == 'merge_group' || github.event_name == 'schedule' || (
          needs.precheck.outputs.up_to_date == 'true' && (
            github.event_name != 'push' ||
            github.event.head_commit == null ||
            !startsWith(github.event.head_commit.message, 'Merge ')
          ) && (
            github.event_name != 'pull_request' ||
            !github.event.pull_request.draft
          )
        )
      )

    steps:
      - uses: actions/checkout@v6

      - name: "Setup"
        uses: ./.github/actions/native-setup
        with:
          components: "clippy"

      - name: "Lint"
        shell: bash
        run: |
          ./z build -- lint-check \
            "MACHINE=${{ matrix.machine-type }}" \
            TARGET=x86 \
            LOG_LEVEL=trace \
            VERBOSE=yes \
            BUILD_OPT=no \
            "DEPLOYMENT_MODE=${{ matrix.deployment-type }}"

  # Verus formal verification is config-dependent (kernel cargo flags vary per
  # machine-type + deployment-type) and runs once per unique pair, like lint.
  verify:
    name: "Verify (${{ matrix.machine-type }}, ${{ matrix.deployment-type }})"
    needs: [precheck]
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        machine-type: [microvm, hyperlight]
        deployment-type: [standalone, single-process, multi-process]
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/nanvix/ci:ubuntu-24.04
    permissions:
      contents: read
      packages: read

    # NOTE: !cancelled() — see comment on 'checks' job (actions/runner#2205).
    if: |
      !cancelled() &&
      github.repository == 'nanvix/nanvix' && (
        github.event_name == 'merge_group' || github.event_name == 'schedule' || (
          needs.precheck.outputs.up_to_date == 'true' && (
            github.event_name != 'push' ||
            github.event.head_commit == null ||
            !startsWith(github.event.head_commit.message, 'Merge ')
          ) && (
            github.event_name != 'pull_request' ||
            !github.event.pull_request.draft
          )
        )
      )

    steps:
      - uses: actions/checkout@v6

      - name: "Setup"
        uses: ./.github/actions/native-setup

      - name: "Verify"
        uses: ./.github/actions/verify
        with:
          machine-type: ${{ matrix.machine-type }}
          deployment-type: ${{ matrix.deployment-type }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

  # Each matrix entry builds on a GitHub-hosted runner. Integration tests run
  # in a separate ci-test job (typically on self-hosted runners) that depends
  # on the completion of the entire ci-build matrix, so tests start only after
  # all builds have finished rather than as soon as an individual build
  # completes.
  ci-build:
    name: "Build (${{ matrix.build-type }}, ${{ matrix.machine-type }}, ${{ matrix.deployment-type }}, ${{ matrix.memory-size }}mb)"
    needs: [precheck, checks, lint, verify]
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        # PRs run debug only (fast feedback); merge queue and dev pushes run
        # release only (final validation + release archives); manual dispatch
        # runs both.
        build-type: ${{ fromJSON(github.event_name == 'pull_request' && '["debug"]' || github.event_name == 'workflow_dispatch' && '["debug","release"]' || '["release"]') }}
        machine-type: [microvm, hyperlight]
        deployment-type: [standalone, single-process, multi-process]
        memory-size: [128, 256]
        # 256MB images are release-only; exclude them from debug builds.
        exclude:
          - build-type: debug
            memory-size: 256
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/nanvix/ci:ubuntu-24.04
    permissions:
      contents: read
      packages: read

    # NOTE: !cancelled() — see comment on 'checks' job (actions/runner#2205).
    # !failure() ensures the build does not start when checks/lint/verify fail.
    if: |
      !cancelled() && !failure() &&
      github.repository == 'nanvix/nanvix' && (
        github.event_name == 'merge_group' || github.event_name == 'schedule' || (
          needs.precheck.outputs.up_to_date == 'true' && (
            github.event_name != 'push' ||
            github.event.head_commit == null ||
            !startsWith(github.event.head_commit.message, 'Merge ')
          ) && (
            github.event_name != 'pull_request' ||
            !github.event.pull_request.draft
          )
        )
      )

    steps:
      - uses: actions/checkout@v6

      - name: "Setup"
        uses: ./.github/actions/native-setup

      - name: "Setup sccache"
        uses: Mozilla-Actions/sccache-action@v0.0.9
        with:
          version: "v0.10.0"

      - name: "Build & Unit Test"
        shell: bash
        env:
          MACHINE_TYPE: ${{ matrix.machine-type }}
          LOG_LEVEL: ${{ matrix.build-type == 'release' && 'error' || 'trace' }}
          RELEASE_FLAG: ${{ matrix.build-type == 'release' && 'RELEASE=yes' || '' }}
          BUILD_TARGETS: ${{ matrix.build-type == 'release' && 'all run-unit-tests release' || 'all run-unit-tests' }}
        run: |
          ./z build -- ${BUILD_TARGETS} \
            "MACHINE=${MACHINE_TYPE}" \
            TARGET=x86 \
            "LOG_LEVEL=${LOG_LEVEL}" \
            VERBOSE=yes \
            BUILD_OPT=yes \
            ${RELEASE_FLAG} \
            "DEPLOYMENT_MODE=${{ matrix.deployment-type }}" \
            "MEMORY_SIZE=${{ matrix.memory-size }}"

      - name: "Upload Build Artifacts"
        uses: actions/upload-artifact@v7
        with:
          name: ci-build-${{ matrix.build-type }}-${{ matrix.machine-type }}-${{ matrix.deployment-type }}-${{ matrix.memory-size }}mb
          overwrite: true
          retention-days: 1
          path: |
            bin/
            images/
            lib/
            sysroot-${{ matrix.build-type }}/
            nanvix-*.tar.bz2

      - name: "Upload logs in case of failures"
        if: failure() || cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: nanvix-ci-logs-${{ github.event.pull_request.number || github.run_number }}-${{ matrix.build-type }}-${{ matrix.machine-type }}-${{ matrix.deployment-type }}-${{ matrix.memory-size }}mb
          overwrite: "true"
          path: |
            logs/
            **/*.log
            **/*.out
            **/*.err

  ci-test:
    name: "Test (${{ matrix.build-type }}, ${{ matrix.machine-type }}, ${{ matrix.deployment-type }})"
    needs: [ci-build]
    # NOTE: !cancelled() — see comment on 'checks' job (actions/runner#2205).
    if: ${{ !cancelled() && needs.ci-build.result == 'success' }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        build-type: ${{ fromJSON(github.event_name == 'pull_request' && '["debug"]' || github.event_name == 'workflow_dispatch' && '["debug","release"]' || '["release"]') }}
        machine-type: [microvm, hyperlight]
        deployment-type: [standalone, single-process, multi-process]
    runs-on:
      group: Test
      labels: [self-hosted, Linux]
    permissions:
      contents: read

    steps:
      - name: "Pre-Checkout Cleanup"
        shell: bash
        run: |
          # Previous runs may leave root-owned files (e.g., images/l2-sysvm-rootfs/dev)
          # that prevent actions/checkout from resetting the workspace. The cleanup
          # composite action cannot run before checkout, so perform a direct cleanup
          # of the images directory without executing any workspace scripts.
          if [[ -d "${GITHUB_WORKSPACE}/images" ]]; then
            echo "Removing images directory before checkout..."
            sudo rm -rf "${GITHUB_WORKSPACE}/images"
          fi

      - uses: actions/checkout@v6

      - name: "Isolate Cargo Home"
        shell: bash
        run: |
          # Isolate Cargo home per job to prevent concurrent git-cache races on
          # self-hosted runners that share the same filesystem.  Symlink the
          # toolchain bin/ directory so that the Makefile can still resolve
          # $CARGO_HOME/bin/cargo.
          mkdir -p "$RUNNER_TEMP/.cargo"
          ln -sfn "$HOME/.cargo/bin" "$RUNNER_TEMP/.cargo/bin"
          echo "CARGO_HOME=$RUNNER_TEMP/.cargo" >> "$GITHUB_ENV"

      - name: "Pre-Cleanup Dangling Resources"
        uses: ./.github/actions/cleanup
        with:
          phase: pre

      - name: "Prepare Test Artifacts"
        uses: ./.github/actions/prepare-test-artifacts
        with:
          build-type: "${{ matrix.build-type }}"
          machine-type: "${{ matrix.machine-type }}"
          deployment-type: "${{ matrix.deployment-type }}"

      - name: "Integration Test"
        uses: ./.github/actions/integration-test
        with:
          build-type: "${{ matrix.build-type }}"
          machine-type: "${{ matrix.machine-type }}"
          deployment-type: "${{ matrix.deployment-type }}"

      - name: "Link Toolchain"
        if: matrix.machine-type == 'microvm' || matrix.machine-type == 'hyperlight'
        uses: ./.github/actions/link-toolchain

      - name: "Shim Integration Test"
        if: matrix.machine-type == 'microvm' || matrix.machine-type == 'hyperlight'
        shell: bash
        env:
          NANVIX_DIR: ${{ github.workspace }}
        run: |
          set -Eeuo pipefail
          echo "Running shim integration tests with NANVIX_DIR=${NANVIX_DIR}"
          cargo test --no-default-features \
            -p containerd-shim-nanvix-v1 --test integration -- --nocapture --test-threads=1

      - name: "Post-Cleanup Dangling Resources"
        if: always()
        uses: ./.github/actions/cleanup
        with:
          phase: post

      - name: "Upload logs in case of failures"
        if: failure() || cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: nanvix-integration-logs-${{ github.event.pull_request.number || github.run_number }}-${{ matrix.build-type }}-${{ matrix.machine-type }}-${{ matrix.deployment-type }}
          overwrite: "true"
          path: |
            logs/
            **/*.log
            **/*.out
            **/*.err

  # ==========================================================================================
  # Windows CI (GitHub-Hosted Runners)
  # ==========================================================================================

  # Format check is machine-type independent, so it runs once.
  windows-format-check:
    name: "Windows Format Check"
    needs: [precheck]
    timeout-minutes: 30
    runs-on: windows-latest
    permissions:
      contents: read

    # NOTE: !cancelled() — see comment on 'checks' job (actions/runner#2205).
    if: |
      !cancelled() &&
      github.repository == 'nanvix/nanvix' && (
        github.event_name == 'merge_group' || github.event_name == 'schedule' || (
          needs.precheck.outputs.up_to_date == 'true' && (
            github.event_name != 'push' ||
            github.event.head_commit == null ||
            !startsWith(github.event.head_commit.message, 'Merge ')
          ) && (
            github.event_name != 'pull_request' ||
            !github.event.pull_request.draft
          )
        )
      )

    steps:
      - uses: actions/checkout@v6

      - name: "Install Rust Toolchain"
        shell: pwsh
        run: |
          $toolchain = (Get-Content rust-toolchain | Select-String '^channel\s*=').ToString() -replace '.*=\s*"([^"]+)".*','$1'
          rustup toolchain install $toolchain
          rustup show
          rustup component add --toolchain $toolchain rustfmt

      - name: "Check Code Format"
        shell: pwsh
        run: |
          .\z.ps1 build -- format-check

  # Lint check varies by machine-type (different Cargo features), so it runs per backend.
  windows-lint-check:
    name: "Windows Lint Check (${{ matrix.machine-type }})"
    needs: [precheck]
    timeout-minutes: 30
    runs-on: windows-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        machine-type: [microvm, hyperlight]

    # NOTE: !cancelled() — see comment on 'checks' job (actions/runner#2205).
    if: |
      !cancelled() &&
      github.repository == 'nanvix/nanvix' && (
        github.event_name == 'merge_group' || github.event_name == 'schedule' || (
          needs.precheck.outputs.up_to_date == 'true' && (
            github.event_name != 'push' ||
            github.event.head_commit == null ||
            !startsWith(github.event.head_commit.message, 'Merge ')
          ) && (
            github.event_name != 'pull_request' ||
            !github.event.pull_request.draft
          )
        )
      )

    steps:
      - uses: actions/checkout@v6

      - name: "Install Rust Toolchain"
        shell: pwsh
        run: |
          $toolchain = (Get-Content rust-toolchain | Select-String '^channel\s*=').ToString() -replace '.*=\s*"([^"]+)".*','$1'
          rustup toolchain install $toolchain
          rustup show
          rustup component add --toolchain $toolchain clippy

      - name: "Lint"
        shell: pwsh
        run: |
          .\z.ps1 build -- lint-check MACHINE=${{ matrix.machine-type }}

  # Verus formal verification on Windows. Only standalone deployment is supported
  # on Windows, so the matrix covers machine-type only.
  windows-verify:
    name: "Windows Verify (${{ matrix.machine-type }})"
    needs: [precheck]
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        machine-type: [microvm, hyperlight]
    runs-on: windows-latest
    permissions:
      contents: read

    # NOTE: !cancelled() — see comment on 'checks' job (actions/runner#2205).
    if: |
      !cancelled() &&
      github.repository == 'nanvix/nanvix' && (
        github.event_name == 'merge_group' || github.event_name == 'schedule' || (
          needs.precheck.outputs.up_to_date == 'true' && (
            github.event_name != 'push' ||
            github.event.head_commit == null ||
            !startsWith(github.event.head_commit.message, 'Merge ')
          ) && (
            github.event_name != 'pull_request' ||
            !github.event.pull_request.draft
          )
        )
      )

    steps:
      - uses: actions/checkout@v6

      - name: "Install Rust Toolchain"
        shell: pwsh
        run: |
          $toolchain = (Get-Content rust-toolchain | Select-String '^channel\s*=').ToString() -replace '.*=\s*"([^"]+)".*','$1'
          rustup toolchain install $toolchain
          rustup show

      - name: "Verify"
        uses: ./.github/actions/verify
        with:
          machine-type: ${{ matrix.machine-type }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

  # Build all components (guest + host) natively on Windows using the local
  # cross-compilation toolchain (GNU Make + rust-lld) and run unit tests.
  windows-ci-build:
    name: "Windows Build (${{ matrix.machine-type }}, ${{ matrix.build-type }}, ${{ matrix.memory-size }}mb)"
    needs: [windows-format-check, windows-lint-check, windows-verify]
    # NOTE: !cancelled() — see comment on 'checks' job (actions/runner#2205).
    # !failure() ensures the build does not start when checks/lint/verify fail.
    if: |
      !cancelled() && !failure() &&
      needs.windows-format-check.result == 'success' &&
      needs.windows-lint-check.result == 'success' &&
      needs.windows-verify.result == 'success'
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        build-type: ${{ fromJSON(github.event_name == 'pull_request' && '["debug"]' || github.event_name == 'workflow_dispatch' && '["debug","release"]' || '["release"]') }}
        machine-type: [microvm, hyperlight]
        memory-size: [128, 256]
        # 256MB images are release-only; exclude them from debug builds.
        exclude:
          - build-type: debug
            memory-size: 256
    runs-on: windows-latest
    permissions:
      contents: read
    env:
      MACHINE_TYPE: ${{ matrix.machine-type }}

    steps:
      - uses: actions/checkout@v6

      - name: "Install Rust Toolchain"
        shell: pwsh
        run: |
          $toolchain = (Get-Content rust-toolchain | Select-String '^channel\s*=').ToString() -replace '.*=\s*"([^"]+)".*','$1'
          rustup toolchain install $toolchain
          rustup show
          rustup component add --toolchain $toolchain clippy rustfmt

      - name: "Setup Prerequisites"
        shell: pwsh
        run: |
          $osVersion = [System.Environment]::OSVersion.Version
          if ($osVersion.Build -ge 22000) {
            Write-Host "Detected Windows build $($osVersion.Build) (Windows 11 or later). Running z.ps1 setup..."
            .\z.ps1 setup
          }
          else {
            Write-Host "Detected Windows build $($osVersion.Build) (< 22000). Skipping z.ps1 setup on CI runner."
          }

      - name: "Isolate Cargo Home"
        shell: pwsh
        run: |
          # Isolate Cargo home per job to prevent git-cache corruption on
          # Windows runners that may share the same filesystem across runs.
          # Symlink the toolchain bin/ directory so that the Makefile can
          # still resolve $env:CARGO_HOME/bin/cargo.
          $isolatedCargo = Join-Path $env:RUNNER_TEMP ".cargo"
          New-Item -ItemType Directory -Force -Path $isolatedCargo | Out-Null
          $cargoBin = Join-Path $isolatedCargo "bin"
          if (Test-Path $cargoBin) { Remove-Item $cargoBin -Force -Recurse }
          New-Item -ItemType SymbolicLink -Path $cargoBin -Target (Join-Path $env:USERPROFILE ".cargo\bin") | Out-Null
          echo "CARGO_HOME=$isolatedCargo" >> $env:GITHUB_ENV
          Write-Host "Isolated CARGO_HOME to $isolatedCargo"

      - name: "Build & Unit Test"
        shell: pwsh
        env:
          LOG_LEVEL: ${{ matrix.build-type == 'release' && 'error' || 'trace' }}
          RELEASE_FLAG: ${{ matrix.build-type == 'release' && 'RELEASE=yes' || '' }}
        run: |
          .\z.ps1 build -- all run-unit-tests $env:RELEASE_FLAG MACHINE=$env:MACHINE_TYPE LOG_LEVEL=$env:LOG_LEVEL MEMORY_SIZE=${{ matrix.memory-size }}

      - name: "Upload Build Artifacts"
        uses: actions/upload-artifact@v7
        with:
          name: windows-build-${{ matrix.machine-type }}-${{ matrix.build-type }}-${{ matrix.memory-size }}mb
          retention-days: 1
          path: |
            bin/*.exe
            bin/*.elf
            bin/*.img

  # Run the full standalone test suite on Windows Hypervisor Platform using nanvix-test.exe,
  # mirroring the Linux CI integration-test stage.
  windows-integration-test:
    name: "Windows Integration Test (${{ matrix.machine-type }}, ${{ matrix.build-type }})"
    needs: [windows-ci-build]
    # NOTE: !cancelled() — see comment on 'checks' job (actions/runner#2205).
    if: ${{ !cancelled() && needs.windows-ci-build.result == 'success' }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        build-type: ${{ fromJSON(github.event_name == 'pull_request' && '["debug"]' || github.event_name == 'workflow_dispatch' && '["debug","release"]' || '["release"]') }}
        machine-type: [microvm, hyperlight]
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6

      - name: "Download Build Artifacts"
        uses: actions/download-artifact@v8
        with:
          name: windows-build-${{ matrix.machine-type }}-${{ matrix.build-type }}-128mb
          path: bin

      - name: "Exclude bin/ from Windows Defender"
        shell: pwsh
        run: |
          # Prevent Defender from quarantining unsigned executables extracted
          # from the build artifact. If the Defender service is not running
          # (error 0x800106ba on some runner images), the exclusion is
          # unnecessary — skip gracefully.
          $binDir = Join-Path $env:GITHUB_WORKSPACE "bin"
          try {
            Add-MpPreference -ExclusionPath $binDir
            Write-Host "Added Defender exclusion for $binDir"
          } catch {
            $errorMessage = $_.Exception.Message
            Write-Host "::warning::Could not add Defender exclusion: $errorMessage"
            Write-Host "Full Defender exclusion error: $_"
          }

      - name: "Verify Build Artifacts"
        shell: pwsh
        run: |
          Get-ChildItem bin -Filter *.exe | Format-Table Name, Length
          Get-ChildItem bin -Filter *.elf | Format-Table Name, Length
          Get-ChildItem bin -Filter *.img | Format-Table Name, Length

      - name: "Check Windows Hypervisor Platform"
        id: whp-check
        shell: pwsh
        run: |
          $feature = Get-WindowsOptionalFeature -Online -FeatureName HypervisorPlatform
          if ($feature.State -ne 'Enabled') {
            Write-Host "::warning::Windows Hypervisor Platform is not enabled — skipping integration tests."
            echo "whp_available=false" >> $env:GITHUB_OUTPUT
            exit 0
          }
          Write-Host "HypervisorPlatform feature is enabled."

          # Probe whether WHP can actually boot a guest by running hello-rust-nostd
          # with a short timeout. GitHub-hosted runners may report the feature as
          # enabled without functional nested virtualization.
          Write-Host "Probing WHP with hello-rust-nostd (30s timeout)..."
          $proc = Start-Process -FilePath ".\bin\nanvixd.exe" `
            -ArgumentList "-- .\bin\hello-rust-nostd.elf" `
            -PassThru -NoNewWindow -RedirectStandardOutput "whp-probe-stdout.txt" `
            -RedirectStandardError "whp-probe-stderr.txt"

          $exited = $proc | Wait-Process -Timeout 30 -ErrorAction SilentlyContinue
          if (-not $proc.HasExited) {
            $proc | Stop-Process -Force
            Write-Host "::warning::WHP probe timed out — hypervisor is not functional on this runner. Skipping integration tests."
            echo "whp_available=false" >> $env:GITHUB_OUTPUT
            exit 0
          }

          if ($proc.ExitCode -ne 0) {
            Write-Host "::warning::WHP probe failed with exit code $($proc.ExitCode) — skipping integration tests."
            Get-Content "whp-probe-stderr.txt" -ErrorAction SilentlyContinue | Write-Host
            echo "whp_available=false" >> $env:GITHUB_OUTPUT
            exit 0
          }

          Write-Host "WHP probe succeeded — hypervisor is functional."
          echo "whp_available=true" >> $env:GITHUB_OUTPUT

      - name: "Run Integration Tests"
        if: steps.whp-check.outputs.whp_available == 'true'
        shell: pwsh
        env:
          RUST_LOG: trace
        run: |
          & .\bin\nanvix-test.exe .\test\test-standalone-windows.toml

      - name: "Upload logs in case of failures"
        if: failure() || cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: nanvix-windows-integration-logs-${{ github.event.pull_request.number || github.run_number }}-${{ matrix.machine-type }}-${{ matrix.build-type }}
          overwrite: "true"
          path: |
            logs/
            **/*.log
            **/*.out
            **/*.err

  # Run micro-benchmarks on a Windows GitHub-hosted runner using WHP so that Windows-specific
  # performance data is collected alongside the Linux results. Only standalone-mode benchmarks are
  # supported (boot-time, cold-start, warm-start-vmm).
  windows-benchmark-ci:
    name: "Windows Benchmark CI (${{ matrix.machine-type }})"
    needs: [precheck]
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - machine-type: microvm
            standard-benchmarks: "boot-time cold-start snapshot-restore vfs-bench warm-start-vmm"
            standard-iterations: "100"
          # NOTE (#1759, #1762): Hyperlight benchmarks are disabled until the
          # round-trip-latency failure is investigated.
    runs-on: windows-latest
    permissions:
      contents: read

    # NOTE: !cancelled() — see comment on 'checks' job (actions/runner#2205).
    if: |
      !cancelled() &&
      github.repository == 'nanvix/nanvix' && (
        github.event_name == 'merge_group' || github.event_name == 'schedule' || (
          needs.precheck.outputs.up_to_date == 'true' && (
            github.event_name != 'push' ||
            github.event.head_commit == null ||
            !startsWith(github.event.head_commit.message, 'Merge ')
          ) && (
            github.event_name != 'pull_request' ||
            !github.event.pull_request.draft
          )
        )
      )

    steps:
      - uses: actions/checkout@v6

      - name: "Install Rust Toolchain"
        shell: pwsh
        run: |
          $toolchain = (Get-Content rust-toolchain | Select-String '^channel\s*=').ToString() -replace '.*=\s*"([^"]+)".*','$1'
          rustup toolchain install $toolchain
          rustup show
          rustup component add --toolchain $toolchain clippy rustfmt

      - name: "Setup Prerequisites"
        shell: pwsh
        run: |
          $osVersion = [System.Environment]::OSVersion.Version
          if ($osVersion.Build -ge 22000) {
            Write-Host "Detected Windows build $($osVersion.Build) (Windows 11 or later). Running z.ps1 setup..."
            .\z.ps1 setup
          }
          else {
            Write-Host "Detected Windows build $($osVersion.Build) (< 22000). Skipping z.ps1 setup on CI runner."
          }

      - name: "Isolate Cargo Home"
        shell: pwsh
        run: |
          # Isolate Cargo home per job to prevent git-cache corruption on
          # Windows runners that may share the same filesystem across runs.
          # Symlink the toolchain bin/ directory so that the Makefile can
          # still resolve $env:CARGO_HOME/bin/cargo.
          $isolatedCargo = Join-Path $env:RUNNER_TEMP ".cargo"
          New-Item -ItemType Directory -Force -Path $isolatedCargo | Out-Null
          $cargoBin = Join-Path $isolatedCargo "bin"
          if (Test-Path $cargoBin) { Remove-Item $cargoBin -Force -Recurse }
          New-Item -ItemType SymbolicLink -Path $cargoBin -Target (Join-Path $env:USERPROFILE ".cargo\bin") | Out-Null
          echo "CARGO_HOME=$isolatedCargo" >> $env:GITHUB_ENV
          Write-Host "Isolated CARGO_HOME to $isolatedCargo"

      - name: "Build"
        shell: pwsh
        env:
          MACHINE_TYPE: ${{ matrix.machine-type }}
        run: |
          .\z.ps1 build -- all MACHINE=$env:MACHINE_TYPE RELEASE=yes LOG_LEVEL=panic PROFILER=yes

      - name: "Exclude bin/ from Windows Defender"
        shell: pwsh
        run: |
          # If the Defender service is not running (error 0x800106ba on some
          # runner images), the exclusion is unnecessary — skip gracefully.
          $binDir = Join-Path $env:GITHUB_WORKSPACE "bin"
          try {
            Add-MpPreference -ExclusionPath $binDir
            Write-Host "Added Defender exclusion for $binDir"
          } catch {
            $errorMessage = $_.Exception.Message
            Write-Host "::warning::Could not add Defender exclusion: $errorMessage"
            Write-Host "Full Defender exclusion error: $_"
          }

      - name: "Check Windows Hypervisor Platform"
        id: whp-check
        shell: pwsh
        run: |
          $feature = Get-WindowsOptionalFeature -Online -FeatureName HypervisorPlatform
          if ($feature.State -ne 'Enabled') {
            Write-Host "::warning::Windows Hypervisor Platform is not enabled — skipping benchmarks."
            echo "whp_available=false" >> $env:GITHUB_OUTPUT
            exit 0
          }
          Write-Host "HypervisorPlatform feature is enabled."

          # Probe whether WHP can actually boot a guest by running hello-rust-nostd
          # with a short timeout. GitHub-hosted runners may report the feature as
          # enabled without functional nested virtualization.
          Write-Host "Probing WHP with hello-rust-nostd (30s timeout)..."
          $proc = Start-Process -FilePath ".\bin\nanvixd.exe" `
            -ArgumentList "-- .\bin\hello-rust-nostd.elf" `
            -PassThru -NoNewWindow -RedirectStandardOutput "whp-probe-stdout.txt" `
            -RedirectStandardError "whp-probe-stderr.txt"

          $proc | Wait-Process -Timeout 30 -ErrorAction SilentlyContinue
          if (-not $proc.HasExited) {
            $proc | Stop-Process -Force
            Write-Host "::warning::WHP probe timed out — hypervisor is not functional on this runner. Skipping benchmarks."
            echo "whp_available=false" >> $env:GITHUB_OUTPUT
            exit 0
          }

          if ($proc.ExitCode -ne 0) {
            Write-Host "::warning::WHP probe failed with exit code $($proc.ExitCode) — skipping benchmarks."
            Get-Content "whp-probe-stderr.txt" -ErrorAction SilentlyContinue | Write-Host
            echo "whp_available=false" >> $env:GITHUB_OUTPUT
            exit 0
          }

          Write-Host "WHP probe succeeded — hypervisor is functional."
          echo "whp_available=true" >> $env:GITHUB_OUTPUT

      - name: "Run Micro-Benchmarks"
        if: steps.whp-check.outputs.whp_available == 'true'
        shell: pwsh
        env:
          BENCHMARKS: ${{ matrix.standard-benchmarks }}
          MACHINE_TYPE: ${{ matrix.machine-type }}
          ITERATIONS: ${{ matrix.standard-iterations }}
        run: |
          foreach ($bench in $env:BENCHMARKS -split ' ') {
            Write-Host "[INFO] Running benchmark '${bench}'..."
            python scripts/benchmark.py `
              run `
              --benchmark $bench `
              --machine-type $env:MACHINE_TYPE `
              --iterations $env:ITERATIONS `
              --output-dir "." `
              --commit "${{ github.sha }}"
            if ($LASTEXITCODE -ne 0) {
              Write-Error "Benchmark '${bench}' failed with exit code $LASTEXITCODE"
              exit $LASTEXITCODE
            }
          }

      - name: "Upload Benchmark Results"
        if: always() && !cancelled() && steps.whp-check.outputs.whp_available == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-ci-windows-results-${{ matrix.machine-type }}
          overwrite: true
          retention-days: 1
          path: nanvix_bench_*.csv

      - name: "Upload logs in case of benchmark failures"
        if: failure() || cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: nanvix-benchmark-ci-windows-logs-${{ github.event.pull_request.number || github.run_number }}-${{ matrix.machine-type }}
          overwrite: "true"
          path: |
            logs/
            **/*.log
            **/*.out
            **/*.err
            bench_*.txt

  # ==========================================================================================
  # Stage 3: L2 and Benchmark (Self-Hosted Runners)
  # ==========================================================================================

  # L2 configurations require .git for generate-l2-initramfs.sh, so they build
  # from source on self-hosted runners with a local toolchain.
  ci-l2:
    name: "L2 (${{ matrix.build-type }}, ${{ matrix.machine-type }})"
    needs: [precheck, checks]
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        build-type: ${{ fromJSON(github.event_name == 'pull_request' && '["debug"]' || github.event_name == 'workflow_dispatch' && '["debug","release"]' || '["release"]') }}
        machine-type: [microvm, hyperlight]
    runs-on:
      group: Test
      labels: [self-hosted, Linux]
    permissions:
      contents: read

    # NOTE: !cancelled() — see comment on 'checks' job (actions/runner#2205).
    # !failure() ensures L2 does not start when checks fail.
    if: |
      !cancelled() && !failure() &&
      github.repository == 'nanvix/nanvix' && (
        github.event_name == 'merge_group' || github.event_name == 'schedule' || (
          needs.precheck.outputs.up_to_date == 'true' && (
            github.event_name != 'push' ||
            github.event.head_commit == null ||
            !startsWith(github.event.head_commit.message, 'Merge ')
          ) && (
            github.event_name != 'pull_request' ||
            !github.event.pull_request.draft
          )
        )
      )

    steps:
      - name: "Pre-Checkout Cleanup"
        shell: bash
        run: |
          # Previous runs may leave root-owned files (e.g., images/l2-sysvm-rootfs/dev)
          # that prevent actions/checkout from resetting the workspace. The cleanup
          # composite action cannot run before checkout, so perform a direct cleanup
          # of the images directory without executing any workspace scripts.
          if [[ -d "${GITHUB_WORKSPACE}/images" ]]; then
            echo "Removing images directory before checkout..."
            sudo rm -rf "${GITHUB_WORKSPACE}/images"
          fi

      - uses: actions/checkout@v6

      - name: "Isolate Cargo Home"
        shell: bash
        run: |
          # Isolate Cargo home per job to prevent concurrent git-cache races on
          # self-hosted runners that share the same filesystem.  Symlink the
          # toolchain bin/ directory so that the Makefile can still resolve
          # $CARGO_HOME/bin/cargo.
          mkdir -p "$RUNNER_TEMP/.cargo"
          ln -sfn "$HOME/.cargo/bin" "$RUNNER_TEMP/.cargo/bin"
          echo "CARGO_HOME=$RUNNER_TEMP/.cargo" >> "$GITHUB_ENV"

      - name: "Pre-Cleanup Dangling Resources"
        uses: ./.github/actions/cleanup
        with:
          phase: pre

      - name: "Link Toolchain Directory"
        uses: ./.github/actions/link-toolchain

      - name: "Lint"
        uses: ./.github/actions/lint
        with:
          release: "${{ matrix.build-type }}"
          log-level: "trace"
          machine-type: "${{ matrix.machine-type }}"
          deployment-type: "l2"

      - name: "Build"
        uses: ./.github/actions/build
        with:
          release: "${{ matrix.build-type }}"
          # Use 'error' log level for release builds to match release archive settings,
          # enabling reuse of build artifacts and avoiding a redundant rebuild.
          log-level: ${{ matrix.build-type == 'release' && 'error' || 'trace' }}
          machine-type: "${{ matrix.machine-type }}"
          deployment-type: "l2"

      - name: "Test"
        uses: ./.github/actions/test
        with:
          release: "${{ matrix.build-type }}"
          log-level: ${{ matrix.build-type == 'release' && 'error' || 'trace' }}
          machine-type: "${{ matrix.machine-type }}"
          deployment-type: "l2"

      - name: "Collect L2 diagnostics"
        if: failure() || cancelled()
        uses: ./.github/actions/collect-l2-diagnostics

      - name: "Post-Cleanup Dangling Resources"
        if: always()
        uses: ./.github/actions/cleanup
        with:
          phase: post

      - name: "Upload logs in case of failures"
        if: failure() || cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: nanvix-l2-logs-${{ github.event.pull_request.number || github.run_number }}-${{ matrix.build-type }}-${{ matrix.machine-type }}
          overwrite: "true"
          path: |
            logs/
            **/*.log
            **/*.out
            **/*.err

  # Build from source and run micro-benchmarks on baremetal self-hosted runners.
  # Benchmarks require DEPLOYMENT_MODE=l2 which needs .git, so they cannot use Docker builds.
  # Each machine type runs in parallel; a finalize job aggregates results.
  benchmark:
    name: "Benchmark (${{ matrix.machine-type }})"
    needs: [precheck]
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - machine-type: microvm
            # FIXME(1171): the current L2 deployment involves a very slow network
            # namespace creation, particularly at high-churn, so we must temporarily
            # reduce the number of iterations of the benchmarks.
            standard-benchmarks: "boot-time cold-start cold-start-l2 cold-start-uvm concurrent concurrent-l2 round-trip-latency snapshot-restore warm-start warm-start-l2 warm-start-vmm"
            standard-iterations: "100"
            echo-benchmarks: "echo-breakdown echo-breakdown-l2"
            echo-iterations: "1000"
            vfs-benchmarks: "vfs-bench"
            vfs-iterations: "100"
          # NOTE (#1759, #1762): Hyperlight benchmarks are disabled until the
          # round-trip-latency failure is investigated.
    runs-on:
      group: Benchmark
      labels: [self-hosted, Linux]
    permissions:
      contents: read

    # NOTE: !cancelled() — see comment on 'checks' job (actions/runner#2205).
    if: |
      !cancelled() &&
      github.repository == 'nanvix/nanvix' && (
        github.event_name == 'merge_group' || github.event_name == 'schedule' || (
          needs.precheck.outputs.up_to_date == 'true' && (
            github.event_name != 'push' ||
            github.event.head_commit == null ||
            !startsWith(github.event.head_commit.message, 'Merge ')
          ) && (
            github.event_name != 'pull_request' ||
            !github.event.pull_request.draft
          )
        )
      )

    steps:
      - name: "Pre-Checkout Cleanup"
        shell: bash
        run: |
          # Previous runs may leave root-owned files (e.g., images/l2-sysvm-rootfs/dev)
          # that prevent actions/checkout from resetting the workspace. The cleanup
          # composite action cannot run before checkout, so perform a direct cleanup
          # of the images directory without executing any workspace scripts.
          if [[ -d "${GITHUB_WORKSPACE}/images" ]]; then
            echo "Removing images directory before checkout..."
            sudo rm -rf "${GITHUB_WORKSPACE}/images"
          fi

      - uses: actions/checkout@v6

      - name: "Isolate Cargo Home"
        shell: bash
        run: |
          # Isolate Cargo home per job to prevent concurrent git-cache races on
          # self-hosted runners that share the same filesystem.  Symlink the
          # toolchain bin/ directory so that the Makefile can still resolve
          # $CARGO_HOME/bin/cargo.
          mkdir -p "$RUNNER_TEMP/.cargo"
          ln -sfn "$HOME/.cargo/bin" "$RUNNER_TEMP/.cargo/bin"
          echo "CARGO_HOME=$RUNNER_TEMP/.cargo" >> "$GITHUB_ENV"

      - name: "Pre-Cleanup Dangling Resources"
        uses: ./.github/actions/cleanup
        with:
          phase: pre

      - name: "Link Toolchain Directory"
        uses: ./.github/actions/link-toolchain

      - name: "Build (Standard)"
        uses: ./.github/actions/benchmark-build
        with:
          machine-type: "${{ matrix.machine-type }}"

      - name: "Run Micro-Benchmarks (Standard)"
        uses: ./.github/actions/benchmark-run
        with:
          benchmarks: "${{ matrix.standard-benchmarks }}"
          machine-type: "${{ matrix.machine-type }}"
          iterations: "${{ matrix.standard-iterations }}"

      - name: "Build (Echo-Breakdown)"
        if: matrix.echo-benchmarks != ''
        uses: ./.github/actions/benchmark-build
        with:
          machine-type: "${{ matrix.machine-type }}"
          timestamp-msg: "yes"

      - name: "Run Echo-Breakdown Benchmarks"
        if: matrix.echo-benchmarks != ''
        uses: ./.github/actions/benchmark-run
        with:
          benchmarks: "${{ matrix.echo-benchmarks }}"
          machine-type: "${{ matrix.machine-type }}"
          iterations: "${{ matrix.echo-iterations }}"

      - name: "Build (Standalone VFS)"
        if: matrix.vfs-benchmarks != ''
        shell: bash
        env:
          MACHINE_TYPE: ${{ matrix.machine-type }}
        run: |
          ./z build -- all \
            "MACHINE=${MACHINE_TYPE}" \
            TARGET=x86 \
            LOG_LEVEL=panic \
            VERBOSE=yes \
            RELEASE=yes \
            DEPLOYMENT_MODE=standalone

      - name: "Run VFS Benchmarks"
        if: matrix.vfs-benchmarks != ''
        uses: ./.github/actions/benchmark-run
        with:
          benchmarks: "${{ matrix.vfs-benchmarks }}"
          machine-type: "${{ matrix.machine-type }}"
          iterations: "${{ matrix.vfs-iterations }}"

      - name: "Upload Benchmark Results"
        if: always() && !cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-results-${{ matrix.machine-type }}
          overwrite: true
          retention-days: 1
          path: nanvix_bench_*.csv

      - name: "Dump SCCACHE Statistics"
        if: always()
        uses: ./.github/actions/sccache-stats

      - name: "Post-Cleanup Dangling Resources"
        if: always()
        uses: ./.github/actions/cleanup
        with:
          phase: post

      - name: "Upload logs in case of benchmark failures"
        if: failure() || cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: nanvix-benchmark-logs-${{ github.event.pull_request.number || github.run_number }}-${{ matrix.machine-type }}
          overwrite: "true"
          path: |
            logs/
            **/*.log
            **/*.out
            **/*.err
            bench_*.txt

  # Build from source and run micro-benchmarks on self-hosted Windows baremetal
  # runners. Only standalone-mode benchmarks are supported (boot-time, cold-start,
  # snapshot-restore, warm-start-vmm). The self-hosted runner is a dedicated
  # machine with a known-functional WHP hypervisor, so the WHP probe and Defender
  # exclusion steps used by windows-benchmark-ci are omitted.
  windows-benchmark:
    name: "Windows Benchmark (${{ matrix.machine-type }})"
    needs: [precheck]
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - machine-type: microvm
            standard-benchmarks: "boot-time cold-start snapshot-restore vfs-bench warm-start-vmm"
            standard-iterations: "100"
          # NOTE (#1759, #1762): Hyperlight benchmarks are disabled until the
          # round-trip-latency failure is investigated.
    runs-on:
      group: Benchmark
      labels: [self-hosted, Windows]
    permissions:
      contents: read

    # NOTE: !cancelled() — see comment on 'checks' job (actions/runner#2205).
    # Fork PRs are excluded to prevent untrusted code from running on
    # self-hosted runners.
    if: |
      !cancelled() &&
      github.repository == 'nanvix/nanvix' && (
        github.event_name == 'merge_group' || github.event_name == 'schedule' || (
          needs.precheck.outputs.up_to_date == 'true' && (
            github.event_name != 'push' ||
            github.event.head_commit == null ||
            !startsWith(github.event.head_commit.message, 'Merge ')
          ) && (
            github.event_name != 'pull_request' ||
            (
              !github.event.pull_request.draft &&
              github.event.pull_request.head.repo.full_name == github.repository
            )
          )
        )
      )

    steps:
      - uses: actions/checkout@v6

      - name: "Restore Directory Symlinks as Junctions"
        shell: pwsh
        run: |
          # Git checks out symlinks as plain text files on Windows when the
          # service account lacks SeCreateSymbolicLinkPrivilege. Directory
          # symlinks end up as small text stubs containing the target path.
          # Convert them to NTFS junctions, which need no special privileges.
          git ls-files -s | ForEach-Object {
            if ($_ -match '^120000\s+\S+\s+\S+\t(.+)$') {
              $relPath = $Matches[1]
              $fullPath = Join-Path $PWD $relPath
              if ((Test-Path $fullPath) -and -not (Test-Path $fullPath -PathType Container)) {
                $target = (Get-Content $fullPath -Raw).Trim()
                $parentDir = Split-Path $fullPath
                $resolved = [System.IO.Path]::GetFullPath((Join-Path $parentDir $target))
                if (Test-Path $resolved -PathType Container) {
                  Remove-Item $fullPath -Force
                  cmd /c mklink /J "$fullPath" "$resolved" | Out-Null
                  Write-Host "Junction: $relPath -> $target"
                }
              }
            }
          }

      - name: "Refresh PATH from Registry"
        shell: pwsh
        run: |
          # Self-hosted runner services may have a stale PATH from when the
          # service was started. Re-read the current Machine and User PATH
          # from the registry so that tools installed after the service
          # started (e.g., rustup) are found.
          $machinePath = [Environment]::GetEnvironmentVariable("Path", "Machine")
          $userPath    = [Environment]::GetEnvironmentVariable("Path", "User")
          $env:PATH    = "$machinePath;$userPath"
          echo "PATH=$env:PATH" >> $env:GITHUB_ENV

      - name: "Set Rust Environment"
        shell: pwsh
        run: |
          # The runner service runs as NetworkService, but Rust was installed
          # under the Administrator account. Set CARGO_HOME so the Makefile
          # can resolve $CARGO_HOME/bin/cargo. RUSTUP_HOME is intentionally
          # left unset to avoid cross-account directory ownership issues;
          # rustup is found via PATH instead. This is a dedicated baremetal
          # runner with a pre-installed toolchain.
          echo "CARGO_HOME=C:\Users\Administrator\.cargo" >> $env:GITHUB_ENV

      - name: "Isolate Cargo Home"
        shell: pwsh
        run: |
          # Isolate Cargo home per job to prevent git-cache corruption on
          # Windows runners that may share the same filesystem across runs.
          # Use an NTFS junction for the toolchain bin/ directory so that
          # the Makefile can still resolve $env:CARGO_HOME/bin/cargo
          # without requiring symlink privileges.
          $cargoTarget = Join-Path $env:CARGO_HOME "bin"
          $isolatedCargo = Join-Path $env:RUNNER_TEMP ".cargo"
          New-Item -ItemType Directory -Force -Path $isolatedCargo | Out-Null
          $cargoBin = Join-Path $isolatedCargo "bin"
          if (Test-Path $cargoBin) { Remove-Item $cargoBin -Force -Recurse }
          cmd /c "mklink /J `"$cargoBin`" `"$cargoTarget`"" | Out-Null
          echo "CARGO_HOME=$isolatedCargo" >> $env:GITHUB_ENV
          Write-Host "Isolated CARGO_HOME to $isolatedCargo"

      - name: "Verify Rust Toolchain"
        shell: pwsh
        run: |
          $toolchain = (Get-Content rust-toolchain | Select-String '^channel\s*=').ToString() -replace '.*=\s*"([^"]+)".*','$1'
          Write-Host "Expected toolchain: $toolchain"
          rustup show
          cargo --version

      - name: "Setup Prerequisites"
        shell: pwsh
        run: |
          $osVersion = [System.Environment]::OSVersion.Version
          if ($osVersion.Build -ge 22000) {
            Write-Host "Detected Windows build $($osVersion.Build) (Windows 11 or later). Running z.ps1 setup..."
            .\z.ps1 setup
          }
          else {
            Write-Host "Detected Windows build $($osVersion.Build) (< 22000). Skipping z.ps1 setup on CI runner."
          }

      - name: "Build"
        shell: pwsh
        env:
          MACHINE_TYPE: ${{ matrix.machine-type }}
        run: |
          .\z.ps1 build -- all MACHINE=$env:MACHINE_TYPE RELEASE=yes LOG_LEVEL=panic PROFILER=yes

      - name: "Benchmark Setup"
        # Requires admin privileges. The self-hosted benchmark runners are
        # configured to run the Actions runner service as Administrator.
        shell: pwsh
        run: |
          .\scripts\bench\bench-setup.ps1 -SaveState

      - name: "Run Micro-Benchmarks"
        shell: pwsh
        env:
          BENCHMARKS: ${{ matrix.standard-benchmarks }}
          MACHINE_TYPE: ${{ matrix.machine-type }}
          ITERATIONS: ${{ matrix.standard-iterations }}
        run: |
          foreach ($bench in $env:BENCHMARKS -split ' ') {
            Write-Host "[INFO] Running benchmark '${bench}'..."
            python scripts/benchmark.py `
              run `
              --benchmark $bench `
              --machine-type $env:MACHINE_TYPE `
              --iterations $env:ITERATIONS `
              --output-dir "." `
              --commit "${{ github.sha }}"
            if ($LASTEXITCODE -ne 0) {
              Write-Error "Benchmark '${bench}' failed with exit code $LASTEXITCODE"
              exit $LASTEXITCODE
            }
          }

      - name: "Benchmark Teardown"
        if: always()
        shell: pwsh
        run: |
          .\scripts\bench\bench-teardown.ps1 -KeepDefenderExclusion

      - name: "Upload Benchmark Results"
        if: always() && !cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-windows-baremetal-results-${{ matrix.machine-type }}
          overwrite: true
          retention-days: 1
          path: nanvix_bench_*.csv

      - name: "Upload logs in case of benchmark failures"
        if: failure() || cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: nanvix-benchmark-windows-baremetal-logs-${{ github.event.pull_request.number || github.run_number }}-${{ matrix.machine-type }}
          overwrite: "true"
          path: |
            logs/
            **/*.log
            **/*.out
            **/*.err
            bench_*.txt

  # Aggregate benchmark results from all machine types, post a PR comment,
  # and persist the updated baselines on dev.
  # NOTE: all matrix legs must succeed; partial results are intentionally
  # discarded so that baselines stay consistent across machine types.
  benchmark-finalize:
    name: "Benchmark Finalize"
    needs: [benchmark]
    # NOTE: needs.benchmark.result is the aggregate result across all matrix
    # legs. It is 'success' only when every leg succeeds.
    if: ${{ !cancelled() && needs.benchmark.result == 'success' }}
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - uses: actions/checkout@v6
        with:
          # Use the deploy SSH key so that benchmark-persist can push results
          # to the dev branch (the deploy key is a bypass actor for branch
          # protection rules, matching the approach in create-minor-release).
          ssh-key: ${{ secrets.DEPLOY_PRIVATE_SSH_KEY }}

      - name: "Download Benchmark Results"
        uses: actions/download-artifact@v8
        with:
          pattern: benchmark-results-*
          path: .
          merge-multiple: true

      - name: "Report Benchmark Results"
        uses: ./.github/actions/benchmark-report
        with:
          benchmarks: "boot-time,cold-start,cold-start-l2,cold-start-uvm,concurrent,concurrent-l2,echo-breakdown,echo-breakdown-l2,round-trip-latency,snapshot-restore,vfs-bench,warm-start,warm-start-l2,warm-start-vmm"
          machine-types: "microvm"
          archs: "X64"
          dev-dir: "data/baremetal"
          runner-label: "self-hosted"
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: "Persist results on dev"
        if: github.ref_name == 'dev'
        uses: ./.github/actions/benchmark-persist
        with:
          benchmarks: "boot-time,cold-start,cold-start-l2,cold-start-uvm,concurrent,concurrent-l2,echo-breakdown,echo-breakdown-l2,round-trip-latency,snapshot-restore,vfs-bench,warm-start,warm-start-l2,warm-start-vmm"
          machine-types: "microvm,hyperlight"
          archs: "X64"
          target-dir: "data/baremetal"

      - name: "Upload logs in case of finalize failures"
        if: failure() || cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: nanvix-benchmark-finalize-logs-${{ github.event.pull_request.number || github.run_number }}
          overwrite: "true"
          path: |
            logs/
            **/*.log
            **/*.out
            **/*.err

  # Aggregate Windows baremetal benchmark results from all machine types,
  # post a PR comment, and persist the updated baselines on dev.
  # Results are stored in data/windows-baremetal/ to keep them isolated
  # from the Linux and GitHub-hosted baselines.
  windows-benchmark-finalize:
    name: "Windows Benchmark Finalize"
    needs: [windows-benchmark]
    # NOTE: needs.windows-benchmark.result is the aggregate result across all
    # matrix legs. It is 'success' only when every leg succeeds.
    if: ${{ !cancelled() && needs.windows-benchmark.result == 'success' }}
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - uses: actions/checkout@v6
        if: github.ref_name != 'dev'

      - uses: actions/checkout@v6
        if: github.ref_name == 'dev'
        with:
          # Use the deploy SSH key so that benchmark-persist can push results
          # to the dev branch.
          ssh-key: ${{ secrets.DEPLOY_PRIVATE_SSH_KEY }}

      - name: "Download Benchmark Results"
        uses: actions/download-artifact@v8
        with:
          pattern: benchmark-windows-baremetal-results-*
          path: .
          merge-multiple: true

      - name: "Report Benchmark Results"
        uses: ./.github/actions/benchmark-report
        with:
          benchmarks: "boot-time,cold-start,snapshot-restore,vfs-bench,warm-start-vmm"
          machine-types: "microvm"
          archs: "X64"
          dev-dir: "data/windows-baremetal"
          runner-label: "windows-baremetal"
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: "Persist results on dev"
        if: github.ref_name == 'dev'
        uses: ./.github/actions/benchmark-persist
        with:
          benchmarks: "boot-time,cold-start,snapshot-restore,vfs-bench,warm-start-vmm"
          machine-types: "microvm"
          archs: "X64"
          target-dir: "data/windows-baremetal"

      - name: "Upload logs in case of finalize failures"
        if: failure() || cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: nanvix-benchmark-windows-baremetal-finalize-logs-${{ github.event.pull_request.number || github.run_number }}
          overwrite: "true"
          path: |
            logs/
            **/*.log
            **/*.out
            **/*.err

  # Run micro-benchmarks on a GitHub-hosted runner using the native Rust
  # toolchain so that results are collected even without self-hosted hardware.
  # L2 benchmarks are intentionally excluded as they require self-hosted
  # infrastructure. GitHub runner results are stored in data/github/ to keep
  # them isolated from the self-hosted runner baselines in data/baremetal/.
  # Each machine type runs in parallel; a finalize job aggregates results.
  benchmark-ci:
    name: "Benchmark CI (${{ matrix.machine-type }})"
    needs: [precheck]
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - machine-type: microvm
            # NOTE: concurrent is excluded on GitHub-hosted runners because the
            # gateway handshake race condition (issue #1552) causes sporadic
            # timeouts under the scheduling contention of shared CI machines.
            standard-benchmarks: "boot-time cold-start cold-start-uvm round-trip-latency snapshot-restore warm-start warm-start-vmm"
            standard-iterations: "100"
            echo-benchmarks: "echo-breakdown"
            echo-iterations: "1000"
            vfs-benchmarks: "vfs-bench"
            vfs-iterations: "100"
          # NOTE (#1759, #1762): Hyperlight benchmarks are disabled until the
          # round-trip-latency failure is investigated.
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    # NOTE: !cancelled() — see comment on 'checks' job (actions/runner#2205).
    if: |
      !cancelled() &&
      github.repository == 'nanvix/nanvix' && (
        github.event_name == 'merge_group' || github.event_name == 'schedule' || (
          needs.precheck.outputs.up_to_date == 'true' && (
            github.event_name != 'push' ||
            github.event.head_commit == null ||
            !startsWith(github.event.head_commit.message, 'Merge ')
          ) && (
            github.event_name != 'pull_request' ||
            !github.event.pull_request.draft
          )
        )
      )

    steps:
      - uses: actions/checkout@v6

      # cloud-hypervisor is NOT installed here: it is only required for L2
      # benchmarks, which run exclusively on self-hosted runners.
      - name: "Setup"
        uses: ./.github/actions/native-setup

      - name: "Setup sccache"
        uses: Mozilla-Actions/sccache-action@v0.0.9
        with:
          version: "v0.10.0"

      - name: "Build (Standard)"
        shell: bash
        env:
          MACHINE_TYPE: ${{ matrix.machine-type }}
        run: |
          ./z build -- all \
            "MACHINE=${MACHINE_TYPE}" \
            TARGET=x86 \
            LOG_LEVEL=panic \
            VERBOSE=yes \
            RELEASE=yes

      - name: "Setup KVM"
        uses: ./.github/actions/setup-kvm

      - name: "Run Micro-Benchmarks (Standard)"
        shell: bash
        env:
          BENCHMARKS: ${{ matrix.standard-benchmarks }}
          MACHINE_TYPE: ${{ matrix.machine-type }}
          ITERATIONS: ${{ matrix.standard-iterations }}
        run: |
          for bench in ${BENCHMARKS}; do
            echo "[INFO] Running benchmark '${bench}'..."
            python3 ./scripts/benchmark.py \
              run \
              --benchmark "${bench}" \
              --machine-type "${MACHINE_TYPE}" \
              --iterations "${ITERATIONS}" \
              --toolchain-bin-dir "${HOME}/toolchain/bin" \
              --output-dir "$(pwd)" \
              --commit "${{ github.sha }}"
          done

      - name: "Build (Echo-Breakdown)"
        if: matrix.echo-benchmarks != ''
        shell: bash
        env:
          MACHINE_TYPE: ${{ matrix.machine-type }}
        run: |
          ./z build -- all \
            "MACHINE=${MACHINE_TYPE}" \
            TARGET=x86 \
            LOG_LEVEL=panic \
            VERBOSE=yes \
            RELEASE=yes \
            TIMESTAMP_MSG=yes

      - name: "Run Echo-Breakdown Benchmarks"
        if: matrix.echo-benchmarks != ''
        shell: bash
        env:
          BENCHMARKS: ${{ matrix.echo-benchmarks }}
          MACHINE_TYPE: ${{ matrix.machine-type }}
          ITERATIONS: ${{ matrix.echo-iterations }}
        run: |
          for bench in ${BENCHMARKS}; do
            echo "[INFO] Running benchmark '${bench}'..."
            python3 ./scripts/benchmark.py \
              run \
              --benchmark "${bench}" \
              --machine-type "${MACHINE_TYPE}" \
              --iterations "${ITERATIONS}" \
              --toolchain-bin-dir "${HOME}/toolchain/bin" \
              --output-dir "$(pwd)" \
              --commit "${{ github.sha }}"
          done

      - name: "Build (Standalone VFS)"
        if: matrix.vfs-benchmarks != ''
        shell: bash
        env:
          MACHINE_TYPE: ${{ matrix.machine-type }}
        run: |
          ./z build -- all \
            "MACHINE=${MACHINE_TYPE}" \
            TARGET=x86 \
            LOG_LEVEL=panic \
            VERBOSE=yes \
            RELEASE=yes \
            DEPLOYMENT_MODE=standalone

      - name: "Run VFS Benchmarks"
        if: matrix.vfs-benchmarks != ''
        shell: bash
        env:
          BENCHMARKS: ${{ matrix.vfs-benchmarks }}
          MACHINE_TYPE: ${{ matrix.machine-type }}
          ITERATIONS: ${{ matrix.vfs-iterations }}
        run: |
          for bench in ${BENCHMARKS}; do
            echo "[INFO] Running benchmark '${bench}'..."
            python3 ./scripts/benchmark.py \
              run \
              --benchmark "${bench}" \
              --machine-type "${MACHINE_TYPE}" \
              --iterations "${ITERATIONS}" \
              --toolchain-bin-dir "${HOME}/toolchain/bin" \
              --output-dir "$(pwd)" \
              --commit "${{ github.sha }}"
          done

      - name: "Upload Benchmark Results"
        if: always() && !cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-ci-results-${{ matrix.machine-type }}
          overwrite: true
          retention-days: 1
          path: nanvix_bench_*.csv

      - name: "Upload logs in case of benchmark failures"
        if: failure() || cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: nanvix-benchmark-ci-logs-${{ github.event.pull_request.number || github.run_number }}-${{ matrix.machine-type }}
          overwrite: "true"
          path: |
            logs/
            **/*.log
            **/*.out
            **/*.err
            bench_*.txt

  # Aggregate CI benchmark results from all machine types, post a PR comment,
  # and persist the updated baselines on dev.
  # NOTE: all matrix legs must succeed; partial results are intentionally
  # discarded so that baselines stay consistent across machine types.
  benchmark-ci-finalize:
    name: "Benchmark CI Finalize"
    needs: [benchmark-ci]
    # NOTE: needs.benchmark-ci.result is the aggregate result across all matrix
    # legs. It is 'success' only when every leg succeeds.
    if: ${{ !cancelled() && needs.benchmark-ci.result == 'success' }}
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - uses: actions/checkout@v6
        with:
          ssh-key: ${{ secrets.DEPLOY_PRIVATE_SSH_KEY }}

      - name: "Download Benchmark Results"
        uses: actions/download-artifact@v8
        with:
          pattern: benchmark-ci-results-*
          path: .
          merge-multiple: true

      - name: "Report Benchmark Results"
        uses: ./.github/actions/benchmark-report
        with:
          benchmarks: "boot-time,cold-start,cold-start-uvm,echo-breakdown,round-trip-latency,snapshot-restore,vfs-bench,warm-start,warm-start-vmm"
          machine-types: "microvm"
          archs: "X64"
          dev-dir: "data/github"
          runner-label: "github-hosted"
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: "Persist results on dev"
        if: github.ref_name == 'dev'
        uses: ./.github/actions/benchmark-persist
        with:
          benchmarks: "boot-time,cold-start,cold-start-uvm,echo-breakdown,round-trip-latency,snapshot-restore,vfs-bench,warm-start,warm-start-vmm"
          machine-types: "microvm,hyperlight"
          archs: "X64"
          target-dir: "data/github"

      - name: "Upload logs in case of finalize failures"
        if: failure() || cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: nanvix-benchmark-ci-finalize-logs-${{ github.event.pull_request.number || github.run_number }}
          overwrite: "true"
          path: |
            logs/
            **/*.log
            **/*.out
            **/*.err

  # Aggregate Windows CI benchmark results, post a PR comment, and persist
  # the updated baselines on dev. Results are stored in data/windows-github/ to keep
  # them isolated from the Linux baselines.
  windows-benchmark-ci-finalize:
    name: "Windows Benchmark CI Finalize"
    needs: [windows-benchmark-ci]
    if: ${{ !cancelled() && needs.windows-benchmark-ci.result == 'success' }}
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - uses: actions/checkout@v6
        with:
          ssh-key: ${{ secrets.DEPLOY_PRIVATE_SSH_KEY }}

      - name: "Download Benchmark Results"
        id: download-results
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          pattern: benchmark-ci-windows-results-*
          path: .
          merge-multiple: true

      - name: "Check for benchmark results"
        id: check-results
        shell: bash
        run: |
          if compgen -G "nanvix_bench_*.csv" > /dev/null 2>&1; then
            echo "has_results=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No Windows benchmark CSV files found — skipping report and persist."
            echo "has_results=false" >> "$GITHUB_OUTPUT"
          fi

      - name: "Report Benchmark Results"
        if: steps.check-results.outputs.has_results == 'true'
        uses: ./.github/actions/benchmark-report
        with:
          benchmarks: "boot-time,cold-start,snapshot-restore,vfs-bench,warm-start-vmm"
          machine-types: "microvm"
          archs: "X64"
          dev-dir: "data/windows-github"
          runner-label: "windows-github-hosted"
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: "Persist results on dev"
        if: github.ref_name == 'dev' && steps.check-results.outputs.has_results == 'true'
        uses: ./.github/actions/benchmark-persist
        with:
          benchmarks: "boot-time,cold-start,snapshot-restore,vfs-bench,warm-start-vmm"
          machine-types: "microvm"
          archs: "X64"
          target-dir: "data/windows-github"

      - name: "Upload logs in case of finalize failures"
        if: failure() || cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: nanvix-benchmark-ci-windows-finalize-logs-${{ github.event.pull_request.number || github.run_number }}
          overwrite: "true"
          path: |
            logs/
            **/*.log
            **/*.out
            **/*.err

  # ==========================================================================================
  # Stage 4: Post Actions (Conditional)
  # ==========================================================================================

  # Create release archives for all applicable configurations.
  release-archive:
    name: "Release Archive (${{ matrix.target-arch }}, ${{ matrix.machine-type }}, ${{ matrix.deployment-type }}, ${{ matrix.memory-size }}mb)"
    needs:
      [
        ci-test,
        ci-l2,
        benchmark-finalize,
        benchmark-ci-finalize,
        windows-benchmark-finalize,
      ]
    # NOTE: !cancelled() — see comment on 'checks' job (actions/runner#2205).
    if: |
      !cancelled() &&
      github.repository == 'nanvix/nanvix' &&
      github.ref == 'refs/heads/dev' &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') &&
      needs.ci-test.result == 'success' &&
      needs.ci-l2.result == 'success' &&
      needs.benchmark-finalize.result == 'success' &&
      needs.benchmark-ci-finalize.result == 'success' &&
      needs.windows-benchmark-finalize.result == 'success'
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        target-arch: [x86]
        machine-type: [microvm, hyperlight]
        deployment-type: [standalone, single-process, multi-process]
        memory-size: [128, 256]
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6

      - name: "Download CI Build Artifacts"
        uses: actions/download-artifact@v8
        with:
          name: ci-build-release-${{ matrix.machine-type }}-${{ matrix.deployment-type }}-${{ matrix.memory-size }}mb
          path: .

      - name: "Package Release Archive"
        id: release-archive
        uses: ./.github/actions/release-package
        with:
          target-arch: "${{ matrix.target-arch }}"
          machine-type: "${{ matrix.machine-type }}"
          deployment-type: "${{ matrix.deployment-type }}"
          memory-size: "${{ matrix.memory-size }}"

      - name: "Upload Release Artifact"
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.target-arch }}-${{ matrix.machine-type }}-${{ matrix.deployment-type }}-${{ matrix.memory-size }}mb
          path: ${{ steps.release-archive.outputs.archive-path }}
          overwrite: true

  # Package Windows standalone binaries into a release archive (.zip).
  # Windows only supports standalone deployment mode.
  windows-release-archive:
    name: "Windows Release Archive (${{ matrix.target-arch }}, ${{ matrix.machine-type }}, ${{ matrix.memory-size }}mb)"
    needs:
      [
        windows-integration-test,
        ci-test,
        ci-l2,
        benchmark-finalize,
        benchmark-ci-finalize,
        windows-benchmark-finalize,
      ]
    # NOTE: !cancelled() — see comment on 'checks' job (actions/runner#2205).
    if: |
      !cancelled() &&
      github.repository == 'nanvix/nanvix' &&
      github.ref == 'refs/heads/dev' &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') &&
      needs.ci-test.result == 'success' &&
      needs.ci-l2.result == 'success' &&
      needs.benchmark-finalize.result == 'success' &&
      needs.benchmark-ci-finalize.result == 'success' &&
      needs.windows-benchmark-finalize.result == 'success' &&
      needs.windows-integration-test.result == 'success'
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        target-arch: [x86]
        machine-type: [microvm, hyperlight]
        memory-size: [128, 256]
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6

      - name: "Download Windows Build Artifacts"
        uses: actions/download-artifact@v8
        with:
          name: windows-build-${{ matrix.machine-type }}-release-${{ matrix.memory-size }}mb
          path: windows-bin

      - name: "Package Windows Release Archive"
        id: package
        shell: bash
        run: |
          commit_id="${GITHUB_SHA}"
          archive_name="nanvix-windows-${{ matrix.target-arch }}-${{ matrix.machine-type }}-standalone-release-${{ matrix.memory-size }}mb-${commit_id}.zip"

          # Create the zip archive from the downloaded Windows binaries.
          cd windows-bin
          zip -r "../${archive_name}" .
          cd ..

          echo "Packaged Windows release archive: ${archive_name}"
          ls -lh "${archive_name}"
          echo "archive-path=${archive_name}" >> "${GITHUB_OUTPUT}"

      - name: "Upload Release Artifact"
        uses: actions/upload-artifact@v7
        with:
          name: release-windows-${{ matrix.target-arch }}-${{ matrix.machine-type }}-standalone-${{ matrix.memory-size }}mb
          path: ${{ steps.package.outputs.archive-path }}
          overwrite: true

  # Publish a versioned release to GitHub.
  publish-release:
    name: "Publish Release"
    needs: [release-archive, windows-release-archive]
    # NOTE: !cancelled() — see comment on 'checks' job (actions/runner#2205).
    if: |
      !cancelled() &&
      github.repository == 'nanvix/nanvix' &&
      github.ref == 'refs/heads/dev' &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') &&
      needs.release-archive.result == 'success' &&
      needs.windows-release-archive.result == 'success'
    runs-on:
      group: Test
      labels: [self-hosted, Linux]
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - name: "Isolate Cargo Home"
        shell: bash
        run: |
          # Isolate Cargo home per job to prevent concurrent git-cache races on
          # self-hosted runners that share the same filesystem.  Symlink the
          # toolchain bin/ directory so that the Makefile can still resolve
          # $CARGO_HOME/bin/cargo.
          mkdir -p "$RUNNER_TEMP/.cargo"
          ln -sfn "$HOME/.cargo/bin" "$RUNNER_TEMP/.cargo/bin"
          echo "CARGO_HOME=$RUNNER_TEMP/.cargo" >> "$GITHUB_ENV"

      - name: "Publish Release"
        uses: ./.github/actions/publish-release
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

  # Open a GitHub issue when any job in the release pipeline fails on dev.
  notify-release-failure:
    name: "Notify Release Failure"
    needs:
      [
        checks,
        lint,
        verify,
        ci-build,
        ci-test,
        ci-l2,
        benchmark,
        benchmark-finalize,
        benchmark-ci,
        benchmark-ci-finalize,
        windows-benchmark,
        windows-benchmark-finalize,
        windows-benchmark-ci,
        windows-benchmark-ci-finalize,
        release-archive,
        windows-release-archive,
        publish-release,
        windows-format-check,
        windows-lint-check,
        windows-verify,
        windows-ci-build,
        windows-integration-test,
      ]
    if: |
      always() &&
      github.repository == 'nanvix/nanvix' &&
      github.ref == 'refs/heads/dev' &&
      (
        contains(needs.*.result, 'failure') ||
        (
          (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') &&
          (
            needs.release-archive.result == 'skipped' ||
            needs.windows-release-archive.result == 'skipped' ||
            needs.publish-release.result == 'skipped'
          )
        )
      )
    runs-on: ubuntu-24.04
    permissions:
      issues: write
      contents: read

    steps:
      - name: "Collect Failed or Skipped Jobs"
        id: failed
        shell: bash
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          failed_jobs=$(echo "${NEEDS_JSON}" | jq -r '[to_entries[] | select(.value.result == "failure") | .key] | join(", ")')
          skipped_jobs=$(echo "${NEEDS_JSON}" | jq -r '[to_entries[] | select(.key == "release-archive" or .key == "windows-release-archive" or .key == "publish-release") | select(.value.result == "skipped") | .key] | join(", ")')
          echo "failed=${failed_jobs}" >> "${GITHUB_OUTPUT}"
          echo "skipped=${skipped_jobs}" >> "${GITHUB_OUTPUT}"

      - name: "Create Issue"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --repo "${GITHUB_REPOSITORY}" \
            --title "CI/CD pipeline failure on dev (Run #${{ github.run_number }})" \
            --label "devops:ci" \
            --assignee "ppenna" \
            --body "## CI/CD Release Pipeline Failure

          The CI/CD pipeline failed on \`dev\` (event: \`${{ github.event_name }}\`).

          **Run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          **Commit:** [\`${GITHUB_SHA::8}\`](${{ github.server_url }}/${{ github.repository }}/commit/${GITHUB_SHA})
          **Triggered by:** @${{ github.actor }}
          **Failed jobs:** ${{ steps.failed.outputs.failed }}
          **Skipped jobs:** ${{ steps.failed.outputs.skipped }}

          Please investigate the failed and skipped jobs linked above and resolve the issue."

  # Bump the patch version on every merge to dev.
  # This job runs independently of the CI pipeline because the pipeline skips
  # merge commits while this job specifically targets them.
  # Artifact publishing is handled separately by the schedule-triggered jobs.
  create-minor-release:
    name: "Create Minor Release"
    # Only run on push-to-dev merge commits.
    # Guard against infinite loops by excluding github-actions[bot] commits.
    if: >-
      github.event_name == 'push' &&
      github.actor != 'github-actions[bot]' &&
      github.event.head_commit.author.username != 'github-actions[bot]' &&
      github.event.head_commit.committer.username != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v6
        with:
          ssh-key: ${{ secrets.DEPLOY_PRIVATE_SSH_KEY }}
          fetch-depth: 0

      - name: "Create Minor Release"
        uses: ./.github/actions/create-minor-release
