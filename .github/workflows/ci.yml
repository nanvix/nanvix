name: "Nanvix CI/CD"

on:
  workflow_dispatch:

  pull_request:
    types:
      - 'opened'
      - 'synchronize'
      - 'reopened'
      - 'ready_for_review'
    branches:
      - 'dev'

  push:
    branches:
      - 'dev'

# Cancel previous running actions for the same PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/dev' }}

env:
  SCCACHE: "/usr/local/bin/sccache"

jobs:

  # ==========================================================================================
  # Pre-check
  # ==========================================================================================

  precheck:
    uses: nanvix/nanvix/.github/workflows/branch-up-to-date.yml@dev
    secrets: inherit

  # ==========================================================================================
  # Stage 1: Build and Verify (GitHub-Hosted Runners)
  # ==========================================================================================

  # Run config-independent source checks once (format, spellcheck) instead of
  # repeating them in every matrix entry. The CI job waits for these to pass.
  checks:
    name: "Source Checks"
    needs: precheck
    timeout-minutes: 60
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    # Only run the CI for:
    # - Non-merge pushes to 'dev'.
    # - Non-draft PRs.
    if: |
      github.repository == 'nanvix/nanvix' &&
      needs.precheck.outputs.up_to_date == 'true' && (
        github.event_name != 'push' ||
        github.event.head_commit == null ||
        !startsWith(github.event.head_commit.message, 'Merge ')
      ) && (
        github.event_name != 'pull_request' ||
        !github.event.pull_request.draft
      )

    steps:
    - uses: actions/checkout@v6

    - name: "Setup"
      uses: ./.github/actions/docker-setup

    # The docker-check action's default parameters (machine-type, deployment-type,
    # etc.) are passed through to make but are ignored by config-independent
    # targets like format-check and spellcheck.
    - name: "Check Code Format"
      uses: ./.github/actions/docker-check
      with:
        target: 'format-check'

    - name: "Spellcheck"
      uses: ./.github/actions/docker-check
      with:
        target: 'spellcheck'

  # CI matrix: lint, build, and unit tests for Docker-compatible configurations.
  # L2 builds require .git (for generate-l2-initramfs.sh) which is unavailable
  # inside Docker, so they run on self-hosted runners in the ci-l2 job below.
  ci-build:
    name: "Build (${{ matrix.build-type }}, ${{ matrix.machine-type }}, ${{ matrix.deployment-type }})"
    needs: [precheck, checks]
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        build-type: [debug, release]
        machine-type: [qemu-pc, microvm, hyperlight]
        deployment-type: [single-process, multi-process]
        exclude:
          - machine-type: qemu-pc
            deployment-type: single-process
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    if: |
      github.repository == 'nanvix/nanvix' &&
      needs.precheck.outputs.up_to_date == 'true' && (
        github.event_name != 'push' ||
        github.event.head_commit == null ||
        !startsWith(github.event.head_commit.message, 'Merge ')
      ) && (
        github.event_name != 'pull_request' ||
        !github.event.pull_request.draft
      )

    steps:
    - uses: actions/checkout@v6

    - name: "Setup"
      uses: ./.github/actions/docker-setup

    - name: "Lint"
      uses: ./.github/actions/docker-check
      with:
        target: 'lint-check'
        release: '${{ matrix.build-type }}'
        log-level: 'trace'
        machine-type: '${{ matrix.machine-type }}'
        deployment-type: '${{ matrix.deployment-type }}'

    - name: "Build & Unit Test"
      uses: ./.github/actions/docker-build
      with:
        release: '${{ matrix.build-type }}'
        log-level: 'trace'
        machine-type: '${{ matrix.machine-type }}'
        deployment-type: '${{ matrix.deployment-type }}'

    - name: "Upload Build Artifacts"
      uses: actions/upload-artifact@v6
      with:
        name: ci-build-${{ matrix.build-type }}-${{ matrix.machine-type }}-${{ matrix.deployment-type }}
        overwrite: true
        retention-days: 1
        path: |
          bin/
          images/
          lib/
          test/
          sysroot-debug/
          sysroot-release/
          sysroot

    - name: "Upload logs in case of failures"
      if: failure()
      uses: actions/upload-artifact@v6
      with:
        name: nanvix-ci-logs-${{ github.event.pull_request.number || github.run_number }}-${{ matrix.build-type }}-${{ matrix.machine-type }}-${{ matrix.deployment-type }}
        overwrite: 'true'
        path: |
          logs/
          **/*.log
          **/*.out
          **/*.err

  # ==========================================================================================
  # Stage 2: Integration Test and Benchmark (Self-Hosted Runners)
  # ==========================================================================================

  # Download build artifacts and run integration tests on self-hosted runners.
  # L2 configurations are handled by the ci-l2 job which builds from source.
  integration-test:
    name: "Test (${{ matrix.build-type }}, ${{ matrix.machine-type }}, ${{ matrix.deployment-type }})"
    needs: ci-build
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        build-type: [debug, release]
        machine-type: [qemu-pc, microvm, hyperlight]
        deployment-type: [single-process, multi-process]
        exclude:
          - machine-type: qemu-pc
            deployment-type: single-process
    runs-on: [self-hosted, Linux, X64]
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v6

    - name: "Pre-Cleanup Dangling Resources"
      uses: ./.github/actions/cleanup
      with:
        phase: pre

    - name: "Download Build Artifacts"
      uses: actions/download-artifact@v7
      with:
        name: ci-build-${{ matrix.build-type }}-${{ matrix.machine-type }}-${{ matrix.deployment-type }}
        path: .

    - name: "Make binaries executable"
      shell: bash
      run: chmod +x bin/*.elf 2>/dev/null || true

    - name: "Recreate sysroot symlink"
      if: matrix.machine-type == 'microvm' || matrix.machine-type == 'hyperlight'
      shell: bash
      run: |
        # The sysroot symlink created during build uses an absolute path that
        # is invalid on the self-hosted runner. Recreate it with a relative path.
        rm -f sysroot
        ln -sfn "sysroot-${{ matrix.build-type }}" sysroot

    # For microvm/hyperlight: run test binary directly from downloaded artifacts.
    - name: "Integration Test (microvm/hyperlight)"
      if: matrix.machine-type == 'microvm' || matrix.machine-type == 'hyperlight'
      shell: bash
      env:
        RUST_LOG: info
      run: |
        set -Eeuo pipefail

        # Determine test config based on deployment type.
        case "${{ matrix.deployment-type }}" in
          single-process) TEST_CONFIG="test/test-single_process.toml" ;;
          multi-process)  TEST_CONFIG="test/test-multi_process.toml" ;;
          l2)             TEST_CONFIG="test/test-l2.toml" ;;
          *)
            echo "::error::Unknown deployment type: ${{ matrix.deployment-type }}"
            exit 1
            ;;
        esac

        echo "Running: ./bin/nanvix-test.elf ${TEST_CONFIG}"
        ./bin/nanvix-test.elf "${TEST_CONFIG}"

    # For qemu-pc: use z utility to run the system via QEMU and check for magic string.
    - name: "Link Toolchain Directory"
      if: matrix.machine-type == 'qemu-pc'
      shell: bash
      run: ln -sfn "${HOME}/toolchain" toolchain

    - name: "Integration Test (qemu-pc)"
      if: matrix.machine-type == 'qemu-pc'
      shell: bash
      env:
        RELEASE_FLAG: ${{ matrix.build-type == 'release' && 'RELEASE=yes' || '' }}
      run: |
        set -Euo pipefail

        MAGIC_STRING="hello, world!"
        TIMEOUT=600

        single_process="no"
        if [[ "${{ matrix.deployment-type }}" == "single-process" ]]; then
          single_process="yes"
        fi

        rm -f run-stdout.log
        touch run-stdout.log

        # Start the system in the background and tee output to a log file.
        ./z build \
          --toolchain-dir "$HOME/toolchain" \
          -- \
          run \
          MACHINE=qemu-pc \
          TARGET=x86 \
          LOG_LEVEL=trace \
          VERBOSE=yes \
          ${RELEASE_FLAG} \
          "SINGLE_PROCESS=${single_process}" \
          > >(tee run-stdout.log) 2>&1 &
        CMD_PID=$!

        # Monitor stdout for the magic string with a timeout.
        elapsed=0
        while [ "${elapsed}" -lt "${TIMEOUT}" ]; do
          if grep -q "${MAGIC_STRING}" run-stdout.log 2>/dev/null; then
            echo "Magic string found. Sending SIGINT to terminate QEMU."
            kill -INT "${CMD_PID}" 2>/dev/null || true
            wait "${CMD_PID}" 2>/dev/null || true
            echo "Integration test passed."
            exit 0
          fi

          # Check if the process has already exited.
          if ! kill -0 "${CMD_PID}" 2>/dev/null; then
            break
          fi

          sleep 1
          elapsed=$((elapsed + 1))
        done

        # Timeout or process exited without the magic string.
        kill -INT "${CMD_PID}" 2>/dev/null || true
        wait "${CMD_PID}" 2>/dev/null || true

        echo "::error::Integration test failed: magic string '${MAGIC_STRING}' not found within ${TIMEOUT}s."
        exit 1

    - name: "Post-Cleanup Dangling Resources"
      if: always()
      uses: ./.github/actions/cleanup
      with:
        phase: post

    - name: "Upload logs in case of failures"
      if: failure()
      uses: actions/upload-artifact@v6
      with:
        name: nanvix-integration-logs-${{ github.event.pull_request.number || github.run_number }}-${{ matrix.build-type }}-${{ matrix.machine-type }}-${{ matrix.deployment-type }}
        overwrite: 'true'
        path: |
          logs/
          **/*.log
          **/*.out
          **/*.err

  # L2 configurations require .git for generate-l2-initramfs.sh, so they build
  # from source on self-hosted runners with a local toolchain.
  ci-l2:
    name: "L2 (${{ matrix.build-type }}, ${{ matrix.machine-type }})"
    needs: [precheck, checks]
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        build-type: [debug, release]
        machine-type: [microvm, hyperlight]
    runs-on: [self-hosted, Linux, X64]
    permissions:
      contents: read

    if: |
      github.repository == 'nanvix/nanvix' &&
      needs.precheck.outputs.up_to_date == 'true' && (
        github.event_name != 'push' ||
        github.event.head_commit == null ||
        !startsWith(github.event.head_commit.message, 'Merge ')
      ) && (
        github.event_name != 'pull_request' ||
        !github.event.pull_request.draft
      )

    steps:
    - uses: actions/checkout@v6

    - name: "Pre-Cleanup Dangling Resources"
      uses: ./.github/actions/cleanup
      with:
        phase: pre

    - name: "Link Toolchain Directory"
      shell: bash
      run: ln -sfn "${HOME}/toolchain" toolchain

    - name: "Lint"
      uses: ./.github/actions/lint
      with:
        release: '${{ matrix.build-type }}'
        log-level: 'trace'
        machine-type: '${{ matrix.machine-type }}'
        deployment-type: 'l2'

    - name: "Build"
      uses: ./.github/actions/build
      with:
        release: '${{ matrix.build-type }}'
        log-level: 'trace'
        machine-type: '${{ matrix.machine-type }}'
        deployment-type: 'l2'

    - name: "Test"
      uses: ./.github/actions/test
      with:
        release: '${{ matrix.build-type }}'
        log-level: 'trace'
        machine-type: '${{ matrix.machine-type }}'
        deployment-type: 'l2'

    - name: "Collect L2 diagnostics"
      if: failure()
      shell: bash
      run: |
        set -Eeuo pipefail

        snapshot_path="${GITHUB_WORKSPACE}/images/l2-sysvm-snapshot"
        log_root="${GITHUB_WORKSPACE}/logs"

        echo '::group::L2 snapshot metadata'
        if [[ -e "${snapshot_path}" ]]; then
          ls -al "${snapshot_path}"
          sha256sum "${snapshot_path}" || true
          file "${snapshot_path}" || true
        else
          echo "Snapshot not found at ${snapshot_path}."
        fi
        echo '::endgroup::'

        echo '::group::Cloud Hypervisor stderr logs'
        shopt -s nullglob globstar
        clh_logs=("${log_root}"/**/cloud-hypervisor-stderr.log)
        if [[ ${#clh_logs[@]} -eq 0 ]]; then
          echo "No cloud-hypervisor stderr logs found under ${log_root}."
        else
          for log_path in "${clh_logs[@]}"; do
            echo "--- ${log_path} ---"
            tail -n 400 "${log_path}" || true
          done
        fi
        echo '::endgroup::'

        echo '::group::Kernel console logs'
        console_logs=("${log_root}"/**/kernel_*.log)
        if [[ ${#console_logs[@]} -eq 0 ]]; then
          echo "No kernel console logs found under ${log_root}."
        else
          for log_path in "${console_logs[@]}"; do
            echo "--- ${log_path} ---"
            tail -n 200 "${log_path}" || true
          done
        fi
        echo '::endgroup::'

        echo '::group::/tmp namespace overview'
        sudo ls -al /tmp || true
        sudo find /tmp -maxdepth 1 -name 'nvx*' -print || true
        sudo find /tmp -maxdepth 2 -name 'nanvixd-clh.*' -print || true
        echo '::endgroup::'

    - name: "Post-Cleanup Dangling Resources"
      if: always()
      uses: ./.github/actions/cleanup
      with:
        phase: post

    - name: "Upload logs in case of failures"
      if: failure()
      uses: actions/upload-artifact@v6
      with:
        name: nanvix-l2-logs-${{ github.event.pull_request.number || github.run_number }}-${{ matrix.build-type }}-${{ matrix.machine-type }}
        overwrite: 'true'
        path: |
          logs/
          **/*.log
          **/*.out
          **/*.err

  # Build from source and run micro-benchmarks on baremetal self-hosted runners.
  # Benchmarks require L2_VM=yes which needs .git, so they cannot use Docker builds.
  benchmark:
    name: "Benchmark"
    needs: [precheck, checks]
    timeout-minutes: 240
    runs-on: [self-hosted, Linux, X64, baremetal]
    permissions:
      contents: read
      pull-requests: write
      issues: write

    if: |
      github.repository == 'nanvix/nanvix' &&
      needs.precheck.outputs.up_to_date == 'true' && (
        github.event_name != 'push' ||
        github.event.head_commit == null ||
        !startsWith(github.event.head_commit.message, 'Merge ')
      ) && (
        github.event_name != 'pull_request' ||
        !github.event.pull_request.draft
      )

    steps:
    - uses: actions/checkout@v6

    - name: "Pre-Cleanup Dangling Resources"
      uses: ./.github/actions/cleanup
      with:
        phase: pre

    - name: "Link Toolchain Directory"
      shell: bash
      run: ln -sfn "${HOME}/toolchain" toolchain

    - name: "Build (Standard)"
      shell: bash
      run: |
        ./z build \
          --toolchain-dir "$HOME/toolchain" \
          -- \
          all \
          MACHINE=microvm \
          TARGET=x86 \
          LOG_LEVEL=panic \
          VERBOSE=yes \
          RELEASE=yes \
          ${SCCACHE:+"SCCACHE=${SCCACHE}"} \
          L2_VM=yes

    - name: "Run Micro-Benchmarks (Standard)"
      shell: bash
      run: |
        benchmarks=(
          boot-time
          cold-start
          cold-start-l2
          cold-start-uvm
          concurrent
          concurrent-l2
          round-trip-latency
          warm-start
          warm-start-l2
          warm-start-vmm
        )

        for bench in "${benchmarks[@]}"; do
          # FIXME(1171): the current L2 deployment involves a very slow network
          # namespace creation, particularly at high-churn, so we must temporarily
          # reduce the number of iterations of the benchmarks.
          python3 ./scripts/benchmark.py \
            run \
            --benchmark "${bench}" \
            --machine-type microvm \
            --hwloc "$HOME/hwloc.json" \
            --iterations 100 \
            --toolchain-bin-dir "$HOME/toolchain/bin" \
            --output-dir "$(pwd)"
        done

    - name: "Build (Echo-Breakdown)"
      shell: bash
      run: |
        ./z build \
          --toolchain-dir "$HOME/toolchain" \
          -- \
          all \
          MACHINE=microvm \
          TARGET=x86 \
          LOG_LEVEL=panic \
          VERBOSE=yes \
          RELEASE=yes \
          ${SCCACHE:+"SCCACHE=${SCCACHE}"} \
          L2_VM=yes \
          TIMESTAMP_MSG=yes

    - name: "Run Echo-Breakdown Benchmarks"
      shell: bash
      run: |
        benchmarks=(echo-breakdown echo-breakdown-l2)

        for bench in "${benchmarks[@]}"; do
          python3 ./scripts/benchmark.py \
            run \
            --benchmark "${bench}" \
            --machine-type microvm \
            --hwloc "$HOME/hwloc.json" \
            --iterations 1000 \
            --toolchain-bin-dir "$HOME/toolchain/bin" \
            --output-dir "$(pwd)"
        done

    - name: "Format benchmark results"
      id: format
      shell: bash
      run: |
        python3 ./scripts/benchmark.py \
          ci-summary \
          --dev-dir "$HOME/ubench-results-dev" \
          --target-dir "$(pwd)" \
          --benchmarks boot-time,cold-start,cold-start-l2,cold-start-uvm,concurrent,concurrent-l2,echo-breakdown,echo-breakdown-l2,round-trip-latency,warm-start,warm-start-l2,warm-start-vmm \
          --machine-types microvm \
          --archs X64 \
          --output-file /tmp/comment.txt

        echo "BENCHMARK_RESULT<<EOF" >> "$GITHUB_OUTPUT"
        cat /tmp/comment.txt >> "$GITHUB_OUTPUT"
        echo "EOF" >> "$GITHUB_OUTPUT"

    - name: "Get PR number"
      if: ${{ github.event_name == 'pull_request' || github.event_name == 'pull_request_target' }}
      id: pr
      shell: bash
      run: |
        PR_NUM="${{ github.event.pull_request.number }}"
        echo "pr_number=$PR_NUM" >> "$GITHUB_OUTPUT"

    - name: "Determine PR comment strategy"
      if: ${{ (github.event_name == 'pull_request' || github.event_name == 'pull_request_target') && steps.pr.outputs.pr_number != '' }}
      id: comment-strategy
      shell: bash
      run: |
        origin_repo="${{ github.repository }}"
        head_repo="${{ github.event.pull_request.head.repo.full_name }}"

        if [[ "${head_repo}" == "${origin_repo}" ]]; then
          echo "can_comment_directly=true" >> "$GITHUB_OUTPUT"
          echo "needs_deferred_comment=false" >> "$GITHUB_OUTPUT"
        else
          echo "can_comment_directly=false" >> "$GITHUB_OUTPUT"
          echo "needs_deferred_comment=true" >> "$GITHUB_OUTPUT"
        fi

    - name: "Find benchmark results comment if it exists"
      uses: peter-evans/find-comment@v3
      if: ${{ (github.event_name == 'pull_request' || github.event_name == 'pull_request_target') && steps.pr.outputs.pr_number != '' && steps.comment-strategy.outputs.can_comment_directly == 'true' }}
      id: fc
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        issue-number: ${{ steps.pr.outputs.pr_number }}
        comment-author: "github-actions[bot]"
        body-includes: "🔬 Benchmark Results"

    - name: "Post comment to PR (Create)"
      if: ${{ (github.event_name == 'pull_request' || github.event_name == 'pull_request_target') && steps.pr.outputs.pr_number != '' && steps.comment-strategy.outputs.can_comment_directly == 'true' && steps.fc.outputs.comment-id == '' }}
      uses: peter-evans/create-or-update-comment@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        issue-number: ${{ steps.pr.outputs.pr_number }}
        body: |
          ## 🔬 Benchmark Results
          ${{ steps.format.outputs.BENCHMARK_RESULT }}

    - name: "Post comment to PR (Update)"
      if: ${{ (github.event_name == 'pull_request' || github.event_name == 'pull_request_target') && steps.comment-strategy.outputs.can_comment_directly == 'true' && steps.fc.outputs.comment-id != '' }}
      uses: peter-evans/create-or-update-comment@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        comment-id: ${{ steps.fc.outputs.comment-id }}
        edit-mode: replace
        body: |
          ## 🔬 Benchmark Results
          ${{ steps.format.outputs.BENCHMARK_RESULT }}

    - name: "Prepare benchmark comment payload"
      if: ${{ (github.event_name == 'pull_request' || github.event_name == 'pull_request_target') && steps.pr.outputs.pr_number != '' }}
      id: benchmark-comment-payload
      shell: bash
      env:
        BENCHMARK_RESULT: ${{ steps.format.outputs.BENCHMARK_RESULT }}
        NEEDS_DEFERRED: ${{ steps.comment-strategy.outputs.needs_deferred_comment || 'false' }}
      run: |
        mkdir -p comment-payload

        {
          printf '## 🔬 Benchmark Results\n'
          printf '%s\n' "${BENCHMARK_RESULT}"
        } > comment-payload/body.md

        if [[ "${NEEDS_DEFERRED}" == "true" ]]; then
          needs_comment=true
        else
          needs_comment=false
        fi

        cat <<EOF > comment-payload/metadata.json
        {
          "pr_number": "${{ steps.pr.outputs.pr_number }}",
          "needs_comment": ${needs_comment},
          "workflow_run_id": "${{ github.run_id }}"
        }
        EOF

    - name: "Upload benchmark comment payload"
      if: ${{ (github.event_name == 'pull_request' || github.event_name == 'pull_request_target') && steps.pr.outputs.pr_number != '' }}
      uses: actions/upload-artifact@v4
      with:
        name: benchmark-comment-${{ github.run_id }}
        path: comment-payload
        retention-days: 7

    - name: "Persist results on dev"
      if: github.ref_name == 'dev'
      shell: bash
      run: |
        target_dir="$HOME/ubench-results-dev"
        mkdir -p "${target_dir}"

        python3 ./scripts/benchmark.py \
          copy-results \
          --benchmarks boot-time,cold-start,cold-start-l2,cold-start-uvm,concurrent,concurrent-l2,echo-breakdown,echo-breakdown-l2,round-trip-latency,warm-start,warm-start-l2,warm-start-vmm \
          --machine-types microvm \
          --archs X64 \
          --source-dir "$(pwd)" \
          --target-dir "${target_dir}"

    - name: "Dump SCCACHE Statistics"
      if: always()
      shell: bash
      run: |
        if [[ -n "${SCCACHE}" ]] && [[ -x "${SCCACHE}" ]]; then
          echo "SCCACHE Statistics:"
          "${SCCACHE}" --show-stats || echo "Failed to retrieve sccache statistics"
        else
          echo "SCCACHE not configured or not available"
        fi

    - name: "Post-Cleanup Dangling Resources"
      if: always()
      uses: ./.github/actions/cleanup
      with:
        phase: post

    - name: "Upload logs in case of benchmark failures"
      if: failure()
      uses: actions/upload-artifact@v6
      with:
        name: nanvix-benchmark-logs-${{ github.event.pull_request.number || github.run_number }}
        overwrite: 'true'
        path: |
          logs/
          **/*.log
          **/*.out
          **/*.err
          bench_*.txt

  # ==========================================================================================
  # Stage 3: Post Actions (Conditional)
  # ==========================================================================================

  # Create release archives for all applicable configurations.
  release-archive:
    name: "Release Archive (${{ matrix.machine-type }}, ${{ matrix.deployment-type }})"
    needs: [integration-test, ci-l2]
    if: |
      github.repository == 'nanvix/nanvix' &&
      github.ref == 'refs/heads/dev' &&
      needs.integration-test.result == 'success' &&
      needs.ci-l2.result == 'success'
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        machine-type: [qemu-pc, microvm, hyperlight]
        deployment-type: [single-process, multi-process]
        exclude:
          - machine-type: qemu-pc
            deployment-type: single-process
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v6

    - name: "Setup"
      uses: ./.github/actions/docker-setup

    - id: release-archive
      name: "Build Release Archive"
      shell: bash
      run: |
        single_process="no"
        if [[ "${{ matrix.deployment-type }}" == "single-process" ]]; then
          single_process="yes"
        fi

        ./z build --with-minimal-docker -- release \
          "MACHINE=${{ matrix.machine-type }}" \
          TARGET=x86 \
          RELEASE=yes \
          LOG_LEVEL=error \
          "SINGLE_PROCESS=${single_process}" \
          VERBOSE=yes \
          BUILD_OPT=yes

        archive_path=$(ls -1t nanvix-*.tar.bz2 2>/dev/null | head -n 1)
        if [[ -z "${archive_path}" ]]; then
          echo "::error::No release archive found."
          exit 1
        fi

        machine="${{ matrix.machine-type }}"
        deployment="${{ matrix.deployment-type }}"
        commit_id="${GITHUB_SHA}"

        archive_name="nanvix-${machine}-${deployment}-release-${commit_id}.tar.bz2"
        mv "${archive_path}" "${archive_name}"

        echo "archive-path=${archive_name}" >> "${GITHUB_OUTPUT}"

    - name: "Upload Release Artifact"
      uses: actions/upload-artifact@v6
      with:
        name: release-${{ matrix.machine-type }}-${{ matrix.deployment-type }}
        path: ${{ steps.release-archive.outputs.archive-path }}
        overwrite: true

  # Publish the latest release to GitHub.
  publish-latest:
    name: "Publish Latest Release"
    needs: release-archive
    if: |
      github.repository == 'nanvix/nanvix' &&
      github.ref == 'refs/heads/dev' &&
      needs.release-archive.result == 'success'
    runs-on: [self-hosted, Linux, X64]
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v6

    - name: "Extract Version"
      id: version
      run: |
        version=$(grep -m 1 '^version = ' Cargo.toml | sed 's/version = "\(.*\)"/\1/')
        if [ -z "${version}" ]; then
          echo "Warning: Failed to extract version from Cargo.toml, using fallback"
          version="?.?.?"
        fi
        echo "version=${version}" >> "${GITHUB_OUTPUT}"
      shell: bash

    - name: "Download release artifacts"
      uses: actions/download-artifact@v7
      with:
        pattern: release-*
        path: release-artifacts

    - name: "Reset Latest Release"
      uses: actions/github-script@v8
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        script: |
          const tag = 'latest';
          const owner = context.repo.owner;
          const repo = context.repo.repo;

          async function deleteReleaseByTag() {
            try {
              const { data } = await github.rest.repos.getReleaseByTag({ owner, repo, tag });
              core.info(`Deleting release ${data.id} (${tag}).`);
              await github.rest.repos.deleteRelease({ owner, repo, release_id: data.id });
            } catch (error) {
              if (error.status === 404) {
                core.info('No existing latest release to delete.');
                return;
              }
              throw error;
            }
          }

          async function deleteTagRef() {
            try {
              await github.rest.git.deleteRef({ owner, repo, ref: `tags/${tag}` });
              core.info('Deleted refs/tags/latest tag.');
            } catch (error) {
              if (error.status === 404) {
                core.info('Tag refs/tags/latest not found; nothing to delete.');
                return;
              }
              throw error;
            }
          }

          await deleteReleaseByTag();
          await deleteTagRef();

    - name: "Update Latest Release"
      uses: ncipollo/release-action@v1
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        tag: latest
        name: Nanvix ${{ steps.version.outputs.version }}
        draft: false
        prerelease: false
        allowUpdates: false
        makeLatest: true
        removeArtifacts: true
        artifacts: release-artifacts/**/*.tar.bz2
        artifactContentType: application/x-bzip2
        body: Automated release for Nanvix ${{ steps.version.outputs.version }}.

    - name: "Trigger Nanvix Release Dispatch"
      env:
        DISPATCH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
      run: |
        if [[ -z "${DISPATCH_TOKEN}" ]]; then
          echo "::warning::DISPATCH_TOKEN secret is not configured; skipping release dispatch."
          exit 0
        fi

        repos=("cpython" "openblas" "openssl" "quickjs" "rusty_v8" "sqlite" "zlib")
        failed=0

        for repo in "${repos[@]}"; do
          API_URL="https://api.github.com/repos/nanvix/${repo}/dispatches"
          PAYLOAD=$(cat <<JSON
        {
          "event_type": "nanvix-minor-release",
          "client_payload": {
            "source_repo": "nanvix/nanvix",
            "ref": "${GITHUB_REF}",
            "sha": "${GITHUB_SHA}",
            "component": "${repo}",
            "reason": "sync build from nanvix/nanvix"
          }
        }
        JSON
        )

          http_response=$(curl -sS -o /dev/null -w "%{http_code}" -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${DISPATCH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$API_URL" \
            -d "${PAYLOAD}")

          if [[ "${http_response}" -ge 200 && "${http_response}" -lt 300 ]]; then
            echo "Dispatched nanvix-release event to nanvix/${repo} (HTTP ${http_response})."
          else
            echo "::error::Failed to dispatch nanvix-release event to nanvix/${repo} (HTTP ${http_response})."
            failed=1
          fi
        done

        if [[ "${failed}" -eq 1 ]]; then
          exit 1
        fi
      shell: bash
