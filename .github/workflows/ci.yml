name: "Nanvix CI/CD"

on:
  workflow_dispatch:

  pull_request:
    types:
      - "opened"
      - "synchronize"
      - "reopened"
      - "ready_for_review"
    branches:
      - "dev"

  merge_group:
    types:
      - "checks_requested"

  push:
    branches:
      - "dev"

# Cancel previous running actions for the same PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/dev' }}

env:
  SCCACHE: "/usr/local/bin/sccache"

jobs:
  # ==========================================================================================
  # Pre-check
  # ==========================================================================================

  precheck:
    # The merge queue already ensures the branch is up-to-date, so skip this
    # check for merge_group events to avoid false negatives from the merge
    # commit detection in the reusable workflow.
    if: github.event_name != 'merge_group'
    uses: nanvix/nanvix/.github/workflows/branch-up-to-date.yml@dev
    secrets: inherit

  # ==========================================================================================
  # Stage 1: Source Checks (GitHub-Hosted Runners)
  # ==========================================================================================

  # Run config-independent source checks once (format, spellcheck) instead of
  # repeating them in every matrix entry. Downstream jobs (ci-build, ci-l2)
  # wait for these to pass.
  checks:
    name: "Source Checks"
    needs: precheck
    timeout-minutes: 60
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    # Only run the CI for:
    # - Merge queue validation runs.
    # - Non-merge pushes to 'dev'.
    # - Non-draft PRs.
    if: |
      github.repository == 'nanvix/nanvix' && (
        github.event_name == 'merge_group' || (
          needs.precheck.outputs.up_to_date == 'true' && (
            github.event_name != 'push' ||
            github.event.head_commit == null ||
            !startsWith(github.event.head_commit.message, 'Merge ')
          ) && (
            github.event_name != 'pull_request' ||
            !github.event.pull_request.draft
          )
        )
      )

    steps:
      - uses: actions/checkout@v6

      - name: "Setup"
        uses: ./.github/actions/docker-setup

      # The docker-check action's default parameters (machine-type, deployment-type,
      # etc.) are passed through to make but are ignored by config-independent
      # targets like format-check and spellcheck.
      - name: "Check Code Format"
        uses: ./.github/actions/docker-check
        with:
          target: "format-check"

      - name: "Spellcheck"
        uses: ./.github/actions/docker-check
        with:
          target: "spellcheck"

  # ==========================================================================================
  # Stage 1 (parallel): Config-Dependent Source Checks (GitHub-Hosted Runners)
  # ==========================================================================================

  # Lint and verify run in parallel with config-independent checks (format,
  # spellcheck) since they are independent source checks that only need
  # precheck. ci-build waits for all of them (checks + lint + verify) to pass.
  #
  # Lint is config-dependent (features differ per machine-type + deployment-type)
  # but does NOT depend on build-type (debug vs release). Run lint once per
  # unique (machine-type, deployment-type) pair (6 jobs) instead of once per
  # build matrix entry (12 jobs).
  lint:
    name: "Lint (${{ matrix.machine-type }}, ${{ matrix.deployment-type }})"
    needs: [precheck]
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        machine-type: [microvm, hyperlight]
        deployment-type: [standalone, single-process, multi-process]
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    if: |
      github.repository == 'nanvix/nanvix' && (
        github.event_name == 'merge_group' || (
          needs.precheck.outputs.up_to_date == 'true' && (
            github.event_name != 'push' ||
            github.event.head_commit == null ||
            !startsWith(github.event.head_commit.message, 'Merge ')
          ) && (
            github.event_name != 'pull_request' ||
            !github.event.pull_request.draft
          )
        )
      )

    steps:
      - uses: actions/checkout@v6

      - name: "Setup"
        uses: ./.github/actions/docker-setup

      - name: "Lint"
        uses: ./.github/actions/docker-check
        with:
          target: "lint-check"
          release: "debug"
          log-level: "trace"
          machine-type: "${{ matrix.machine-type }}"
          deployment-type: "${{ matrix.deployment-type }}"

  # Verus formal verification is config-dependent (kernel cargo flags vary per
  # machine-type + deployment-type) and runs once per unique pair, like lint.
  verify:
    name: "Verify (${{ matrix.machine-type }}, ${{ matrix.deployment-type }})"
    needs: [precheck]
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        machine-type: [microvm, hyperlight]
        deployment-type: [standalone, single-process, multi-process]
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    if: |
      github.repository == 'nanvix/nanvix' && (
        github.event_name == 'merge_group' || (
          needs.precheck.outputs.up_to_date == 'true' && (
            github.event_name != 'push' ||
            github.event.head_commit == null ||
            !startsWith(github.event.head_commit.message, 'Merge ')
          ) && (
            github.event_name != 'pull_request' ||
            !github.event.pull_request.draft
          )
        )
      )

    steps:
      - uses: actions/checkout@v6

      - name: "Setup"
        uses: ./.github/actions/docker-setup

      # Cache the Verus release archive so that verify jobs do not need to
      # re-download it on every run. The cache is keyed on the pinned Verus
      # version; a version bump automatically causes a single fresh download.
      - name: "Resolve Verus Version"
        id: verus-version
        shell: bash
        run: echo "version=$(tr -d '[:space:]' < build/verus-version)" >> "$GITHUB_OUTPUT"

      - name: "Restore Verus Archive Cache"
        id: verus-cache
        uses: actions/cache/restore@v5
        with:
          path: .verus-cache
          key: verus-${{ steps.verus-version.outputs.version }}

      - name: "Pre-download Verus Archive"
        if: steps.verus-cache.outputs.cache-hit != 'true'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/setup/verus.sh --download-only

      - name: "Verify"
        uses: ./.github/actions/docker-check
        with:
          target: "verify"
          release: "debug"
          log-level: "trace"
          machine-type: "${{ matrix.machine-type }}"
          deployment-type: "${{ matrix.deployment-type }}"

      # Save the Verus archive to the cache only when it was not already
      # cached. The first matrix leg to reach this step wins the cache
      # reservation; the rest skip gracefully.
      - name: "Save Verus Archive Cache"
        if: steps.verus-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: .verus-cache
          key: verus-${{ steps.verus-version.outputs.version }}

  # Each matrix entry builds on a GitHub-hosted runner. Integration tests run
  # in a separate ci-test job (typically on self-hosted runners) that depends
  # on the completion of the entire ci-build matrix, so tests start only after
  # all builds have finished rather than as soon as an individual build
  # completes.
  ci-build:
    name: "Build (${{ matrix.build-type }}, ${{ matrix.machine-type }}, ${{ matrix.deployment-type }}, ${{ matrix.memory-size }}mb)"
    needs: [precheck, checks, lint, verify]
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        build-type: [debug, release]
        machine-type: [microvm, hyperlight]
        deployment-type: [standalone, single-process, multi-process]
        memory-size: [128]
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    if: |
      github.repository == 'nanvix/nanvix' && (
        github.event_name == 'merge_group' || (
          needs.precheck.outputs.up_to_date == 'true' && (
            github.event_name != 'push' ||
            github.event.head_commit == null ||
            !startsWith(github.event.head_commit.message, 'Merge ')
          ) && (
            github.event_name != 'pull_request' ||
            !github.event.pull_request.draft
          )
        )
      )

    steps:
      - uses: actions/checkout@v6

      - name: "Setup"
        uses: ./.github/actions/docker-setup

      - name: "Patch memory_size in kernel config"
        shell: bash
        env:
          MEMORY_SIZE_MB: ${{ matrix.memory-size }}
        run: |
          memory_size_bytes=$(( MEMORY_SIZE_MB * 1048576 ))
          sed -i "s/^memory_size = .*/memory_size = ${memory_size_bytes}/" build/kernel_config.toml
          # Verify that exactly one memory_size line exists after patching
          matches=$(grep -c "^memory_size = " build/kernel_config.toml || true)
          if [ "${matches}" -ne 1 ]; then
            echo "Error: Expected exactly one 'memory_size' entry in build/kernel_config.toml, found ${matches}." >&2
            exit 1
          fi
          # Verify that the memory_size line has the expected value
          if ! grep -q "^memory_size = ${memory_size_bytes}$" build/kernel_config.toml; then
            echo "Error: Failed to set 'memory_size' to ${memory_size_bytes} bytes in build/kernel_config.toml." >&2
            exit 1
          fi
          echo "Set memory_size to ${memory_size_bytes} bytes (${MEMORY_SIZE_MB} MB)"

      - name: "Setup sccache"
        uses: Mozilla-Actions/sccache-action@v0.0.9
        with:
          version: "v0.10.0"

      - name: "Build & Unit Test"
        uses: ./.github/actions/docker-build
        with:
          release: "${{ matrix.build-type }}"
          # Use 'error' log level for release builds to match release archive settings,
          # enabling reuse of build artifacts and avoiding a redundant rebuild.
          log-level: ${{ matrix.build-type == 'release' && 'error' || 'trace' }}
          machine-type: "${{ matrix.machine-type }}"
          deployment-type: "${{ matrix.deployment-type }}"
          sccache-gha-enabled: "true"

      - name: "Upload Build Artifacts"
        uses: actions/upload-artifact@v7
        with:
          name: ci-build-${{ matrix.build-type }}-${{ matrix.machine-type }}-${{ matrix.deployment-type }}-${{ matrix.memory-size }}mb
          overwrite: true
          retention-days: 1
          path: |
            bin/
            images/
            lib/
            sysroot-${{ matrix.build-type }}/
            nanvix-*.tar.bz2

      - name: "Upload logs in case of failures"
        if: failure() || cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: nanvix-ci-logs-${{ github.event.pull_request.number || github.run_number }}-${{ matrix.build-type }}-${{ matrix.machine-type }}-${{ matrix.deployment-type }}-${{ matrix.memory-size }}mb
          overwrite: "true"
          path: |
            logs/
            **/*.log
            **/*.out
            **/*.err

  ci-test:
    name: "Test (${{ matrix.build-type }}, ${{ matrix.machine-type }}, ${{ matrix.deployment-type }})"
    needs: [ci-build]
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        build-type: [debug, release]
        machine-type: [microvm, hyperlight]
        deployment-type: [standalone, single-process, multi-process]
    runs-on:
      group: Test
    permissions:
      contents: read

    steps:
      - name: "Pre-Checkout Cleanup"
        shell: bash
        run: |
          # Previous runs may leave root-owned files (e.g., images/l2-sysvm-rootfs/dev)
          # that prevent actions/checkout from resetting the workspace. The cleanup
          # composite action cannot run before checkout, so perform a direct cleanup
          # of the images directory without executing any workspace scripts.
          if [[ -d "${GITHUB_WORKSPACE}/images" ]]; then
            echo "Removing images directory before checkout..."
            sudo rm -rf "${GITHUB_WORKSPACE}/images"
          fi

      - uses: actions/checkout@v6

      - name: "Isolate Cargo Home"
        shell: bash
        run: |
          # Isolate Cargo home per job to prevent concurrent git-cache races on
          # self-hosted runners that share the same filesystem.
          echo "CARGO_HOME=$RUNNER_TEMP/.cargo" >> "$GITHUB_ENV"

      - name: "Pre-Cleanup Dangling Resources"
        uses: ./.github/actions/cleanup
        with:
          phase: pre

      - name: "Prepare Test Artifacts"
        uses: ./.github/actions/prepare-test-artifacts
        with:
          build-type: "${{ matrix.build-type }}"
          machine-type: "${{ matrix.machine-type }}"
          deployment-type: "${{ matrix.deployment-type }}"

      - name: "Integration Test"
        uses: ./.github/actions/integration-test
        with:
          build-type: "${{ matrix.build-type }}"
          machine-type: "${{ matrix.machine-type }}"
          deployment-type: "${{ matrix.deployment-type }}"

      - name: "Link Toolchain"
        if: matrix.machine-type == 'microvm' || matrix.machine-type == 'hyperlight'
        uses: ./.github/actions/link-toolchain

      - name: "Shim Integration Test"
        if: matrix.machine-type == 'microvm' || matrix.machine-type == 'hyperlight'
        shell: bash
        env:
          NANVIX_DIR: ${{ github.workspace }}
        run: |
          set -Eeuo pipefail
          echo "Running shim integration tests with NANVIX_DIR=${NANVIX_DIR}"
          cargo +nanvix-x86 test --no-default-features \
            -p containerd-shim-nanvix-v1 --test integration -- --nocapture

      - name: "Post-Cleanup Dangling Resources"
        if: always()
        uses: ./.github/actions/cleanup
        with:
          phase: post

      - name: "Upload logs in case of failures"
        if: failure() || cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: nanvix-integration-logs-${{ github.event.pull_request.number || github.run_number }}-${{ matrix.build-type }}-${{ matrix.machine-type }}-${{ matrix.deployment-type }}
          overwrite: "true"
          path: |
            logs/
            **/*.log
            **/*.out
            **/*.err

  # ==========================================================================================
  # Windows CI (GitHub-Hosted Runners)
  # ==========================================================================================

  # Guest components (kernel, hello-rust-nostd) require a Linux cross-compilation
  # toolchain that is only available inside Docker. GitHub-hosted Windows runners
  # do not support Linux containers, so this job runs on ubuntu-24.04 and uploads
  # the resulting ELF binaries for downstream Windows jobs.
  windows-guest-build:
    name: "Windows Guest Build (${{ matrix.build-type }})"
    needs: [precheck]
    timeout-minutes: 60
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        build-type: [debug, release]
    permissions:
      contents: read

    if: |
      github.repository == 'nanvix/nanvix' && (
        github.event_name == 'merge_group' || (
          needs.precheck.outputs.up_to_date == 'true' && (
            github.event_name != 'push' ||
            github.event.head_commit == null ||
            !startsWith(github.event.head_commit.message, 'Merge ')
          ) && (
            github.event_name != 'pull_request' ||
            !github.event.pull_request.draft
          )
        )
      )

    steps:
      - uses: actions/checkout@v6

      - name: "Setup Docker Toolchain"
        uses: ./.github/actions/docker-setup

      - name: "Build Guest Components"
        shell: bash
        env:
          LOG_LEVEL: ${{ matrix.build-type == 'release' && 'error' || 'trace' }}
          RELEASE_FLAG: ${{ matrix.build-type == 'release' && 'RELEASE=yes' || '' }}
        run: |
          ./z build --with-minimal-docker -- \
            all-guest-staticlibs all-kernel all-guest-binaries \
            MACHINE=microvm \
            DEPLOYMENT_MODE=standalone \
            TARGET=x86 \
            WHP=yes \
            LOG_LEVEL=${LOG_LEVEL} \
            ${RELEASE_FLAG}

      - name: "Upload Guest Artifacts"
        uses: actions/upload-artifact@v7
        with:
          name: windows-guest-build-${{ matrix.build-type }}
          retention-days: 1
          path: |
            bin/*.elf
            bin/*.img
            lib/*.so

  # Run format and lint checks natively on Windows for host crates. These do
  # not require Docker and run in parallel with the guest-build job.
  windows-checks:
    name: "Windows Source Checks"
    needs: [precheck]
    timeout-minutes: 30
    runs-on: windows-latest
    permissions:
      contents: read

    if: |
      github.repository == 'nanvix/nanvix' && (
        github.event_name == 'merge_group' || (
          needs.precheck.outputs.up_to_date == 'true' && (
            github.event_name != 'push' ||
            github.event.head_commit == null ||
            !startsWith(github.event.head_commit.message, 'Merge ')
          ) && (
            github.event_name != 'pull_request' ||
            !github.event.pull_request.draft
          )
        )
      )

    steps:
      - uses: actions/checkout@v6

      - name: "Install Rust Toolchain"
        shell: pwsh
        run: |
          $toolchain = (Get-Content rust-toolchain | Select-String '^channel\s*=').ToString() -replace '.*=\s*"([^"]+)".*','$1'
          rustup toolchain install $toolchain
          rustup show
          rustup component add --toolchain $toolchain clippy rustfmt

      - name: "Check Code Format"
        shell: pwsh
        run: |
          .\z.ps1 build -- format-check

      - name: "Lint"
        shell: pwsh
        run: |
          .\z.ps1 build -- lint-check

  # Build host binaries (nanvixd, UserVM, nanvix-test) natively on Windows and
  # run unit tests. Guest artifacts from the Linux job are downloaded and
  # bundled with the standalone rootfs for the integration test stage.
  windows-ci-build:
    name: "Windows Build (${{ matrix.build-type }})"
    needs: [windows-checks, windows-guest-build]
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        build-type: [debug, release]
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6

      - name: "Install Rust Toolchain"
        shell: pwsh
        run: |
          $toolchain = (Get-Content rust-toolchain | Select-String '^channel\s*=').ToString() -replace '.*=\s*"([^"]+)".*','$1'
          rustup toolchain install $toolchain
          rustup show
          rustup component add --toolchain $toolchain clippy rustfmt

      - name: "Download Guest Artifacts"
        uses: actions/download-artifact@v8
        with:
          name: windows-guest-build-${{ matrix.build-type }}
          path: .

      - name: "Build UserVM"
        shell: pwsh
        env:
          LOG_LEVEL: ${{ matrix.build-type == 'release' && 'error' || 'trace' }}
          RELEASE_FLAG: ${{ matrix.build-type == 'release' && 'RELEASE=yes' || '' }}
        run: |
          .\z.ps1 build -- uservm $env:RELEASE_FLAG LOG_LEVEL=$env:LOG_LEVEL

      - name: "Build Nanvixd"
        shell: pwsh
        env:
          LOG_LEVEL: ${{ matrix.build-type == 'release' && 'error' || 'trace' }}
          RELEASE_FLAG: ${{ matrix.build-type == 'release' && 'RELEASE=yes' || '' }}
        run: |
          .\z.ps1 build -- nanvixd $env:RELEASE_FLAG LOG_LEVEL=$env:LOG_LEVEL

      - name: "Build Nanvix Test Runner"
        shell: pwsh
        env:
          LOG_LEVEL: ${{ matrix.build-type == 'release' && 'error' || 'trace' }}
          RELEASE_FLAG: ${{ matrix.build-type == 'release' && 'RELEASE=yes' || '' }}
        run: |
          .\z.ps1 build -- nanvix-test $env:RELEASE_FLAG LOG_LEVEL=$env:LOG_LEVEL

      - name: "Unit Tests"
        shell: pwsh
        run: |
          .\z.ps1 build -- run-unit-tests

      - name: "Upload Build Artifacts"
        uses: actions/upload-artifact@v7
        with:
          name: windows-build-${{ matrix.build-type }}
          retention-days: 1
          path: |
            bin/*.exe
            bin/*.elf
            bin/*.img

  # Run the full standalone test suite on Windows Hypervisor Platform using
  # nanvix-test.exe, mirroring the Linux CI integration-test stage.
  # NOTE: GitHub-hosted Windows runners have highly variable WHP performance.
  # Some runners complete all tests in under a minute while others time out
  # due to slow nested virtualization. continue-on-error prevents flaky
  # failures from blocking the pipeline.
  windows-integration-test:
    name: "Windows Integration Test (${{ matrix.build-type }})"
    needs: [windows-ci-build]
    timeout-minutes: 30
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        build-type: [debug, release]
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6

      - name: "Download Build Artifacts"
        uses: actions/download-artifact@v8
        with:
          name: windows-build-${{ matrix.build-type }}
          path: bin

      - name: "Exclude bin/ from Windows Defender"
        shell: pwsh
        run: |
          # Prevent Defender from quarantining unsigned executables extracted
          # from the build artifact.
          $binDir = Join-Path $env:GITHUB_WORKSPACE "bin"
          Add-MpPreference -ExclusionPath $binDir
          Write-Host "Added Defender exclusion for $binDir"

      - name: "Verify Build Artifacts"
        shell: pwsh
        run: |
          Get-ChildItem bin -Filter *.exe | Format-Table Name, Length
          Get-ChildItem bin -Filter *.elf | Format-Table Name, Length
          Get-ChildItem bin -Filter *.img | Format-Table Name, Length

      - name: "Check Windows Hypervisor Platform"
        id: whp-check
        shell: pwsh
        run: |
          $feature = Get-WindowsOptionalFeature -Online -FeatureName HypervisorPlatform
          if ($feature.State -ne 'Enabled') {
            Write-Host "::warning::Windows Hypervisor Platform is not enabled — skipping integration tests."
            echo "whp_available=false" >> $env:GITHUB_OUTPUT
            exit 0
          }
          Write-Host "HypervisorPlatform feature is enabled."

          # Probe whether WHP can actually boot a guest by running hello-rust-nostd
          # with a short timeout. GitHub-hosted runners may report the feature as
          # enabled without functional nested virtualization.
          Write-Host "Probing WHP with hello-rust-nostd (30s timeout)..."
          $proc = Start-Process -FilePath ".\bin\nanvixd.exe" `
            -ArgumentList "-- .\bin\hello-rust-nostd.elf" `
            -PassThru -NoNewWindow -RedirectStandardOutput "whp-probe-stdout.txt" `
            -RedirectStandardError "whp-probe-stderr.txt"

          $exited = $proc | Wait-Process -Timeout 30 -ErrorAction SilentlyContinue
          if (-not $proc.HasExited) {
            $proc | Stop-Process -Force
            Write-Host "::warning::WHP probe timed out — hypervisor is not functional on this runner. Skipping integration tests."
            echo "whp_available=false" >> $env:GITHUB_OUTPUT
            exit 0
          }

          if ($proc.ExitCode -ne 0) {
            Write-Host "::warning::WHP probe failed with exit code $($proc.ExitCode) — skipping integration tests."
            Get-Content "whp-probe-stderr.txt" -ErrorAction SilentlyContinue | Write-Host
            echo "whp_available=false" >> $env:GITHUB_OUTPUT
            exit 0
          }

          Write-Host "WHP probe succeeded — hypervisor is functional."
          echo "whp_available=true" >> $env:GITHUB_OUTPUT

      - name: "Run Integration Tests"
        if: steps.whp-check.outputs.whp_available == 'true'
        shell: pwsh
        env:
          RUST_LOG: trace
        run: |
          & .\bin\nanvix-test.exe .\test\test-standalone-windows.toml

      - name: "Upload logs in case of failures"
        if: failure() || cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: nanvix-windows-integration-logs-${{ github.event.pull_request.number || github.run_number }}-${{ matrix.build-type }}
          overwrite: "true"
          path: |
            logs/
            **/*.log
            **/*.out
            **/*.err

  # ==========================================================================================
  # Stage 3: L2 and Benchmark (Self-Hosted Runners)
  # ==========================================================================================

  # L2 configurations require .git for generate-l2-initramfs.sh, so they build
  # from source on self-hosted runners with a local toolchain.
  ci-l2:
    name: "L2 (${{ matrix.build-type }}, ${{ matrix.machine-type }})"
    needs: [precheck, checks]
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        build-type: [debug, release]
        machine-type: [microvm, hyperlight]
    runs-on:
      group: Test
    permissions:
      contents: read

    if: |
      github.repository == 'nanvix/nanvix' && (
        github.event_name == 'merge_group' || (
          needs.precheck.outputs.up_to_date == 'true' && (
            github.event_name != 'push' ||
            github.event.head_commit == null ||
            !startsWith(github.event.head_commit.message, 'Merge ')
          ) && (
            github.event_name != 'pull_request' ||
            !github.event.pull_request.draft
          )
        )
      )

    steps:
      - uses: actions/checkout@v6

      - name: "Isolate Cargo Home"
        shell: bash
        run: |
          # Isolate Cargo home per job to prevent concurrent git-cache races on
          # self-hosted runners that share the same filesystem.
          echo "CARGO_HOME=$RUNNER_TEMP/.cargo" >> "$GITHUB_ENV"

      - name: "Pre-Cleanup Dangling Resources"
        uses: ./.github/actions/cleanup
        with:
          phase: pre

      - name: "Link Toolchain Directory"
        uses: ./.github/actions/link-toolchain

      - name: "Lint"
        uses: ./.github/actions/lint
        with:
          release: "${{ matrix.build-type }}"
          log-level: "trace"
          machine-type: "${{ matrix.machine-type }}"
          deployment-type: "l2"

      - name: "Build"
        uses: ./.github/actions/build
        with:
          release: "${{ matrix.build-type }}"
          # Use 'error' log level for release builds to match release archive settings,
          # enabling reuse of build artifacts and avoiding a redundant rebuild.
          log-level: ${{ matrix.build-type == 'release' && 'error' || 'trace' }}
          machine-type: "${{ matrix.machine-type }}"
          deployment-type: "l2"

      - name: "Test"
        uses: ./.github/actions/test
        with:
          release: "${{ matrix.build-type }}"
          log-level: ${{ matrix.build-type == 'release' && 'error' || 'trace' }}
          machine-type: "${{ matrix.machine-type }}"
          deployment-type: "l2"

      - name: "Collect L2 diagnostics"
        if: failure() || cancelled()
        uses: ./.github/actions/collect-l2-diagnostics

      - name: "Post-Cleanup Dangling Resources"
        if: always()
        uses: ./.github/actions/cleanup
        with:
          phase: post

      - name: "Upload logs in case of failures"
        if: failure() || cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: nanvix-l2-logs-${{ github.event.pull_request.number || github.run_number }}-${{ matrix.build-type }}-${{ matrix.machine-type }}
          overwrite: "true"
          path: |
            logs/
            **/*.log
            **/*.out
            **/*.err

  # Build from source and run micro-benchmarks on baremetal self-hosted runners.
  # Benchmarks require DEPLOYMENT_MODE=l2 which needs .git, so they cannot use Docker builds.
  # Each machine type runs in parallel; a finalize job aggregates results.
  benchmark:
    name: "Benchmark (${{ matrix.machine-type }})"
    needs: [precheck]
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - machine-type: microvm
            # FIXME(1171): the current L2 deployment involves a very slow network
            # namespace creation, particularly at high-churn, so we must temporarily
            # reduce the number of iterations of the benchmarks.
            standard-benchmarks: "boot-time cold-start cold-start-l2 cold-start-uvm concurrent concurrent-l2 round-trip-latency snapshot-restore warm-start warm-start-l2 warm-start-vmm"
            standard-iterations: "100"
            echo-benchmarks: "echo-breakdown echo-breakdown-l2"
            echo-iterations: "1000"
          # NOTE (#1759, #1762): Hyperlight benchmarks are disabled until the
          # round-trip-latency failure is investigated.
    runs-on:
      group: Benchmark
    permissions:
      contents: read

    if: |
      github.repository == 'nanvix/nanvix' && (
        github.event_name == 'merge_group' || (
          needs.precheck.outputs.up_to_date == 'true' && (
            github.event_name != 'push' ||
            github.event.head_commit == null ||
            !startsWith(github.event.head_commit.message, 'Merge ')
          ) && (
            github.event_name != 'pull_request' ||
            !github.event.pull_request.draft
          )
        )
      )

    steps:
      - uses: actions/checkout@v6

      - name: "Isolate Cargo Home"
        shell: bash
        run: |
          # Isolate Cargo home per job to prevent concurrent git-cache races on
          # self-hosted runners that share the same filesystem.
          echo "CARGO_HOME=$RUNNER_TEMP/.cargo" >> "$GITHUB_ENV"

      - name: "Pre-Cleanup Dangling Resources"
        uses: ./.github/actions/cleanup
        with:
          phase: pre

      - name: "Link Toolchain Directory"
        uses: ./.github/actions/link-toolchain

      - name: "Build (Standard)"
        uses: ./.github/actions/benchmark-build
        with:
          machine-type: "${{ matrix.machine-type }}"

      - name: "Run Micro-Benchmarks (Standard)"
        uses: ./.github/actions/benchmark-run
        with:
          benchmarks: "${{ matrix.standard-benchmarks }}"
          machine-type: "${{ matrix.machine-type }}"
          iterations: "${{ matrix.standard-iterations }}"

      - name: "Build (Echo-Breakdown)"
        if: matrix.echo-benchmarks != ''
        uses: ./.github/actions/benchmark-build
        with:
          machine-type: "${{ matrix.machine-type }}"
          timestamp-msg: "yes"

      - name: "Run Echo-Breakdown Benchmarks"
        if: matrix.echo-benchmarks != ''
        uses: ./.github/actions/benchmark-run
        with:
          benchmarks: "${{ matrix.echo-benchmarks }}"
          machine-type: "${{ matrix.machine-type }}"
          iterations: "${{ matrix.echo-iterations }}"

      - name: "Upload Benchmark Results"
        if: always() && !cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-results-${{ matrix.machine-type }}
          overwrite: true
          retention-days: 1
          path: nanvix_bench_*.csv

      - name: "Dump SCCACHE Statistics"
        if: always()
        uses: ./.github/actions/sccache-stats

      - name: "Post-Cleanup Dangling Resources"
        if: always()
        uses: ./.github/actions/cleanup
        with:
          phase: post

      - name: "Upload logs in case of benchmark failures"
        if: failure() || cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: nanvix-benchmark-logs-${{ github.event.pull_request.number || github.run_number }}-${{ matrix.machine-type }}
          overwrite: "true"
          path: |
            logs/
            **/*.log
            **/*.out
            **/*.err
            bench_*.txt

  # Aggregate benchmark results from all machine types, post a PR comment,
  # and persist the updated baselines on dev.
  # NOTE: all matrix legs must succeed; partial results are intentionally
  # discarded so that baselines stay consistent across machine types.
  benchmark-finalize:
    name: "Benchmark Finalize"
    needs: [benchmark]
    # NOTE: needs.benchmark.result is the aggregate result across all matrix
    # legs. It is 'success' only when every leg succeeds.
    if: ${{ !cancelled() && needs.benchmark.result == 'success' }}
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - uses: actions/checkout@v6
        with:
          # Use the deploy SSH key so that benchmark-persist can push results
          # to the dev branch (the deploy key is a bypass actor for branch
          # protection rules, matching the approach in create-minor-release).
          ssh-key: ${{ secrets.DEPLOY_PRIVATE_SSH_KEY }}

      - name: "Download Benchmark Results"
        uses: actions/download-artifact@v8
        with:
          pattern: benchmark-results-*
          path: .
          merge-multiple: true

      - name: "Report Benchmark Results"
        uses: ./.github/actions/benchmark-report
        with:
          benchmarks: "boot-time,cold-start,cold-start-l2,cold-start-uvm,concurrent,concurrent-l2,echo-breakdown,echo-breakdown-l2,round-trip-latency,snapshot-restore,warm-start,warm-start-l2,warm-start-vmm"
          machine-types: "microvm"
          archs: "X64"
          dev-dir: "data/baremetal"
          runner-label: "self-hosted"
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: "Persist results on dev"
        if: github.ref_name == 'dev'
        uses: ./.github/actions/benchmark-persist
        with:
          benchmarks: "boot-time,cold-start,cold-start-l2,cold-start-uvm,concurrent,concurrent-l2,echo-breakdown,echo-breakdown-l2,round-trip-latency,snapshot-restore,warm-start,warm-start-l2,warm-start-vmm"
          machine-types: "microvm,hyperlight"
          archs: "X64"
          target-dir: "data/baremetal"

      - name: "Upload logs in case of finalize failures"
        if: failure() || cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: nanvix-benchmark-finalize-logs-${{ github.event.pull_request.number || github.run_number }}
          overwrite: "true"
          path: |
            logs/
            **/*.log
            **/*.out
            **/*.err

  # Run micro-benchmarks on a GitHub-hosted runner using Docker so that
  # results are collected even without self-hosted hardware.
  # L2 benchmarks are intentionally excluded as they require self-hosted
  # infrastructure. GitHub runner results are stored in data/github/ to keep
  # them isolated from the self-hosted runner baselines in data/baremetal/.
  # Each machine type runs in parallel; a finalize job aggregates results.
  benchmark-ci:
    name: "Benchmark CI (${{ matrix.machine-type }})"
    needs: [precheck]
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - machine-type: microvm
            # NOTE: concurrent is excluded on GitHub-hosted runners because the
            # gateway handshake race condition (issue #1552) causes sporadic
            # timeouts under the scheduling contention of shared CI machines.
            standard-benchmarks: "boot-time cold-start cold-start-uvm round-trip-latency snapshot-restore warm-start warm-start-vmm"
            standard-iterations: "100"
            echo-benchmarks: "echo-breakdown"
            echo-iterations: "1000"
          # NOTE (#1759, #1762): Hyperlight benchmarks are disabled until the
          # round-trip-latency failure is investigated.
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    if: |
      github.repository == 'nanvix/nanvix' && (
        github.event_name == 'merge_group' || (
          needs.precheck.outputs.up_to_date == 'true' && (
            github.event_name != 'push' ||
            github.event.head_commit == null ||
            !startsWith(github.event.head_commit.message, 'Merge ')
          ) && (
            github.event_name != 'pull_request' ||
            !github.event.pull_request.draft
          )
        )
      )

    steps:
      - uses: actions/checkout@v6

      - name: "Setup"
        uses: ./.github/actions/docker-setup

      - name: "Setup sccache"
        uses: Mozilla-Actions/sccache-action@v0.0.9
        with:
          version: "v0.10.0"

      - name: "Build (Standard)"
        uses: ./.github/actions/docker-benchmark-build
        with:
          machine-type: "${{ matrix.machine-type }}"
          sccache-gha-enabled: "true"

      - name: "Run Micro-Benchmarks (Standard)"
        uses: ./.github/actions/docker-benchmark-run
        with:
          benchmarks: "${{ matrix.standard-benchmarks }}"
          machine-type: "${{ matrix.machine-type }}"
          iterations: "${{ matrix.standard-iterations }}"

      - name: "Build (Echo-Breakdown)"
        if: matrix.echo-benchmarks != ''
        uses: ./.github/actions/docker-benchmark-build
        with:
          machine-type: "${{ matrix.machine-type }}"
          timestamp-msg: "yes"
          sccache-gha-enabled: "true"

      - name: "Run Echo-Breakdown Benchmarks"
        if: matrix.echo-benchmarks != ''
        uses: ./.github/actions/docker-benchmark-run
        with:
          benchmarks: "${{ matrix.echo-benchmarks }}"
          machine-type: "${{ matrix.machine-type }}"
          iterations: "${{ matrix.echo-iterations }}"

      - name: "Upload Benchmark Results"
        if: always() && !cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-ci-results-${{ matrix.machine-type }}
          overwrite: true
          retention-days: 1
          path: nanvix_bench_*.csv

      - name: "Upload logs in case of benchmark failures"
        if: failure() || cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: nanvix-benchmark-ci-logs-${{ github.event.pull_request.number || github.run_number }}-${{ matrix.machine-type }}
          overwrite: "true"
          path: |
            logs/
            **/*.log
            **/*.out
            **/*.err
            bench_*.txt

  # Aggregate CI benchmark results from all machine types, post a PR comment,
  # and persist the updated baselines on dev.
  # NOTE: all matrix legs must succeed; partial results are intentionally
  # discarded so that baselines stay consistent across machine types.
  benchmark-ci-finalize:
    name: "Benchmark CI Finalize"
    needs: [benchmark-ci]
    # NOTE: needs.benchmark-ci.result is the aggregate result across all matrix
    # legs. It is 'success' only when every leg succeeds.
    if: ${{ !cancelled() && needs.benchmark-ci.result == 'success' }}
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - uses: actions/checkout@v6
        with:
          ssh-key: ${{ secrets.DEPLOY_PRIVATE_SSH_KEY }}

      - name: "Download Benchmark Results"
        uses: actions/download-artifact@v8
        with:
          pattern: benchmark-ci-results-*
          path: .
          merge-multiple: true

      - name: "Report Benchmark Results"
        uses: ./.github/actions/benchmark-report
        with:
          benchmarks: "boot-time,cold-start,cold-start-uvm,echo-breakdown,round-trip-latency,snapshot-restore,warm-start,warm-start-vmm"
          machine-types: "microvm"
          archs: "X64"
          dev-dir: "data/github"
          runner-label: "github-hosted"
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: "Persist results on dev"
        if: github.ref_name == 'dev'
        uses: ./.github/actions/benchmark-persist
        with:
          benchmarks: "boot-time,cold-start,cold-start-uvm,echo-breakdown,round-trip-latency,snapshot-restore,warm-start,warm-start-vmm"
          machine-types: "microvm,hyperlight"
          archs: "X64"
          target-dir: "data/github"

      - name: "Upload logs in case of finalize failures"
        if: failure() || cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: nanvix-benchmark-ci-finalize-logs-${{ github.event.pull_request.number || github.run_number }}
          overwrite: "true"
          path: |
            logs/
            **/*.log
            **/*.out
            **/*.err

  # ==========================================================================================
  # Stage 4: Post Actions (Conditional)
  # ==========================================================================================

  # Create release archives for all applicable configurations.
  release-archive:
    name: "Release Archive (${{ matrix.machine-type }}, ${{ matrix.deployment-type }}, ${{ matrix.memory-size }}mb)"
    needs: [ci-test, ci-l2, benchmark-finalize, benchmark-ci-finalize]
    if: |
      github.repository == 'nanvix/nanvix' &&
      github.ref == 'refs/heads/dev' &&
      needs.ci-test.result == 'success' &&
      needs.ci-l2.result == 'success' &&
      needs.benchmark-finalize.result == 'success' &&
      needs.benchmark-ci-finalize.result == 'success'
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        machine-type: [microvm, hyperlight]
        deployment-type: [standalone, single-process, multi-process]
        memory-size: [128]
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6

      - name: "Download CI Build Artifacts"
        uses: actions/download-artifact@v8
        with:
          name: ci-build-release-${{ matrix.machine-type }}-${{ matrix.deployment-type }}-${{ matrix.memory-size }}mb
          path: .

      - name: "Package Release Archive"
        id: release-archive
        uses: ./.github/actions/release-package
        with:
          machine-type: "${{ matrix.machine-type }}"
          deployment-type: "${{ matrix.deployment-type }}"
          memory-size: "${{ matrix.memory-size }}"

      - name: "Upload Release Artifact"
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.machine-type }}-${{ matrix.deployment-type }}-${{ matrix.memory-size }}mb
          path: ${{ steps.release-archive.outputs.archive-path }}
          overwrite: true

  # Publish the latest release to GitHub.
  publish-latest:
    name: "Publish Latest Release"
    needs: [release-archive]
    if: |
      github.repository == 'nanvix/nanvix' &&
      github.ref == 'refs/heads/dev' &&
      needs.release-archive.result == 'success'
    runs-on:
      group: Test
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - name: "Isolate Cargo Home"
        shell: bash
        run: |
          # Isolate Cargo home per job to prevent concurrent git-cache races on
          # self-hosted runners that share the same filesystem.
          echo "CARGO_HOME=$RUNNER_TEMP/.cargo" >> "$GITHUB_ENV"

      - name: "Publish Release"
        uses: ./.github/actions/publish-release
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          dispatch-token: ${{ secrets.DISPATCH_TOKEN }}

  # Create a minor release tag on merge commits to dev.
  # This job runs independently of the CI pipeline because the pipeline skips
  # merge commits while this job specifically targets them.
  create-minor-release:
    name: "Create Minor Release"
    # Only run on merge commits to dev branch that were not made by github-actions[bot].
    # This prevents infinite loops when the workflow commits back to dev.
    # Checks:
    # 1. Event is a push (not a PR or workflow_dispatch)
    # 2. Actor is not github-actions[bot] (prevents workflow-triggered runs)
    # 3. Commit author is not github-actions[bot] (prevents runs on bot commits)
    if: >-
      github.event_name == 'push' &&
      github.actor != 'github-actions[bot]' &&
      github.event.head_commit.author.username != 'github-actions[bot]' &&
      github.event.head_commit.committer.username != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v6
        with:
          ssh-key: ${{ secrets.DEPLOY_PRIVATE_SSH_KEY }}
          fetch-depth: 0

      - name: "Create Minor Release"
        uses: ./.github/actions/create-minor-release
