name: "Deploy Benchmark Site"

on:
  push:
    branches: [ dev ]
    paths:
      - "www/bench/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  # Upload and deploy run in separate jobs: within one job, deploy-pages can
  # list the run's artifacts before the one just uploaded becomes visible
  # (actions/deploy-pages#451).
  upload:
    runs-on: ubuntu-24.04
    env:
      # Artifacts of earlier attempts survive re-runs, and deploy-pages rejects
      # a name that several artifacts share (actions/deploy-pages#338). Naming
      # the artifact per attempt lets "Re-run all jobs" work, while re-running
      # only the deploy job reuses this job's output and its artifact.
      ARTIFACT_NAME: github-pages-${{ github.run_attempt }}
    outputs:
      artifact-name: ${{ env.ARTIFACT_NAME }}
    steps:
      - uses: actions/checkout@v7

      - name: "Configure Pages"
        uses: actions/configure-pages@v6

      - name: "Upload Pages artifact"
        uses: actions/upload-pages-artifact@v5
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: www/bench

  deploy:
    needs: upload
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - name: "Deploy to GitHub Pages"
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: ${{ needs.upload.outputs.artifact-name }}
