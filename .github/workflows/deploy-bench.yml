name: "Deploy Benchmark Site"

on:
  push:
    branches: [ dev ]
    paths:
      - "www/bench/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  # Upload and deploy run in separate jobs: within one job, deploy-pages can
  # list the run's artifacts before the one just uploaded becomes visible
  # (actions/deploy-pages#451).
  upload:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: "Configure Pages"
        uses: actions/configure-pages@v6

      - name: "Upload Pages artifact"
        uses: actions/upload-pages-artifact@v5
        with:
          path: www/bench

  deploy:
    needs: upload
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - name: "Deploy to GitHub Pages"
        id: deployment
        uses: actions/deploy-pages@v5
