name: "Verus Update"

on:
  schedule:
    # Run every Monday at 06:00 UTC.
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-verus-update
  cancel-in-progress: true

jobs:
  verus-update:
    name: "Update Verus and vstd"
    runs-on: ubuntu-24.04
    if: github.repository == 'nanvix/nanvix'
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v7
        with:
          ref: dev

      - name: "Set Up Rust Toolchain"
        run: rustup show

      - name: "Update Verus and vstd"
        id: update
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Run the update script. Log messages go to stderr; only key=value
          # pairs appear on stdout and are forwarded to GITHUB_OUTPUT.
          bash scripts/update-verus.sh | tee -a "$GITHUB_OUTPUT"

      - name: "Create Pull Request"
        if: steps.update.outputs.UPDATED == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.DISPATCH_TOKEN }}
          base: dev
          branch: auto/verus-update
          commit-message: "[build] Update Verus to ${{ steps.update.outputs.LATEST_VERSION }}"
          title: "[build] Update Verus to ${{ steps.update.outputs.LATEST_VERSION }}"
          body: |
            Automated Verus version bump.

            | Component | Old | New |
            |-----------|-----|-----|
            | Verus release | `${{ steps.update.outputs.CURRENT_VERSION }}` | `${{ steps.update.outputs.LATEST_VERSION }}` |
            | vstd | `${{ steps.update.outputs.OLD_VSTD }}` | `${{ steps.update.outputs.NEW_VSTD }}` |

            **Files changed:**
            - `build/verus-version` — updated release tag
            - `Cargo.toml` — updated vstd version pin

            > Generated by the **Verus Update** workflow.
          assignees: ppenna
          delete-branch: true
