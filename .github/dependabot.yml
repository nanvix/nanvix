version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
      time: "03:00"
    labels:
      - "enhancement"
    open-pull-requests-limit: 20
    pull-request-branch-name:
      separator: "-"
      prefix: "enhancement-build-contrib"
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "daily"
      time: "03:00"
    labels:
      - "enhancement"
    open-pull-requests-limit: 20
    pull-request-branch-name:
      separator: "-"
      prefix: "enhancement-build-contrib"
