[package]
name = "nanvix-shim-proto"
description = "Shimv2 protocol layer for the Nanvix containerd shim (ttrpc Task + Sandbox services)"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
nanvix-oci = { workspace = true }
nanvix-shim-core = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
chrono = { workspace = true }
containerd-shim-protos = { workspace = true }
log = { workspace = true }
env_logger = { workspace = true }
oci-spec = { workspace = true }
protobuf = "3.2"
sha2 = { workspace = true }
ttrpc = { workspace = true }
tokio = { workspace = true }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", features = ["signal", "process", "mount"] }
libc = "0.2"
