# Unfortunately, we need to add both options to circunvent a black-flake8
# incompatibility:
# https://black.readthedocs.io/en/stable/guides/using_black_with_other_tools.html#flake8
[flake8]
max-line-length = 100
extend-ignore = E203
[pycodestyle]
max-line-length = 100
