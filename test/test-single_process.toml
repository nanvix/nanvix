#===================================================================================================
# Environment Variable Tests
#===================================================================================================

# Single environment variable.
[[tests]]
build_modes = ["debug", "release"]
executor = "http"
program = "./bin/test-rust-env-nostd.elf"
program_env = "TEST_VAR=hello"
expected_output = "TEST_VAR=hello\nok"

[[tests]]
build_modes = ["debug", "release"]
executor = "terminal"
program = "./bin/test-rust-env-nostd.elf"
program_env = "TEST_VAR=hello"
expected_output = "TEST_VAR=hello\nok"

# Multiple environment variables.
[[tests]]
build_modes = ["debug", "release"]
executor = "http"
program = "./bin/test-rust-env-nostd.elf"
program_env = "FOO=bar BAZ=qux"
expected_output = "FOO=bar\nBAZ=qux\nok"

[[tests]]
build_modes = ["debug", "release"]
executor = "terminal"
program = "./bin/test-rust-env-nostd.elf"
program_env = "FOO=bar BAZ=qux"
expected_output = "FOO=bar\nBAZ=qux\nok"

# Environment variable with special characters in value.
[[tests]]
build_modes = ["debug", "release"]
executor = "http"
program = "./bin/test-rust-env-nostd.elf"
program_env = "SPECIAL=a/b:c-d_e.f"
expected_output = "SPECIAL=a/b:c-d_e.f\nok"

[[tests]]
build_modes = ["debug", "release"]
executor = "terminal"
program = "./bin/test-rust-env-nostd.elf"
program_env = "SPECIAL=a/b:c-d_e.f"
expected_output = "SPECIAL=a/b:c-d_e.f\nok"

#===================================================================================================
# Combined Command-Line Argument and Environment Variable Tests
#===================================================================================================

# Program with args and environment variables.
[[tests]]
build_modes = ["debug", "release"]
executor = "http"
program = "./bin/test-rust-cmdline-env-nostd.elf"
program_args = "hello world"
program_env = "FOO=bar"
expected_output = "ARGS:hello world\nENV:FOO=bar\nok"

[[tests]]
build_modes = ["debug", "release"]
executor = "terminal"
program = "./bin/test-rust-cmdline-env-nostd.elf"
program_args = "hello world"
program_env = "FOO=bar"
expected_output = "ARGS:hello world\nENV:FOO=bar\nok"

# Program with args and no environment variables.
[[tests]]
build_modes = ["debug", "release"]
executor = "http"
program = "./bin/test-rust-cmdline-env-nostd.elf"
program_args = "hello world"
expected_output = "ARGS:hello world\nENV:\nok"

[[tests]]
build_modes = ["debug", "release"]
executor = "terminal"
program = "./bin/test-rust-cmdline-env-nostd.elf"
program_args = "hello world"
expected_output = "ARGS:hello world\nENV:\nok"

# Program with no args and with environment variables.
[[tests]]
build_modes = ["debug", "release"]
executor = "http"
program = "./bin/test-rust-cmdline-env-nostd.elf"
program_env = "FOO=bar"
expected_output = "ARGS:\nENV:FOO=bar\nok"

[[tests]]
build_modes = ["debug", "release"]
executor = "terminal"
program = "./bin/test-rust-cmdline-env-nostd.elf"
program_env = "FOO=bar"
expected_output = "ARGS:\nENV:FOO=bar\nok"

# Program with escaped args (literal semicolon in arguments).
[[tests]]
build_modes = ["debug", "release"]
executor = "http"
program = "./bin/test-rust-cmdline-env-nostd.elf"
program_args = "a;b"
program_env = "X=1"
expected_output = "ARGS:a;b\nENV:X=1\nok"

[[tests]]
build_modes = ["debug", "release"]
executor = "terminal"
program = "./bin/test-rust-cmdline-env-nostd.elf"
program_args = "a;b"
program_env = "X=1"
expected_output = "ARGS:a;b\nENV:X=1\nok"

# Program with escaped environment variables (literal semicolon in env value).
[[tests]]
build_modes = ["debug", "release"]
executor = "http"
program = "./bin/test-rust-cmdline-env-nostd.elf"
program_args = "hello"
program_env = "PATH=a;b"
expected_output = "ARGS:hello\nENV:PATH=a;b\nok"

[[tests]]
build_modes = ["debug", "release"]
executor = "terminal"
program = "./bin/test-rust-cmdline-env-nostd.elf"
program_args = "hello"
program_env = "PATH=a;b"
expected_output = "ARGS:hello\nENV:PATH=a;b\nok"

#===================================================================================================
# getenv() Environment Lookup Tests
#===================================================================================================

# getenv() returns kernel-cmdline-provided variables (including HOME); a key that was never
# provided resolves to null.
[[tests]]
build_modes = ["debug", "release"]
executor = "http"
program = "./bin/test-rust-getenv-nostd.elf"
program_env = "HOME=/scratch NVX_GETENV_A=alpha NVX_GETENV_B=beta"
expected_output = "GETENV:HOME=/scratch NVX_GETENV_A=alpha NVX_GETENV_B=beta NVX_GETENV_MISSING=(null)\nok"

[[tests]]
build_modes = ["debug", "release"]
executor = "terminal"
program = "./bin/test-rust-getenv-nostd.elf"
program_env = "HOME=/scratch NVX_GETENV_A=alpha NVX_GETENV_B=beta"
expected_output = "GETENV:HOME=/scratch NVX_GETENV_A=alpha NVX_GETENV_B=beta NVX_GETENV_MISSING=(null)\nok"

# A malformed entry (a bare KEY token with no '=') is skipped, so getenv() returns null for it.
[[tests]]
build_modes = ["debug", "release"]
executor = "http"
program = "./bin/test-rust-getenv-nostd.elf"
program_env = "HOME=/data NVX_GETENV_A=alpha NVX_GETENV_B"
expected_output = "GETENV:HOME=/data NVX_GETENV_A=alpha NVX_GETENV_B=(null) NVX_GETENV_MISSING=(null)\nok"

[[tests]]
build_modes = ["debug", "release"]
executor = "terminal"
program = "./bin/test-rust-getenv-nostd.elf"
program_env = "HOME=/data NVX_GETENV_A=alpha NVX_GETENV_B"
expected_output = "GETENV:HOME=/data NVX_GETENV_A=alpha NVX_GETENV_B=(null) NVX_GETENV_MISSING=(null)\nok"

# An empty environment produces an empty table, so every probed key resolves to null.
[[tests]]
build_modes = ["debug", "release"]
executor = "http"
program = "./bin/test-rust-getenv-nostd.elf"
expected_output = "GETENV:HOME=(null) NVX_GETENV_A=(null) NVX_GETENV_B=(null) NVX_GETENV_MISSING=(null)\nok"

[[tests]]
build_modes = ["debug", "release"]
executor = "terminal"
program = "./bin/test-rust-getenv-nostd.elf"
expected_output = "GETENV:HOME=(null) NVX_GETENV_A=(null) NVX_GETENV_B=(null) NVX_GETENV_MISSING=(null)\nok"
