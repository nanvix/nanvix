# Empty Executor Tests
#===================================================================================================

[[tests]]
build_modes = ["debug", "release"]
executor = "empty"
name = "empty/1"
iterations = 1

[[tests]]
build_modes = ["debug", "release"]
executor = "empty"
name = "empty/2"
iterations = 2

