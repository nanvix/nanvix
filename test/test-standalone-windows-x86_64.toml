#===================================================================================================
# getenv() Environment Lookup Tests
#===================================================================================================

# getenv() returns kernel-cmdline-provided variables (including HOME); a key that was never
# provided resolves to null.
[[tests]]
build_modes = ["debug", "release"]
executor = "terminal"
program = "./bin/test-rust-getenv-nostd.elf"
program_env = "HOME=/scratch NVX_GETENV_A=alpha NVX_GETENV_B=beta"
expected_output = "GETENV:HOME=/scratch NVX_GETENV_A=alpha NVX_GETENV_B=beta NVX_GETENV_MISSING=(null)\nok"

# A malformed entry (a bare KEY token with no '=') is skipped, so getenv() returns null for it.
[[tests]]
build_modes = ["debug", "release"]
executor = "terminal"
program = "./bin/test-rust-getenv-nostd.elf"
program_env = "HOME=/data NVX_GETENV_A=alpha NVX_GETENV_B"
expected_output = "GETENV:HOME=/data NVX_GETENV_A=alpha NVX_GETENV_B=(null) NVX_GETENV_MISSING=(null)\nok"

# An empty environment produces an empty table, so every probed key resolves to null.
[[tests]]
build_modes = ["debug", "release"]
executor = "terminal"
program = "./bin/test-rust-getenv-nostd.elf"
expected_output = "GETENV:HOME=(null) NVX_GETENV_A=(null) NVX_GETENV_B=(null) NVX_GETENV_MISSING=(null)\nok"

#===================================================================================================
# HTTP Executor Tests
#
# HTTP mode is supported on Windows in single-tenant standalone deployments. The guest stdio
# gateway is a named pipe, which has no half-close primitive; the gateway emulates one with an
# in-band framed input direction so stdin-driven workloads (e.g. echo) receive EOF exactly as on
# Linux. See doc/run-windows.md (HTTP Mode). The coverage below mirrors the Windows terminal
# section; host mount tests are intentionally omitted because they have no HTTP counterpart even on
# Linux.
#===================================================================================================

[[tests]]
build_modes = ["debug", "release"]
executor = "http"
program = "./bin/test-rust-kernel.elf"
extra_nanvixd_args = "-ramfs ./bin/test-kernel-ramfs.img"
input = "[]"
expect_empty_output = true
expected_exit_code = 13
runs_on = ["microvm"]

[[tests]]
build_modes = ["debug", "release"]
executor = "http"
program = "./bin/test-rust-mmio-fault.elf"
extra_nanvixd_args = "-ramfs ./bin/test-kernel-ramfs.img"
input = "[]"
expect_empty_output = true
expected_exit_code = 4
runs_on = ["microvm"]

[[tests]]
build_modes = ["debug", "release"]
executor = "http"
program = "./bin/test-rust-sigsegv.elf"
extra_nanvixd_args = "-ramfs ./bin/test-kernel-ramfs.img"
input = "[]"
expect_empty_output = true
expected_exit_code = 0
runs_on = ["microvm"]

[[tests]]
build_modes = ["debug", "release"]
executor = "http"
program = "./bin/test-rust-vfs-test.elf"
extra_nanvixd_args = "-ramfs ./bin/test-rust-vfs-test.img"
input = "[]"
expect_empty_output = true
runs_on = ["microvm"]

[[tests]]
build_modes = ["debug", "release"]
executor = "http"
program = "./bin/test-rust-arch.initrd"
input = "[]"
expected_output = "ok"

[[tests]]
build_modes = ["debug", "release"]
executor = "http"
program = "./bin/echo-rust-nostd.initrd"
input = '["hello world!"]'
expected_output = "hello world!"

[[tests]]
build_modes = ["debug", "release"]
