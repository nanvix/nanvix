#===================================================================================================
# Networking Tests
#===================================================================================================

[[tests]]
executor = "http"
program = "./bin/network-rust.initrd"
extra_nanvixd_args = "-allow-host-networking"
input = "[]"
expected_output = "ok"

[[tests]]
executor = "terminal"
program = "./bin/network-rust.initrd"
extra_nanvixd_args = "-allow-host-networking"
expected_output = "ok"

[[tests]]
executor = "http"
program = "./bin/pipe-dup2-rust.initrd"
input = "[]"
expected_output = "ok"

[[tests]]
executor = "http"
program = "./bin/fork-exec-vfsd-test.initrd"
extra_nanvixd_args = "-ramfs ./bin/fork-exec-vfsd-test.img"
input = "[]"
expected_output = "ok"

[[tests]]
executor = "http"
program = "./bin/fork-exec-write-test.initrd"
extra_nanvixd_args = "-ramfs ./bin/fork-exec-write-test.img"
input = "[]"
expected_output = "ok"

# Acceptance test for file-descriptor inheritance across fork()+execv(): a
# descriptor opened before fork() must remain usable by the child after it
# execv()s. FAILS while the exec'd image does not receive the parent's cloned
# descriptor table (the inherited fd is unknown and the child's read fails).
[[tests]]
executor = "http"
program = "./bin/fork-exec-loop-test.initrd"
extra_nanvixd_args = "-ramfs ./bin/fork-exec-loop-test.img"
input = "[]"
expected_output = "ok"

[[tests]]
executor = "terminal"
program = "./bin/fork-exec-write-test.initrd"
extra_nanvixd_args = "-ramfs ./bin/fork-exec-write-test.img"
expected_output = "ok"

# Acceptance test for multi-threaded VFS per-process state attribution (nanvix/nanvix#2529).
# A secondary (non-main) thread performs read/write on descriptors the main thread opened. FAILS
# while vfsd derives the caller PID by casting the request's TID: the non-main thread's distinct
# TID maps to a phantom process whose descriptor table is empty, so the I/O returns EBADF.
[[tests]]
executor = "http"
program = "./bin/thread-vfs-test.initrd"
extra_nanvixd_args = "-ramfs ./bin/thread-vfs-test.img"
input = "[]"
expected_output = "ok"

[[tests]]
executor = "terminal"
program = "./bin/thread-vfs-test.initrd"
extra_nanvixd_args = "-ramfs ./bin/thread-vfs-test.img"
expected_output = "ok"

[[tests]]
executor = "terminal"
program = "./bin/fork-exec-loop-test.initrd"
extra_nanvixd_args = "-ramfs ./bin/fork-exec-loop-test.img"
expected_output = "ok"

# Acceptance test for socket reference-counting across fork() (nanvix/nanvix#2609).
# FAILS until sockets are reference-counted across fork(): a child closing its
# inherited copy currently destroys the parent's socket.
[[tests]]
executor = "http"
program = "./bin/socket-fork-rust.initrd"
extra_nanvixd_args = "-allow-host-networking"
input = "[]"
expected_output = "ok"

[[tests]]
executor = "terminal"
program = "./bin/pipe-dup2-rust.initrd"
expected_output = "ok"

[[tests]]
executor = "terminal"
program = "./bin/fork-exec-vfsd-test.initrd"
extra_nanvixd_args = "-ramfs ./bin/fork-exec-vfsd-test.img"
expected_output = "ok"

[[tests]]
executor = "terminal"
program = "./bin/socket-fork-rust.initrd"
extra_nanvixd_args = "-allow-host-networking"
expected_output = "ok"

