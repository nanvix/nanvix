# Windows-specific standalone test configuration.
# Mirrors test-standalone.toml adapted for Windows (WHP backend, .exe binary, . tmp_directory).
#
# Usage: nanvix-test.exe test/test-standalone-windows.toml

[runner]
nanvixd_binary_path = "./bin/nanvixd.exe"
working_directory = "."
log_directory = "logs"
tmp_directory = "."
ipv4_addr = "127.0.0.1"
port_num = 9999
hwloc_file_path = ""
l2_enabled = false
fatal = true
toolchain_path = "toolchain"
sysroot_path = "./sysroot"
nanvixd_shutdown_attempts_max = 10
nanvixd_shutdown_retry_interval_ms = 100
nanvixd_ready_attempts_max = 50
nanvixd_ready_retry_interval_ms = 100
cleanup_uservm_sleep_duration_ms = 10
cleanup_l2_uservm_sleep_duration_ms = 100
stream_collection_timeout_ms = 600000
tcp_cleanup_max_wait_seconds = 0
tcp_cleanup_poll_interval_seconds = 1
gateway_connect_max_attempts = 100
gateway_connect_initial_backoff_ms = 10
gateway_connect_max_backoff_ms = 500
gateway_connect_timeout_ms = 15000

#===================================================================================================
# Empty Executor Tests
#===================================================================================================

[[tests]]
executor = "empty"
name = "empty/1"
iterations = 1

[[tests]]
executor = "empty"
name = "empty/2"
iterations = 2

#===================================================================================================
# Terminal Executor Tests (Interactive Mode)
#===================================================================================================

[[tests]]
executor = "terminal"
program = "./bin/test-kernel.elf"
extra_nanvixd_args = "-ramfs ./bin/test-kernel-ramfs.img"
input = "[]"
expect_empty_output = true
expected_exit_code = 13
runs_on = ["microvm"]

[[tests]]
executor = "terminal"
program = "./bin/test-mmio-fault.elf"
extra_nanvixd_args = "-ramfs ./bin/test-kernel-ramfs.img"
input = "[]"
expect_empty_output = true
expected_exit_code = 3
runs_on = ["microvm"]

[[tests]]
executor = "terminal"
program = "./bin/vfs-test.elf"
extra_nanvixd_args = "-ramfs ./bin/vfs-test.img"
input = "[]"
expect_empty_output = true
runs_on = ["microvm"]

[[tests]]
executor = "terminal"
program = "./bin/arch-rust.initrd"
