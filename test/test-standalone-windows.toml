#===================================================================================================
# HTTP Executor Tests
#
# HTTP mode is supported on Windows in single-tenant standalone deployments. The guest stdio
# gateway is a named pipe, which has no half-close primitive; the gateway emulates one with an
# in-band framed input direction so stdin-driven workloads (e.g. echo) receive EOF exactly as on
# Linux. See doc/run-windows.md (HTTP Mode). The coverage below mirrors the Windows terminal
# section; host mount tests are intentionally omitted because they have no HTTP counterpart even on
# Linux.
#===================================================================================================

[[tests]]
executor = "http"
program = "./bin/test-kernel.elf"
extra_nanvixd_args = "-ramfs ./bin/test-kernel-ramfs.img"
input = "[]"
expect_empty_output = true
expected_exit_code = 13
runs_on = ["microvm"]

[[tests]]
executor = "http"
program = "./bin/test-mmio-fault.elf"
extra_nanvixd_args = "-ramfs ./bin/test-kernel-ramfs.img"
input = "[]"
expect_empty_output = true
expected_exit_code = 3
runs_on = ["microvm"]

[[tests]]
executor = "http"
program = "./bin/vfs-test.elf"
extra_nanvixd_args = "-ramfs ./bin/vfs-test.img"
input = "[]"
expect_empty_output = true
runs_on = ["microvm"]

[[tests]]
executor = "http"
program = "./bin/arch-rust.initrd"
input = "[]"
expected_output = "ok"

[[tests]]
executor = "http"
program = "./bin/echo-rust-nostd.initrd"
input = '["hello world!"]'
expected_output = "hello world!"

[[tests]]
executor = "http"
program = "./bin/thread-rust.initrd"
input = "[]"
expected_output = "ok"

[[tests]]
executor = "http"
program = "./bin/waitpid-rust.initrd"
input = "[]"
expected_output = "ok"

[[tests]]
executor = "http"
program = "./bin/setenv-rust.initrd"
input = "[]"
expected_output = "ok"

[[tests]]
executor = "http"
program = "./bin/stress-rust.initrd"
input = "[]"
