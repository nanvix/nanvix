input = "[]"
expected_output = "ok"

# Acceptance test for file-descriptor inheritance across fork()+execv(): a
# descriptor opened before fork() must remain usable by the child after it
# execv()s. FAILS while the exec'd image does not receive the parent's cloned
# descriptor table (the inherited fd is unknown and the child's read fails).
# Release-only: loops fork()+execv() many times to stress the path, which is too
# slow to run under a debug/trace build within the per-test timeout.
[[tests]]
build_modes = ["release"]
executor = "http"
program = "./bin/test-rust-fork-exec-loop-test.initrd"
extra_nanvixd_args = "-ramfs ./bin/test-rust-fork-exec-loop-test.img"
input = "[]"
expected_output = "ok"

# Acceptance test for execv() arguments containing spaces: an argument with an
# embedded space must reach the new image verbatim as a single argument. FAILS
# while execv() flattens argv/envp into a space-separated string (a token with a
# space is rejected with EINVAL, or would be split). Size-independent. This is
# why fork()+execv()'d CPython cannot run python -c "<code with spaces>".
[[tests]]
build_modes = ["debug", "release"]
executor = "http"
program = "./bin/test-rust-fork-exec-argv-space-test.initrd"
extra_nanvixd_args = "-ramfs ./bin/test-rust-fork-exec-argv-space-test.img"
input = "[]"
expected_output = "ok"

# Acceptance test for bulk pipe data integrity across fork()+execv(): a large
# payload streamed by an exec'd child through a dup2()'d pipe must reach the
# parent in full. FAILS while a bulk transfer from a LARGE exec'd image does not
# reach the parent (the writer's write() fails part-way / the reader sees a short
# stream), worsening per iteration; a small exec'd image does not trigger it.
# Release-only: the target is a deliberately large image streamed many times, which is
# prohibitively slow under a debug (trace-enabled) build but tractable under release.
[[tests]]
build_modes = ["release"]
executor = "http"
program = "./bin/test-rust-fork-exec-pipe-bulk-test.initrd"
extra_nanvixd_args = "-ramfs ./bin/test-rust-fork-exec-pipe-bulk-test.img"
input = "[]"
expected_output = "ok"

# Acceptance test for repeated pipe-capture reliability across fork()+execv(): a
# moderate payload streamed by an exec'd child through a dup2()'d pipe must reach
# the parent in full on EVERY cycle, across many cycles, for a large exec'd image.
# Gated to release builds: it loads a large image many times, which is tractable
# only when tracing is disabled (a debug/trace build emits per-page kernel trace
# over a byte-at-a-time UART and would exceed the per-test timeout).
[[tests]]
executor = "http"
program = "./bin/test-rust-fork-exec-pipe-loop-test.initrd"
extra_nanvixd_args = "-ramfs ./bin/test-rust-fork-exec-pipe-loop-test.img"
input = "[]"
expected_output = "ok"
build_modes = ["release"]

[[tests]]
build_modes = ["debug", "release"]
executor = "terminal"
program = "./bin/test-rust-fork-exec-write-test.initrd"
extra_nanvixd_args = "-ramfs ./bin/test-rust-fork-exec-write-test.img"
expected_output = "ok"

# Acceptance test for multi-threaded VFS per-process state attribution (nanvix/nanvix#2529).
# A secondary (non-main) thread performs read/write on descriptors the main thread opened. FAILS
# while vfsd derives the caller PID by casting the request's TID: the non-main thread's distinct
# TID maps to a phantom process whose descriptor table is empty, so the I/O returns EBADF.
[[tests]]
build_modes = ["debug", "release"]
executor = "http"
program = "./bin/test-rust-thread-vfs-test.initrd"
extra_nanvixd_args = "-ramfs ./bin/test-rust-thread-vfs-test.img"
input = "[]"
expected_output = "ok"

[[tests]]
build_modes = ["debug", "release"]
executor = "terminal"
program = "./bin/test-rust-thread-vfs-test.initrd"
extra_nanvixd_args = "-ramfs ./bin/test-rust-thread-vfs-test.img"
expected_output = "ok"

# Release-only: loops fork()+execv() many times to stress the path, which is too
