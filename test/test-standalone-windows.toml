# Windows-specific standalone test configuration.
# Mirrors test-standalone.toml adapted for Windows (WHP backend, .exe binary, . tmp_directory).
#
# Usage: nanvix-test.exe test/test-standalone-windows.toml
#
# NOTE: The following tests are disabled due to pre-existing VMM/guest kernel
# issues on the WHP (microvm) backend, unrelated to the nanvix-test harness:
#
#   - stress-rust.elf:
#       Heavy scheduling/IPC workload exceeds WHP throughput in debug-mode
#       kernels. In release-mode kernels the test may pass but is not yet
#       validated for reliability.
#
#   - dlfcn-c.elf, dlfcn-pie-c.elf:
#       Require standalone-rootfs.img which is not built on Windows.
#
# NOTE: thread-c.elf requires a release-mode kernel build to complete within
# the default timeout. The test performs ~8000 sched_yield calls across
# multiple threads; debug-mode kernels are ~58x slower per context switch
# on WHP due to unoptimized code running inside the guest VM.
# Build with: .\z.ps1 build -- all-kernel RELEASE=yes LOG_LEVEL=warn

[runner]
nanvixd_binary_path = "./bin/nanvixd.exe"
working_directory = "."
log_directory = "logs"
tmp_directory = "."
ipv4_addr = "127.0.0.1"
port_num = 9999
hwloc_file_path = ""
l2_enabled = false
fatal = true
toolchain_path = "toolchain"
sysroot_path = "./sysroot"
nanvixd_shutdown_attempts_max = 10
nanvixd_shutdown_retry_interval_ms = 100
nanvixd_ready_attempts_max = 50
nanvixd_ready_retry_interval_ms = 100
cleanup_uservm_sleep_duration_ms = 10
cleanup_l2_uservm_sleep_duration_ms = 100
stream_collection_timeout_ms = 300000
tcp_cleanup_max_wait_seconds = 0
tcp_cleanup_poll_interval_seconds = 1
gateway_connect_max_attempts = 100
gateway_connect_initial_backoff_ms = 10
gateway_connect_max_backoff_ms = 500
gateway_connect_timeout_ms = 15000

#===================================================================================================
# Empty Executor Tests
#===================================================================================================

[[tests]]
executor = "empty"
name = "empty/1"
iterations = 1

[[tests]]
executor = "empty"
name = "empty/2"
iterations = 2

#===================================================================================================
# Terminal Executor Tests (Interactive Mode)
#===================================================================================================

[[tests]]
executor = "terminal"
program = "./bin/test-kernel.elf"
extra_nanvixd_args = "-ramfs README.md"
input = "[]"
expect_empty_output = true
expected_exit_code = 13

[[tests]]
executor = "terminal"
program = "./bin/test-mmio-fault.elf"
extra_nanvixd_args = "-ramfs README.md"
input = "[]"
expect_empty_output = true
expected_exit_code = 3
runs_on = ["microvm"]

[[tests]]
executor = "terminal"
program = "./bin/vfs-test.elf"
extra_nanvixd_args = "-ramfs ./bin/vfs-test.img"
input = "[]"
expect_empty_output = true
runs_on = ["microvm"]

[[tests]]
executor = "terminal"
program = "./bin/hello-c.elf"
expected_output = "Hello, world from C!"

[[tests]]
executor = "terminal"
program = "./bin/hello-cpp.elf"
expected_output = "Hello, world from C++!"

[[tests]]
executor = "terminal"
program = "./bin/arch-rust.elf"
expected_output = "ok"

[[tests]]
executor = "terminal"
program = "./bin/echo-c.elf"
input = '["hello"]'
expected_output = "hello"

[[tests]]
executor = "terminal"
program = "./bin/echo-cpp.elf"
input = '["hello"]'
expected_output = "hello"

[[tests]]
executor = "terminal"
program = "./bin/echo-rust-nostd.elf"
input = '["hello"]'
expected_output = "hello"

[[tests]]
executor = "terminal"
program = "./bin/memory-c.elf"
expected_output = "ok"

[[tests]]
executor = "terminal"
program = "./bin/misc-c.elf"
program_args = ";NANVIX_TEST=1"
expected_output = "ok"

[[tests]]
executor = "terminal"
program = "./bin/thread-rust.elf"
expected_output = "ok"

[[tests]]
executor = "terminal"
program = "./bin/thread-c.elf"
expected_output = "ok"
