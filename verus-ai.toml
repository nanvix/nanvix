Hard rules:
- Do not touch unlisted functions.
- Property-analysis output MUST be strictly addressed in this `specification`
  phase (do NOT defer to proving). Read
  `verus-ai-logs/nanvix-virt-manager/property_analysis.md` and
  `verus-ai-logs/nanvix-virt-manager/bugs.md` in full. Concretely:
  (1) every property ID (Type Invariants, Function Contracts, Module-Level Safety
