[workspace]
resolver = "2"
default-members = ["src/microvm"]
members = [
        "src/benchmarks/matmul",
        "src/benchmarks/echo-rust-nostd",
        "src/benchmarks/echo-wasm-rust",
        "src/benchmarks/noop-rust-nostd",
        "src/benchmarks/noop-wasm-rust",
        "src/daemons/linuxd",
        "src/daemons/memd",
        "src/daemons/procd",
        "src/daemons/wasmd",
        "src/kernel",
        "src/libs/arch",
        "src/libs/bitmap",
        "src/libs/config",
        "src/libs/elf",
        "src/libs/error",
        "src/libs/nvx",
        "src/libs/posix",
        "src/libs/proc",
        "src/libs/profiler",
        "src/libs/raw-array",
        "src/libs/slab",
        "src/libs/static_assert",
        "src/libs/syscomm",
        "src/libs/syslog",
        "src/libs/sys",
        "src/libs/time",
        "src/libs/type-safe",
        "src/microvm",
        "src/tests/linux-app",
        "src/tests/testd",
        "src/user/hello-rust-nostd",
        "src/user/hello-wasm",
        "src/utils/echo-client",
        "src/utils/loader",
        "src/utils/nanvixd",
]

[workspace.package]
version = "0.5.17"
license-file = "LICENSE.txt"
authors = ["The Maintainers of Nanvix"]
edition = "2021"
homepage = "https://github.com/nanvix"

[workspace.dependencies]
arch = { path = "src/libs/arch", default-features = false }
anyhow = "1.0.97"
bitmap = { path = "src/libs/bitmap", default-features = false }
cc = "1.2.17"
cfg-if = "1.0.0"
config = { path = "src/libs/config", default-features = false }
elf = { path = "src/libs/elf", default-features = false }
error = { path = "src/libs/error", default-features = false }
fastrand = { version = "2.3.0", default-features = false }
flexi_logger = "0.30.0"
goblin = { version = "0.9.3", default-features = false }
http-body-util = "0.1.3"
hyperlight_common = { git = "https://github.com/nanvix/hyperlight", rev = "ce4ad858ab04c4f781a1d59298661fc90fda7a01", default-features = false, package = "hyperlight-common" }
hyperlight_host = { git = "https://github.com/nanvix/hyperlight/", rev = "ce4ad858ab04c4f781a1d59298661fc90fda7a01", default-features = false, features = ["kvm", "gdb"], package = "hyperlight-host" } # we use the gdb feature to remove the timeout mechanism
hyper = { version = "1.6.0", default-features = false }
hyper-util = { version = "0.1.11", default-features = false }
kvm-bindings = "0.11.1"
kvm-ioctls = "0.21.0"
libc = "0.2.171"
log = "0.4.27"
micromath = "2.1.0"
num_enum = { version = "0.7.3", default-features = false }
nvx = { path = "src/libs/nvx", default-features = false }
profiler = { path = "src/libs/profiler", default-features = false }
posix = { path = "src/libs/posix", default-features = false }
proc = { path = "src/libs/proc", default-features = false }
raw-array = { path = "src/libs/raw-array", default-features = false }
serde = { version = "1.0.219", default-features = false }
serde_json = { version = "1.0.140", default-features = false, features = [
        "alloc",
] }
signal-hook = "0.3.17"
slab = { path = "src/libs/slab", default-features = false }
spin = { version = "0.10.0", default-features = false }
static_assert = { path = "src/libs/static_assert", default-features = false }
sys = { path = "src/libs/sys", default-features = false }
talc = "4.4.2"
time = { path = "src/libs/time", default-features = false }
tokio = { version = "1.44.1", default-features = false }
type-safe = { path = "src/libs/type-safe", default-features = false }
syscomm = { path = "src/libs/syscomm", default-features = false }
syslog = { path = "src/libs/syslog", default-features = false }
wasmi = { version = "0.44.0", default-features = false }

[profile.dev]
opt-level = 0
debug = true
strip = false
debug-assertions = true
overflow-checks = true
lto = false
panic = 'unwind'
incremental = true
codegen-units = 256
rpath = false

[profile.release]
opt-level = 3
debug = false
strip = true
debug-assertions = false
overflow-checks = false
lto = true
panic = 'abort'
incremental = false
codegen-units = 1
rpath = false

[profile.dev-wasm]
inherits = "dev"
opt-level = "z"
lto = true

[profile.release-wasm]
inherits = "release"
opt-level = "z"
lto = true

[workspace.lints.rust]
warnings = "deny"
