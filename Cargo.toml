[profile.dev]
opt-level = 3
debug = 2
strip = false
debug-assertions = true
overflow-checks = true
lto = false
panic = 'unwind'
incremental = true
codegen-units = 1
rpath = false

[profile.release]
opt-level = 3
debug = false
strip = true
debug-assertions = false
overflow-checks = false
lto = true
panic = 'abort'
incremental = false
codegen-units = 1
rpath = false

# Profiling build: release performance with symbols and frame pointers.
# Use: cargo build --profile release-profiling
[profile.release-profiling]
inherits = "release"
strip = false
debug = "line-tables-only"

[workspace.lints.rust]
warnings = "deny"
unused_features = "allow"
unexpected_cfgs = { level = "deny", check-cfg = [
        "cfg(verus_keep_ghost)",
        "cfg(verus_keep_ghost_body)",
        'cfg(target_os, values("nanvix"))',
] }

[workspace.lints.clippy]
all = "deny"
# TODO (#1146): Enable restriction linting rules, once they are fixed.
# restriction = "deny"
# TODO (#1147): Enable pedantic linting rules, once they are fixed.
# pedantic = "deny"
# TODO (#1148): Enable nursery linting rules, once they are fixed.
# nursery = "deny"
# TODO (#1149): Enable cargo linting rules, once they are fixed.
# cargo = "deny"
