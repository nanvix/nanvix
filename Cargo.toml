[workspace.package]
version = "0.23.5"
license-file = "LICENSE.txt"
authors = ["The Maintainers of Nanvix"]
edition = "2021"
homepage = "https://github.com/nanvix"

[workspace.dependencies]
arch = { path = "src/libs/arch", default-features = false }
