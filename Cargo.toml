[workspace]
resolver = "2"
default-members = ["src/microvm"]
members = [
        "src/benchmarks/boottime",
        "src/benchmarks/echo",
        "src/benchmarks/linux-app",
        "src/daemons/linuxd",
        "src/daemons/memd",
        "src/daemons/procd",
        "src/daemons/wasmd",
        "src/kernel",
        "src/libs/bitmap",
        "src/libs/config",
        "src/libs/error",
        "src/libs/nvx",
        "src/libs/posix",
        "src/libs/proc",
        "src/libs/raw-array",
        "src/libs/slab",
        "src/libs/sys",
        "src/microvm",
        "src/tests/testd",
        "src/user/hello-rust",
        "src/user/hello-wasm",
        "src/utils/echo-client",
        "src/utils/loader",
        "src/utils/nanvixd",
]

[workspace.package]
version = "2.0.0"
license-file = "LICENSE.txt"
authors = ["The Maintainers of Nanvix"]
edition = "2021"
homepage = "https://github.com/nanvix"

[workspace.dependencies]
anyhow = "1.0.95"
bitmap = { path = "src/libs/bitmap", default-features = false }
cc = "1.2.6"
cfg-if = "1.0.0"
config = { path = "src/libs/config", default-features = false }
error = { path = "src/libs/error", default-features = false }
flexi_logger = "0.29.8"
http-body-util = "0.1.2"
hyperlight_common = { git = "https://github.com/nanvix/hyperlight", default-features = false, package = "hyperlight-common" }
hyperlight_host = { git = "https://github.com/nanvix/hyperlight/", default-features = false, package = "hyperlight-host" }
hyper = { version = "1.5.2", default-features = false }
hyper-util = { version = "0.1.9", default-features = false }
kvm-bindings = "0.10.0"
kvm-ioctls = "0.19.1"
libc = "0.2.169"
log = "0.4.22"
num_enum = { version = "0.7.3", default-features = false }
nvx = { path = "src/libs/nvx", default-features = false }
posix = { path = "src/libs/posix", default-features = false }
proc = { path = "src/libs/proc", default-features = false }
raw-array = { path = "src/libs/raw-array", default-features = false }
serde = { version = "1.0.217", default-features = false }
serde_json = "1.0.134"
signal-hook = "0.3.17"
slab = { path = "src/libs/slab", default-features = false }
spin = "0.9.8"
sys = { path = "src/libs/sys", default-features = false }
talc = "4.4.2"
tokio = { version = "1.42.0", default-features = false }
wasm-bindgen = "0.2.93"
wasmi = { version = "0.40.0", default-features = false }

[profile.dev]
opt-level = 0
debug = true
strip = false
debug-assertions = true
overflow-checks = true
lto = false
panic = 'unwind'
incremental = true
codegen-units = 256
rpath = false

[profile.release]
opt-level = 3
debug = false
strip = true
debug-assertions = false
overflow-checks = false
lto = true
panic = 'abort'
incremental = false
codegen-units = 1
rpath = false

[profile.dev-wasm]
inherits = "dev"
opt-level = "z"
lto = true

[profile.release-wasm]
inherits = "release"
opt-level = "z"
lto = true

[workspace.lints.rust]
warnings = "deny"
